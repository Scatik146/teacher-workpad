<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Гора и Ключ: лист для вклейки</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#eee;font:15px/1.4 "Segoe UI",Arial,sans-serif;color:#222}
  .bar{padding:10px 16px;background:#0f2a22;color:#eef4ef;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .bar button{font:inherit;font-weight:700;background:#c27a3a;color:#fff;border:0;border-radius:16px;padding:6px 14px;cursor:pointer}
  .sheet{width:210mm;min-height:297mm;margin:12px auto;background:#fff;padding:12mm 20mm}
  .cut{border-top:1.5px dashed #888;margin:6mm 0 4mm;position:relative}
  .cut span{position:absolute;top:-9px;left:0;background:#fff;padding-right:6px;font-size:12px;color:#666}
  .cap{font-size:13px;color:#555;margin:0 0 2mm}
  .kon svg{width:100%;height:auto;display:block}
  .ds{width:120mm}
  .lines{border-bottom:1px solid #999;height:8mm}
  @media print{ body{background:#fff} .bar{display:none} .sheet{margin:0;padding:10mm 20mm;width:auto;min-height:auto} @page{size:A4;margin:0} }
</style>
</head>
<body>
<div class="bar"><b>Лист для вклейки в тетрадь</b><span>Для тех, кто не успел перерисовать. Одна копия — один ученик. Вырезать по пунктиру.</span><button onclick="window.print()">Печать</button></div>
<div class="sheet">
  <div class="cut"><span>✂</span></div>
  <p class="cap">Стоп-кадр 1 · формула промпта</p><div class="kon" id="k1"></div>
  <p class="cap" style="margin-top:3mm">Части нашего промпта:</p>
  <div class="lines"></div><div class="lines"></div>
  <div class="cut"><span>✂</span></div>
  <p class="cap">Стоп-кадр 2 · как студия делает игру</p><div class="ds" id="d1"></div>
  <div class="cut"><span>✂</span></div>
  <p class="cap">Наш финал ближе к сказу … , потому что …</p>
  <div class="lines"></div><div class="lines"></div>
  <div class="cut"><span>✂</span></div>
</div>
<script src="tekst.js"></script>
<script src="../../lib/drakon-graf/drakon-graf.min.js"></script>
<script src="../../lib/drakon-graf/konspekt.js"></script>
<script src="../../lib/drakonwidget/drakonwidget.js"></script>
<script src="../../lib/drakon-shema/drakon-shema.js"></script>
<script>
try { Konspekt.draw(document.getElementById('k1'), T.stop1.konspekt, { class:6, width:640, theme:'bw' }); } catch(e){}
try { DrakonShema.pokazat(document.getElementById('d1'), T.stop2.shema); } catch(e){}
</script>
</body>
</html>
