<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Русские счёты</title>
<style>
:root { --ink: #1a1a1a; --bg: #fbf8f2; --muted: #5b5b5b; --blue: #1d4ed8; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: clamp(15px, 1.25vw + 8px, 26px); display: flex; flex-direction: column; }
header { font-size: .78em; display: flex; flex-wrap: wrap; align-items: center; gap: .6em 1.2em; padding: .6em 1em; border-bottom: 2px solid #e4dccd; background: #fff; }
header h1 { font-size: 1.3em; margin: 0 auto 0 0; }
.seg { display: inline-flex; border: 2px solid var(--blue); border-radius: .6em; overflow: hidden; }
.seg button { font: inherit; font-weight: 700; padding: .45em .9em; border: 0; background: #fff; color: var(--blue); cursor: pointer; min-height: 2.6em; touch-action: manipulation; }
.seg button[aria-pressed="true"] { background: var(--blue); color: #fff; }
main { flex: 1; display: grid; grid-template-columns: 1fr 1fr minmax(13em, .62fr); gap: 1.5em; padding: .6em 1.2em; align-items: stretch; min-height: 0; }
.slot { display: flex; min-height: 0; min-width: 0; }
.log { display: flex; flex-direction: column; gap: .5em; min-height: 0; background: #fff; border: 2px solid #e4dccd; border-radius: .8em; padding: .7em .8em; }
.log h2 { font-size: 1em; margin: 0; }
.log .sub { font-size: .75em; color: var(--muted); margin: -.3em 0 0; }
.log .wrap { flex: 1; overflow: auto; min-height: 3em; }
.log table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.log th { font-size: .7em; color: var(--muted); text-align: left; padding: 0 .3em .2em; border-bottom: 2px solid var(--ink); }
.log td { padding: .15em .3em; border-bottom: 1px solid #eee; vertical-align: middle; }
.log td.l { font-size: 1.3em; font-weight: 800; }
.log td.r { font-size: 1em; font-weight: 700; color: #0f766e; }
.log td.x { text-align: center; width: 2.6em; }
.log td.x label { display: inline-flex; width: 2.2em; height: 2.2em; align-items: center; justify-content: center; cursor: pointer; }
.log td.x input { width: 1.4em; height: 1.4em; cursor: pointer; accent-color: #b42318; }
.log tr.drop td.l, .log tr.drop td.r { color: #9a9a9a; text-decoration: line-through; text-decoration-thickness: 3px; text-decoration-color: #b42318; }
.log tr.drop td { background: #ecebe8; }
.log .empty { color: var(--muted); font-size: .8em; font-weight: 600; }
.log button { font: inherit; font-weight: 700; padding: .45em .8em; border-radius: .5em; cursor: pointer; min-height: 2.6em; touch-action: manipulation; }
.log .rec { border: 2px solid #1d4ed8; background: #1d4ed8; color: #fff; }
.log .wipe { border: 2px solid #6b6b6b; background: #fff; color: #444; font-size: .8em; }
.hint { text-align: center; color: var(--muted); font-size: .85em; padding: 0 1em .8em; margin: 0; }
@media (max-width: 900px) { main { grid-template-columns: 1fr; } }
.abacus-controls { font-size: .78em; }
.abacus-controls .ab-input:not(.ab-amount) { width: 5.2em; }
.abacus-controls .ab-input.ab-amount { width: 4em; }
.log { font-size: .9em; }
/* ---- Счёты (общий стиль компонента) ---- */
.abacus { display: flex; flex-direction: column; align-items: center; gap: .4em; min-width: 0; min-height: 0; width: 100%; }
.abacus-head { display: flex; flex-direction: column; align-items: center; }
.abacus-foot { display: flex; flex-direction: column; align-items: center; gap: .3em; width: 100%; }
.abacus-title { font-weight: 700; font-size: 1.05em; color: var(--ink, #1a1a1a); }
.abacus-number { font-size: 2em; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: .02em;
  color: var(--ink, #1a1a1a); line-height: 1.1; min-height: 1.1em; }
.abacus-number.hidden { visibility: hidden; }
.abacus-svg { width: 100%; height: auto; max-height: 100%; display: block; touch-action: manipulation; user-select: none; -webkit-user-select: none; flex: 1 1 auto; min-height: 0; }
.abacus[data-mode="live"] .abacus-svg { touch-action: none; }
.ab-frame { fill: #7a4a23; stroke: #4a2a10; stroke-width: 3; }
.ab-inner { fill: #f3e6cf; stroke: #5a3516; stroke-width: 2; }
.ab-wire { stroke: #8d8d8d; stroke-width: 3; }
.ab-bead { transition: transform .24s ease; }
.ab-bead-body { fill: #e9b56b; stroke: #8a5520; stroke-width: 2; }
.ab-bead.dark .ab-bead-body { fill: #3b2414; stroke: #1c0f06; }
.ab-bead-shine { fill: rgba(255,255,255,.45); }
.ab-bead.dark .ab-bead-shine { fill: rgba(255,255,255,.25); }
.ab-bead.flash .ab-bead-body { stroke: #d6336c; stroke-width: 4; }
.abacus[data-mode="live"] .ab-bead { cursor: grab; }
.ab-bead.grab { cursor: grabbing; }
.ab-bead.grab .ab-bead-body { stroke: #1d4ed8; stroke-width: 4; }
.abacus-msg { min-height: 1.4em; font-size: .95em; font-weight: 600; text-align: center; }
.abacus-msg.err { color: #b42318; }
.abacus-msg.note { color: #9a5b00; }
.abacus-controls { display: flex; flex-wrap: wrap; gap: .4em; justify-content: center; }
.ab-btn { font: inherit; font-size: 1em; font-weight: 700; padding: .45em .9em; border-radius: .5em; border: 2px solid #1d4ed8;
  background: #fff; color: #1d4ed8; cursor: pointer; min-height: 2.6em; touch-action: manipulation; }
.ab-btn:hover { background: #eef3ff; }
.ab-btn:active { transform: translateY(1px); }
.ab-btn.ab-double { background: #1d4ed8; color: #fff; }
.ab-btn.ab-halve { background: #0f766e; border-color: #0f766e; color: #fff; }
.ab-btn.ab-clear { border-color: #6b6b6b; color: #444; }
.ab-input { font: inherit; font-size: 1em; width: 7.5em; padding: .4em .5em; border: 2px solid #888; border-radius: .5em; min-height: 2.6em; }
@media (prefers-reduced-motion: reduce) { .ab-bead { transition: none; } }

.ab-addn { display: inline-flex; gap: .3em; align-items: center; }
.ab-input.ab-amount { width: 5.2em; text-align: center; font-weight: 700; }
.ab-btn.ab-plus, .ab-btn.ab-minus { border-color: #9a5b00; color: #9a5b00; }

</style>
</head>
<body>
<header>
  <h1>Русские счёты</h1>
  <div class="seg" role="group" aria-label="Режим">
    <button type="button" data-mode="buttons" aria-pressed="true">Кнопочный</button>
    <button type="button" data-mode="live" aria-pressed="false">Живые счёты</button>
  </div>
  <div class="seg" role="group" aria-label="Число">
    <button type="button" id="numToggle" aria-pressed="true">Число видно</button>
  </div>
  <div class="seg" role="group" aria-label="Скорость">
    <button type="button" data-speed="420" aria-pressed="false">Медленно</button>
    <button type="button" data-speed="260" aria-pressed="true">Обычно</button>
    <button type="button" data-speed="60" aria-pressed="false">Быстро</button>
  </div>
</header>
<main>
  <div class="slot" id="slot1"></div>
  <div class="slot" id="slot2"></div>
  <aside class="log" aria-label="Запись">
    <h2>Запись</h2>
    <p class="sub">Числа с обоих счётов. Вписать вручную нельзя — только кнопкой. Флажок — зачеркнуть строку.</p>
    <button type="button" class="rec" id="rec">Записать строку</button>
    <div class="wrap"><table>
      <thead><tr><th>счёты 1</th><th>счёты 2</th><th>зачеркнуть</th></tr></thead>
      <tbody id="logList"></tbody>
    </table></div>
    <div class="empty" id="logEmpty">Пока пусто</div>
    <button type="button" class="wipe" id="wipe">Стереть запись</button>
  </aside>
</main>
<p class="hint" id="hint">Отложенные костяшки — слева. Тёмные — пятая и шестая, по ним удобно считать. Верхняя проволока — старший разряд.</p>
<script>
/* ============================================================
   РУССКИЕ СЧЁТЫ — общий компонент (один и тот же код в schety.html
   и в presentation.html).
   Часть 1. ЯДРО: чистые функции, ничего не знают про экран.
   Часть 2. ВИД: рисует счёты в SVG, кнопки, перетаскивание.
   Часть 3. УПРАВЛЕНИЕ ИЗВНЕ: postMessage.
   ============================================================ */
(function (global) {
  'use strict';

  /* ---------------- Часть 1. ЯДРО ---------------- */
  // Состояние — массив цифр, digits[0] — единицы, digits[k] — 10^k.
  // На каждой проволоке 10 костяшек; отложено столько, сколько цифра.
  // Все операции возвращают {ok, digits, steps, error, remainder}.
  // steps — цепочка промежуточных состояний (для показа переноса по шагам).

  function OverflowError(msg) { this.message = msg; }

  function fromNumber(n, size) {
    var d = [];
    for (var i = 0; i < size; i++) { d.push(n % 10); n = Math.floor(n / 10); }
    return d;
  }
  function toNumber(d) {
    var n = 0;
    for (var i = d.length - 1; i >= 0; i--) n = n * 10 + d[i];
    return n;
  }
  function maxValue(size) { return Math.pow(10, size) - 1; }
  function snap(d, wire, note) { return { digits: d.slice(), wire: wire, note: note || '' }; }

  // Прибавить k (1..10) костяшек на проволоку pos. Честный перенос:
  // если не помещается — +1 на следующей проволоке и снимаем (10 − k) здесь.
  function addAt(d, pos, k, steps) {
    if (k <= 0) return;
    if (pos >= d.length) throw new OverflowError('Не хватает проволок на счётах');
    if (d[pos] + k <= 9) {
      d[pos] += k;
      steps.push(snap(d, pos, '+' + k));
      return;
    }
    addAt(d, pos + 1, 1, steps);            // перенос в старший разряд
    d[pos] = d[pos] + k - 10;               // снимаем 10 − k
    steps.push(snap(d, pos, '+' + k + ' = +10 − ' + (10 - k)));
  }

  // Снять k (1..10) костяшек с проволоки pos. Честный заём из старшего разряда.
  function subAt(d, pos, k, steps) {
    if (k <= 0) return;
    if (pos >= d.length) throw new OverflowError('Меньше нуля счёты не умеют');
    if (d[pos] >= k) {
      d[pos] -= k;
      steps.push(snap(d, pos, '−' + k));
      return;
    }
    subAt(d, pos + 1, 1, steps);            // занимаем десяток
    d[pos] = d[pos] + 10 - k;
    steps.push(snap(d, pos, '−' + k + ' = −10 + ' + (10 - k)));
  }

  function run(digits, fn) {
    var d = digits.slice(), steps = [];
    try {
      var extra = fn(d, steps) || {};
      return { ok: true, digits: d, steps: steps, remainder: extra.remainder || 0, error: null };
    } catch (e) {
      if (e instanceof OverflowError) return { ok: false, digits: digits.slice(), steps: [], remainder: 0, error: e.message };
      throw e;
    }
  }

  function fail(digits, msg) { return { ok: false, digits: digits.slice(), steps: [], remainder: 0, error: msg }; }
  function checkN(digits, n) {
    if (typeof n !== 'number' || !isFinite(n) || n < 0 || Math.floor(n) !== n) return fail(digits, 'Нужно целое число от 0');
    if (n > maxValue(digits.length)) return fail(digits, 'Слишком большое число для этих счётов');
    return null;
  }

  var Core = {
    fromNumber: fromNumber,
    toNumber: toNumber,
    maxValue: maxValue,

    inc: function (digits) { return run(digits, function (d, s) { addAt(d, 0, 1, s); }); },

    // Прибавить число: разряд за разрядом сверху вниз, как на настоящих счётах.
    // Перенос уходит в уже обработанный старший разряд — это верно.
    add: function (digits, n) {
      var bad = checkN(digits, n); if (bad) return bad;
      if (toNumber(digits) + n > maxValue(digits.length)) return fail(digits, 'Не хватает проволок: ' + toNumber(digits) + ' + ' + n + ' не помещается');
      return run(digits, function (d, s) {
        var k = fromNumber(n, d.length);
        for (var i = d.length - 1; i >= 0; i--) addAt(d, i, k[i], s);
      });
    },

    // Отнять число: разряд за разрядом сверху вниз, с честным заёмом.
    sub: function (digits, n) {
      var bad = checkN(digits, n); if (bad) return bad;
      if (n > toNumber(digits)) return fail(digits, 'Меньше нуля счёты не умеют: ' + toNumber(digits) + ' − ' + n);
      return run(digits, function (d, s) {
        var k = fromNumber(n, d.length);
        for (var i = d.length - 1; i >= 0; i--) subAt(d, i, k[i], s);
      });
    },
    dec: function (digits) { return run(digits, function (d, s) { subAt(d, 0, 1, s); }); },

    // Удвоить = прибавить число к самому себе, проволока за проволокой,
    // сверху вниз (перенос уходит в уже удвоенный старший разряд — так верно).
    double: function (digits) {
      return run(digits, function (d, s) {
        var orig = d.slice();
        for (var i = d.length - 1; i >= 0; i--) addAt(d, i, orig[i], s);
      });
    },

    // Уполовинить = честная половина каждого разряда сверху вниз.
    // Нечётный разряд отдаёт «пятёрку» в младший. Остаток единиц — забываем.
    halve: function (digits) {
      return run(digits, function (d, s) {
        var carry = 0;
        for (var i = d.length - 1; i >= 0; i--) {
          var v = d[i], half = Math.floor(v / 2);
          subAt(d, i, v - half, s);
          if (carry) addAt(d, i, 5, s);       // half ≤ 4, значит до 9 — без переноса
          carry = v % 2;
        }
        return { remainder: carry };
      });
    },

    set: function (digits, n) {
      n = Number(n);
      if (!isFinite(n) || n < 0 || Math.floor(n) !== n) {
        return { ok: false, digits: digits.slice(), steps: [], remainder: 0, error: 'Нужно целое число от 0' };
      }
      if (n > maxValue(digits.length)) {
        return { ok: false, digits: digits.slice(), steps: [], remainder: 0, error: 'Не хватает проволок: максимум ' + maxValue(digits.length) };
      }
      var target = fromNumber(n, digits.length), d = digits.slice(), steps = [];
      for (var i = d.length - 1; i >= 0; i--) {
        if (d[i] !== target[i]) { d[i] = target[i]; steps.push(snap(d, i, '')); }
      }
      return { ok: true, digits: d, steps: steps, remainder: 0, error: null };
    },

    clear: function (digits) { return Core.set(digits, 0); },

    // Перетаскивание: на проволоке pos стало target костяшек (0..10).
    // target = 10 — проволока переполнилась: честный перенос.
    setWire: function (digits, pos, target) {
      return run(digits, function (d, s) {
        var delta = target - d[pos];
        if (delta > 0) addAt(d, pos, delta, s);
        else if (delta < 0) subAt(d, pos, -delta, s);
      });
    }
  };

  /* ---------------- Часть 2. ВИД ---------------- */
  var SVGNS = 'http://www.w3.org/2000/svg';
  var BW = 40, BH = 50, GAP = 4.2 * 40, PAD = 26, ROW = 66;
  var registry = {};
  var reduceMotion = global.matchMedia && global.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function el(tag, attrs, parent) {
    var e = document.createElementNS(SVGNS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  function h(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function fmt(n) { var s = String(n); return s.length < 5 ? s : s.replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }

  var LABELS = { double: 'Удвоить', halve: 'Уполовинить', inc: '+1', dec: '−1', clear: 'Сброс' };
  function parseNum(s) { s = String(s == null ? '' : s).replace(/\s/g, ''); return /^\d+$/.test(s) ? Number(s) : NaN; }

  function Abacus(container, opts) {
    opts = opts || {};
    var self = this;
    this.id = opts.id || ('abacus' + Object.keys(registry).length);
    this.size = opts.wires || 7;
    this.digits = fromNumber(opts.value || 0, this.size);
    this.mode = opts.mode === 'live' ? 'live' : 'buttons';
    this.stepMs = opts.stepMs != null ? opts.stepMs : 280;
    this.showNumber = opts.showNumber !== false;
    this.queue = Promise.resolve();
    this.busy = 0;
    this.listeners = [];
    registry[this.id] = this;

    var root = h('div', 'abacus');
    root.dataset.mode = this.mode;
    this.root = root;
    var head = h('div', 'abacus-head');
    if (opts.title) head.appendChild(h('div', 'abacus-title', opts.title));
    this.numberEl = h('div', 'abacus-number', '0');
    if (!this.showNumber) this.numberEl.classList.add('hidden');
    head.appendChild(this.numberEl);
    root.appendChild(head);

    // SVG
    var L = 10 * BW + GAP;
    this.xL = PAD + 18;
    this.xR = this.xL + L;
    var W = this.xR + 18 + PAD, H = PAD * 2 + this.size * ROW;
    var svg = el('svg', { viewBox: '0 0 ' + W + ' ' + H, class: 'abacus-svg', role: 'img',
      'aria-label': 'Русские счёты' });
    this.svg = svg;
    el('rect', { x: 4, y: 4, width: W - 8, height: H - 8, rx: 16, class: 'ab-frame' }, svg);
    el('rect', { x: PAD, y: PAD - 6, width: W - 2 * PAD, height: H - 2 * PAD + 12, rx: 6, class: 'ab-inner' }, svg);

    this.beads = [];
    for (var w = 0; w < this.size; w++) {
      var row = this.size - 1 - w;            // старший разряд — сверху
      var cy = PAD + row * ROW + ROW / 2;
      el('line', { x1: PAD, y1: cy, x2: W - PAD, y2: cy, class: 'ab-wire' }, svg);
      var wireBeads = [];
      for (var j = 0; j < 10; j++) {
        var g = el('g', { class: 'ab-bead' + (j === 4 || j === 5 ? ' dark' : ''), 'data-w': w, 'data-j': j }, svg);
        el('rect', { x: 0, y: cy - BH / 2, width: BW - 3, height: BH, rx: 17, class: 'ab-bead-body' }, g);
        el('rect', { x: 6, y: cy - BH / 2 + 6, width: BW - 15, height: 8, rx: 4, class: 'ab-bead-shine' }, g);
        wireBeads.push(g);
      }
      this.beads.push(wireBeads);
    }
    root.appendChild(svg);

    var foot = h('div', 'abacus-foot');
    this.msgEl = h('div', 'abacus-msg');
    this.msgEl.setAttribute('aria-live', 'polite');
    foot.appendChild(this.msgEl);
    root.appendChild(foot);

    // Кнопки компонента
    var controls = opts.controls || ['double', 'halve', 'clear'];
    if (controls.length) {
      var bar = h('div', 'abacus-controls');
      controls.forEach(function (c) {
        if (c === 'set') {
          var inp = h('input', 'ab-input');
          inp.type = 'text'; inp.inputMode = 'numeric'; inp.placeholder = 'число';
          inp.setAttribute('aria-label', 'Число для счётов');
          var b = h('button', 'ab-btn', 'Установить');
          b.type = 'button';
          var go = function () { self.command('set', inp.value.replace(/\s/g, '')); };
          b.addEventListener('click', go);
          inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') go(); });
          bar.appendChild(inp); bar.appendChild(b);
          return;
        }
        if (c === 'addn') {
          var grp = h('span', 'ab-addn');
          var plus = h('button', 'ab-btn ab-plus', '+ число');
          var amt = h('input', 'ab-input ab-amount');
          amt.type = 'text'; amt.inputMode = 'numeric'; amt.value = '1';
          amt.setAttribute('aria-label', 'Сколько прибавить или отнять');
          var minus = h('button', 'ab-btn ab-minus', '− число');
          plus.type = minus.type = 'button';
          plus.addEventListener('click', function () { self.command('add', amt.value); });
          minus.addEventListener('click', function () { self.command('sub', amt.value); });
          grp.appendChild(plus); grp.appendChild(amt); grp.appendChild(minus);
          bar.appendChild(grp);
          return;
        }
        var btn = h('button', 'ab-btn ab-' + c, LABELS[c]);
        btn.type = 'button';
        btn.addEventListener('click', function () { self.command(c); });
        bar.appendChild(btn);
      });
      foot.appendChild(bar);
    }

    container.appendChild(root);
    this.render(this.digits, true);
    this.setupDrag();
  }

  Abacus.prototype.value = function () { return toNumber(this.digits); };

  Abacus.prototype.beadX = function (j, v) {
    return j < v ? this.xL + j * BW : this.xR - (10 - j) * BW;
  };

  Abacus.prototype.render = function (digits, instant, wireHint) {
    for (var w = 0; w < this.size; w++) {
      var v = digits[w];
      for (var j = 0; j < 10; j++) {
        var g = this.beads[w][j];
        g.style.transition = (instant || reduceMotion) ? 'none' : '';
        g.style.transform = 'translate(' + this.beadX(j, v) + 'px,0)';
        g.classList.toggle('counted', j < v);
      }
    }
    if (wireHint != null) {
      var flash = this.beads[wireHint];
      flash.forEach(function (g) { g.classList.add('flash'); });
      setTimeout(function () { flash.forEach(function (g) { g.classList.remove('flash'); }); }, 260);
    }
    this.numberEl.textContent = fmt(toNumber(digits));
  };

  Abacus.prototype.say = function (text, kind) {
    var m = this.msgEl;
    m.textContent = text || '';
    m.className = 'abacus-msg' + (kind ? ' ' + kind : '');
    clearTimeout(this._msgT);
    if (text) this._msgT = setTimeout(function () { m.textContent = ''; }, 4500);
  };

  Abacus.prototype.on = function (fn) { this.listeners.push(fn); };
  Abacus.prototype.emit = function () {
    var self = this, v = this.value();
    this.listeners.forEach(function (fn) { fn(v, self); });
    var msg = { type: 'abacus:state', id: this.id, value: v, busy: this.busy > 0 };
    try { (global.parent !== global ? global.parent : global).postMessage(msg, '*'); } catch (e) {}
  };

  // Проиграть шаги ядра по одному
  Abacus.prototype.play = function (res) {
    var self = this;
    if (!res.ok) return Promise.resolve(res);
    var steps = res.steps, i = 0, ms = reduceMotion ? 0 : this.stepMs;
    return new Promise(function (resolve) {
      function next() {
        if (i >= steps.length) { self.digits = res.digits.slice(); self.render(self.digits, false); resolve(res); return; }
        var s = steps[i++];
        self.render(s.digits, false, s.wire);
        if (ms) setTimeout(next, ms); else next();
      }
      next();
    });
  };

  // Единая точка входа: кнопки, перетаскивание, postMessage
  Abacus.prototype.command = function (cmd, value) {
    var self = this;
    var p = this.queue.then(function () {
      self.busy++;
      var res;
      switch (cmd) {
        case 'set': res = Core.set(self.digits, value); break;
        case 'clear': res = Core.clear(self.digits); break;
        case 'double':
          res = Core.double(self.digits);
          if (!res.ok) res.error = 'Не хватает проволок: ' + fmt(self.value()) + ' × 2 не помещается';
          break;
        case 'halve': res = Core.halve(self.digits); break;
        case 'inc': res = Core.inc(self.digits); break;
        case 'add': res = Core.add(self.digits, typeof value === 'number' ? value : parseNum(value == null || value === '' ? 1 : value)); break;
        case 'sub': res = Core.sub(self.digits, typeof value === 'number' ? value : parseNum(value == null || value === '' ? 1 : value)); break;
        case 'dec': res = Core.dec(self.digits); break;
        case 'wire': res = Core.setWire(self.digits, value.wire, value.target); break;
        case 'mode': self.setMode(value); res = { ok: true, digits: self.digits, steps: [] }; break;
        case 'number': self.toggleNumber(value); res = { ok: true, digits: self.digits, steps: [] }; break;
        case 'get': res = { ok: true, digits: self.digits, steps: [] }; break;
        default: res = { ok: false, digits: self.digits, steps: [], error: 'Неизвестная команда' };
      }
      if (!res.ok) { self.say(res.error, 'err'); self.busy--; self.render(self.digits, false); return res; }
      return self.play(res).then(function () {
        self.busy--;
        if (cmd === 'halve' && res.remainder) self.say('Остаток 1 — делим нацело, остаток забываем', 'note');
        else if ((cmd === 'add' || cmd === 'sub') && res.steps.length) self.say('', '');
        else if (cmd !== 'get' && cmd !== 'mode' && cmd !== 'number') self.say('');
        self.emit();
        return res;
      });
    });
    this.queue = p.catch(function () {});
    return p;
  };

  Abacus.prototype.setMode = function (mode) {
    this.mode = mode === 'live' ? 'live' : 'buttons';
    this.root.dataset.mode = this.mode;
  };
  Abacus.prototype.toggleNumber = function (show) {
    this.showNumber = show == null ? !this.showNumber : !!show;
    this.numberEl.classList.toggle('hidden', !this.showNumber);
  };

  // Живые счёты: взялся за костяшку — едет вся группа до края
  Abacus.prototype.setupDrag = function () {
    var self = this, drag = null;
    function svgX(evt) {
      var pt = self.svg.createSVGPoint();
      pt.x = evt.clientX; pt.y = evt.clientY;
      return pt.matrixTransform(self.svg.getScreenCTM().inverse()).x;
    }
    this.svg.addEventListener('pointerdown', function (e) {
      if (self.mode !== 'live' || self.busy) return;
      var g = e.target.closest && e.target.closest('.ab-bead');
      if (!g) return;
      var w = +g.getAttribute('data-w'), j = +g.getAttribute('data-j'), v = self.digits[w];
      var group = [], dir;
      if (j >= v) { dir = -1; for (var k = v; k <= j; k++) group.push(k); }   // тянем влево — откладываем
      else { dir = 1; for (var k2 = j; k2 < v; k2++) group.push(k2); }        // тянем вправо — убираем
      drag = { w: w, j: j, v: v, dir: dir, group: group, x0: svgX(e), dx: 0, t0: Date.now() };
      group.forEach(function (k) { self.beads[w][k].style.transition = 'none'; self.beads[w][k].classList.add('grab'); });
      self.svg.setPointerCapture(e.pointerId);
      e.preventDefault();
    });
    this.svg.addEventListener('pointermove', function (e) {
      if (!drag) return;
      var dx = svgX(e) - drag.x0;
      dx = drag.dir < 0 ? Math.max(-GAP, Math.min(0, dx)) : Math.min(GAP, Math.max(0, dx));
      drag.dx = dx;
      drag.group.forEach(function (k) {
        self.beads[drag.w][k].style.transform = 'translate(' + (self.beadX(k, drag.v) + dx) + 'px,0)';
      });
    });
    function end() {
      if (!drag) return;
      var d = drag; drag = null;
      d.group.forEach(function (k) { self.beads[d.w][k].classList.remove('grab'); self.beads[d.w][k].style.transition = ''; });
      var tap = Math.abs(d.dx) < 6 && Date.now() - d.t0 < 400;
      if (tap || Math.abs(d.dx) > GAP * 0.35) {
        var target = d.dir < 0 ? d.j + 1 : d.j;
        self.command('wire', { wire: d.w, target: target });
      } else self.render(self.digits, false);
    }
    this.svg.addEventListener('pointerup', end);
    this.svg.addEventListener('pointercancel', end);
  };

  /* ---------------- Часть 3. УПРАВЛЕНИЕ ЧЕРЕЗ postMessage ----------------
     Команда:  {type:'abacus', id:'left'|'*', cmd:'set'|'clear'|'mode'|'double'|
                'halve'|'inc'|'dec'|'add'|'sub'|'number'|'get', value, reqId}
     Ответ:    {type:'abacus:done', id, reqId, ok, value, error, remainder}
     Изменения:{type:'abacus:state', id, value, busy}                         */
  if (global.addEventListener) global.addEventListener('message', function (e) {
    var m = e.data;
    if (!m || m.type !== 'abacus') return;
    var list = (!m.id || m.id === '*') ? Object.keys(registry).map(function (k) { return registry[k]; }) : [registry[m.id]];
    list.forEach(function (inst) {
      if (!inst) return;
      inst.command(m.cmd, m.value).then(function (res) {
        var reply = { type: 'abacus:done', id: inst.id, reqId: m.reqId, ok: res.ok, value: inst.value(),
          error: res.error || null, remainder: res.remainder || 0 };
        try { (e.source || global).postMessage(reply, '*'); } catch (err) {}
      });
    });
  });

  global.AbacusCore = Core;
  global.Abacus = Abacus;
  global.Abacus.registry = registry;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
(function () {
  var a1 = new Abacus(document.getElementById('slot1'), { id: 'left', wires: 7, controls: ['set', 'double', 'addn', 'clear'], title: 'Счёты 1 — удвоение' });
  var a2 = new Abacus(document.getElementById('slot2'), { id: 'right', wires: 7, controls: ['set', 'halve', 'addn', 'clear'], title: 'Счёты 2 — уполовинивание' });
  var all = [a1, a2];

  // Запись: число попадает сюда только кнопкой, со счётов 1
  var list = document.getElementById('logList'), empty = document.getElementById('logEmpty');
  function fmtN(n) { var s = String(n); return s.length < 5 ? s : s.replace(/\B(?=(\d{3})+(?!\d))/g, '\u2009'); }
  document.getElementById('rec').addEventListener('click', function () {
    // «get» встаёт в очередь каждых счётов: число берётся ровно после действий, нажатых раньше записи
    Promise.all([a1.command('get'), a2.command('get')]).then(function (res) {
      var tr = document.createElement('tr');
      var l = document.createElement('td'); l.className = 'l'; l.textContent = fmtN(AbacusCore.toNumber(res[0].digits));
      var r = document.createElement('td'); r.className = 'r'; r.textContent = fmtN(AbacusCore.toNumber(res[1].digits));
      var x = document.createElement('td'); x.className = 'x';
      var lab = document.createElement('label');
      var cb = document.createElement('input'); cb.type = 'checkbox';
      cb.setAttribute('aria-label', 'Зачеркнуть строку ' + (list.children.length + 1));
      cb.addEventListener('change', function () { tr.classList.toggle('drop', cb.checked); });
      lab.appendChild(cb); x.appendChild(lab);
      tr.appendChild(l); tr.appendChild(r); tr.appendChild(x);
      list.appendChild(tr);
      empty.hidden = true;
      var w = list.closest('.wrap'); w.scrollTop = w.scrollHeight;
    });
  });
  document.getElementById('wipe').addEventListener('click', function () {
    if (list.children.length && !window.confirm('Стереть все записанные числа?')) return;
    list.innerHTML = ''; empty.hidden = false;
  });
  function press(groupSel, btn) {
    document.querySelectorAll(groupSel).forEach(function (b) { b.setAttribute('aria-pressed', b === btn ? 'true' : 'false'); });
  }
  document.querySelectorAll('[data-mode]').forEach(function (b) {
    b.addEventListener('click', function () {
      press('[data-mode]', b);
      all.forEach(function (a) { a.command('mode', b.dataset.mode); });
      document.getElementById('hint').textContent = b.dataset.mode === 'live'
        ? 'Живые счёты: возьмитесь за костяшку и ведите влево — отложить, вправо — убрать. Двигается вся группа. Можно просто коснуться костяшки. Десятая костяшка переполняет проволоку — единица уходит выше.'
        : 'Отложенные костяшки — слева. Тёмные — пятая и шестая, по ним удобно считать. Верхняя проволока — старший разряд.';
    });
  });
  var numBtn = document.getElementById('numToggle');
  numBtn.addEventListener('click', function () {
    var show = numBtn.getAttribute('aria-pressed') !== 'true';
    numBtn.setAttribute('aria-pressed', show ? 'true' : 'false');
    numBtn.textContent = show ? 'Число видно' : 'Число спрятано';
    all.forEach(function (a) { a.command('number', show); });
  });
  document.querySelectorAll('[data-speed]').forEach(function (b) {
    b.addEventListener('click', function () {
      press('[data-speed]', b);
      all.forEach(function (a) { a.stepMs = +b.dataset.speed; });
    });
  });
})();
</script>
</body>
</html>
