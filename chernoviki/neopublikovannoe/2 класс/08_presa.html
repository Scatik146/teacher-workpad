<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Я автор: лестница коллажа</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pangolin&family=Nunito:wght@600;700;800;900&family=Caveat:wght@600;700&display=swap">
<style>
/* Layout: одна сенсорная доска 16:9 — шапка с этапом, рабочее поле, снизу крупная навигация по экранам. Лестница автора — сквозной объект справа. */
:root{
  --paper:#F2F5F9;      /* фон доски */
  --card:#FFFFFF;
  --ink:#1D2738;        /* основной текст */
  --muted:#5B6678;
  --line:#D5DCE6;
  --nav:#24438F;        /* кнопки и навигация */
  --nav-soft:#E3E9F7;
  --rail:#A9773F;       /* дерево лестницы */
  --rail-dark:#7E5427;
  --red:#E0322B;        /* стрелки-сбои */
  --gold:#F2B705;       /* жетоны и звёзды */
  --ok:#2E9B57;
  --s1:#7C5CD6; --s1t:#EEE8FB;
  --s2:#2B8BD6; --s2t:#E2F0FB;
  --s3:#EE7A1F; --s3t:#FDEEDF;
  --s4:#3A9E4C; --s4t:#E3F4E6;
  --s5:#D9A400; --s5t:#FBF3D6;
  --grid:#C9DDF0;       /* клетка тетради */
  --f-display:"Pangolin","Comic Sans MS",cursive;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-hand:"Caveat","Pangolin",cursive;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-weight:700;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-user-select:none;user-select:none;touch-action:manipulation;overflow-x:hidden}
.app{min-height:100%;display:flex;flex-direction:column;gap:12px;padding-block:12px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.stage{font-family:var(--f-display);font-size:clamp(22px,2.6vw,36px);line-height:1.1;text-wrap:balance}
.meta{display:flex;gap:8px;flex-wrap:wrap}
.pill{font-size:15px;padding:6px 12px;border-radius:999px;background:var(--nav-soft);color:var(--nav);letter-spacing:.02em;white-space:nowrap}
.pill.opt{background:var(--card);border:2px dashed var(--line);color:var(--muted)}
main{flex:1;min-height:0}
.screen{display:grid;gap:16px;height:100%}
.split{grid-template-columns:minmax(0,1fr) minmax(250px,320px)}
.three{grid-template-columns:minmax(0,1.5fr) minmax(220px,1fr) minmax(220px,280px)}
.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.lad2{grid-template-columns:minmax(0,1fr) minmax(0,1.2fr)}
@media (max-width:1100px){.three{grid-template-columns:minmax(0,1fr) minmax(220px,300px)}.three>aside{grid-column:1/-1}}
@media (max-width:820px){.split,.three,.two,.lad2{grid-template-columns:1fr}}
.panel{background:var(--card);border-radius:20px;padding:18px;border:2px solid var(--line);min-width:0}
.big{font-family:var(--f-display);font-size:clamp(26px,3.4vw,52px);line-height:1.15;text-wrap:balance;margin:0}
.lead{font-size:clamp(17px,1.6vw,24px);color:var(--muted);margin:0;max-width:60ch}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{font:inherit;font-weight:800;font-size:clamp(16px,1.5vw,22px);border:0;border-radius:16px;padding:14px 22px;min-height:56px;cursor:pointer;background:var(--nav);color:#fff}
.btn.soft{background:var(--nav-soft);color:var(--nav)}
.btn.ghost{background:transparent;color:var(--muted);border:2px solid var(--line)}
.btn:focus-visible,.navbtn:focus-visible,.rung:focus-visible,.card-cmd:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
.btn:active{transform:translateY(2px)}

/* ---------- лестница ---------- */
.ladder{position:relative;display:flex;flex-direction:column;gap:clamp(4px,1vh,10px);padding:clamp(6px,1.2vh,14px) 24px}
.ladder::before,.ladder::after{content:"";position:absolute;top:0;bottom:0;width:14px;border-radius:7px;background:var(--rail);box-shadow:inset -3px 0 0 var(--rail-dark)}
.ladder::before{left:0}.ladder::after{right:0}
.rung{position:relative;z-index:1;display:flex;align-items:center;gap:10px;min-height:64px;border-radius:14px;background:#F7EEE3;border:3px dashed #D9BE9C;padding:6px 10px;font:inherit;color:inherit;text-align:left;width:100%}
.rung .no{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--rail);color:#fff;font-size:18px}
.rung .marks{margin-left:auto;display:flex;gap:6px;align-items:center;flex:none}
.rung.filled{border-style:solid;border-color:transparent;background:transparent;padding:0}
.rung.over{border-color:var(--nav);background:var(--nav-soft)}
.mini .rung{min-height:48px;cursor:pointer}
.mini .chip{font-size:16px;padding:8px 10px;min-height:44px}
.mini .chip .n{width:28px;height:28px;font-size:16px}
.token{width:30px;height:30px;border-radius:50%;background:var(--gold);border:3px solid #fff;box-shadow:0 0 0 2px var(--gold);display:grid;place-items:center;font-size:15px;color:var(--ink)}
.arrow{color:var(--red);font-size:30px;line-height:1;font-family:var(--f-body);font-weight:900}
.stars{color:var(--gold);font-size:22px;white-space:nowrap;text-shadow:0 1px 0 var(--rail-dark)}

/* ---------- карточки шагов ---------- */
.chip{display:flex;align-items:center;gap:12px;width:100%;border-radius:14px;padding:10px 14px;min-height:60px;font-size:clamp(18px,1.7vw,26px);font-family:var(--f-display);border:3px solid var(--c);background:var(--t);color:var(--ink);cursor:grab;touch-action:none}
.chip .n{flex:none;width:36px;height:36px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-family:var(--f-body);font-weight:900;font-size:19px}
.chip[data-s="5"] .n{color:var(--ink)}
.chip[data-s="1"]{--c:var(--s1);--t:var(--s1t)}.chip[data-s="2"]{--c:var(--s2);--t:var(--s2t)}.chip[data-s="3"]{--c:var(--s3);--t:var(--s3t)}.chip[data-s="4"]{--c:var(--s4);--t:var(--s4t)}.chip[data-s="5"]{--c:var(--s5);--t:var(--s5t)}
.tray{display:flex;flex-direction:column;gap:12px;min-height:120px;border-radius:16px;padding:12px;border:3px dashed var(--line)}
.tray.over{border-color:var(--nav);background:var(--nav-soft)}
.ghost-drag{position:fixed;z-index:50;pointer-events:none;opacity:.92;transform:translate(-50%,-50%) rotate(-2deg);box-shadow:0 12px 30px rgba(29,39,56,.25)}
.chip .n.hidden-n{background:var(--card);border:2px solid var(--c);color:var(--c)}

/* ---------- коллаж ---------- */
.collage{width:100%;max-width:100%;aspect-ratio:4/3;border-radius:16px;background:#fff;border:3px solid var(--line);display:block;touch-action:none}
.cap{font-size:15px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin:0 0 8px}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:10px}
.item{background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:6px;cursor:grab;touch-action:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;color:var(--muted)}
.item svg{width:56px;height:56px}
.grp{display:grid;gap:8px}
.grp h4{margin:0;font-size:15px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}

/* ---------- команды ---------- */
.deck{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
@media (max-width:820px){.deck{grid-template-columns:repeat(2,minmax(0,1fr))}}
.card-cmd{font:inherit;aspect-ratio:3/4;border-radius:18px;border:0;cursor:pointer;display:grid;place-items:center;padding:12px;background:repeating-linear-gradient(45deg,var(--nav) 0 14px,#2D4FA6 14px 28px);color:#fff;font-family:var(--f-display);font-size:clamp(34px,4vw,64px)}
.card-cmd.used{opacity:.45}
.card-cmd.cur{outline:5px solid var(--gold);outline-offset:3px}
.cmdbig{background:var(--card);border:3px solid var(--nav);border-radius:22px;padding:22px 26px;display:flex;gap:18px;align-items:center}
.cmdbig .num{flex:none;font-family:var(--f-display);font-size:clamp(28px,3vw,44px);background:var(--nav);color:#fff;border-radius:14px;padding:4px 16px}
.cmdbig .txt{font-family:var(--f-display);font-size:clamp(28px,3.6vw,56px);line-height:1.1}
.rule{font-size:clamp(16px,1.4vw,21px);background:var(--s5t);border:2px solid var(--s5);border-radius:14px;padding:10px 14px}

/* ---------- тетрадь ---------- */
.nb-wrap{position:fixed;inset:0;z-index:40;background:rgba(29,39,56,.45);display:grid;place-items:center;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px))}
.notebook{width:min(760px,100%);max-height:90vh;overflow:auto;border-radius:10px 18px 18px 10px;padding:26px 30px 26px 56px;position:relative;
  background-color:#FFFFFF;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:26px 26px;
  box-shadow:0 20px 50px rgba(0,0,0,.3);font-family:var(--f-hand);font-size:clamp(28px,3vw,40px);line-height:1.3;color:#1F3C8A}
.notebook::before{content:"";position:absolute;left:38px;top:0;bottom:0;width:2px;background:#E86A6A}
.notebook h3{font-family:var(--f-body);font-size:16px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;margin:0 0 10px}
.nb-line{display:flex;gap:16px;align-items:baseline}
.nb-close{position:absolute;top:10px;right:12px}

/* ---------- навигация ---------- */
nav.bottom{display:flex;gap:8px;align-items:center;overflow-x:auto;padding-bottom:4px}
.navbtn{font:inherit;font-weight:800;font-size:15px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);padding:10px 12px;min-height:52px;cursor:pointer;white-space:nowrap;flex:none}
.navbtn.on{background:var(--nav);border-color:var(--nav);color:#fff}
.navbtn.opt{border-style:dashed}
.navbtn.arrowbtn{font-size:22px;min-width:60px}
.spacer{flex:1}
.mark-circle{fill:none;stroke:var(--red);stroke-width:5}
.reveal{border:2px dashed var(--muted);border-radius:12px;padding:10px 14px;font-size:16px;color:var(--muted);background:var(--paper)}
.badge-exp{display:inline-block;background:var(--ink);color:#fff;border-radius:10px;padding:4px 10px;font-size:15px;margin-right:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- вписать в один экран доски ---------- */
.app{height:100%;padding-block:clamp(6px,1.2vh,12px);gap:clamp(6px,1.2vh,12px)}
main{overflow:auto}
.panel{padding:clamp(8px,1.6vh,18px)}
.grp{gap:clamp(4px,1vh,8px)}
.screen{gap:clamp(8px,1.6vh,16px)}
.rung{min-height:clamp(38px,7.5vh,64px);padding:clamp(2px,.6vh,6px) 10px}
.chip{min-height:clamp(36px,7vh,60px);padding:clamp(3px,.8vh,10px) 12px;font-size:clamp(16px,min(1.7vw,3.2vh),26px)}
.chip .n,.rung .no{width:clamp(24px,4.4vh,36px);height:clamp(24px,4.4vh,36px);font-size:clamp(14px,2.4vh,19px)}
.mini .rung{min-height:clamp(32px,6vh,48px)}
.mini .chip{min-height:clamp(30px,5.6vh,44px);font-size:clamp(14px,min(1.4vw,2.6vh),18px);padding:2px 8px}
.mini .chip .n{width:clamp(22px,3.8vh,28px);height:clamp(22px,3.8vh,28px)}
.tray{gap:clamp(4px,1vh,12px);min-height:clamp(60px,12vh,120px);padding:clamp(6px,1vh,12px)}
.btn{min-height:clamp(40px,6.5vh,56px);padding:clamp(6px,1.2vh,14px) clamp(12px,1.6vw,22px)}
.navbtn{min-height:clamp(38px,6vh,52px);padding:clamp(4px,1vh,10px) 12px}
.big{font-size:clamp(22px,min(3.4vw,5.6vh),52px)}
.collage{width:min(100%,calc((100dvh - 260px)*4/3));margin-inline:auto}
.items{grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.item{padding:3px}
.item svg{width:clamp(30px,5.5vh,56px);height:clamp(30px,5.5vh,56px)}
.card-cmd{aspect-ratio:4/3;font-size:clamp(28px,min(4vw,7vh),64px)}
.cmdbig{padding:clamp(8px,2vh,22px) clamp(12px,2vw,26px)}
.cmdbig .txt{font-size:clamp(22px,min(3.6vw,6vh),56px)}
.rule{padding:clamp(4px,1vh,10px) 14px}
@media (max-width:820px){.app{height:auto}main{overflow:visible}.collage{width:100%}}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="stage" id="stage"></div>
    <div class="meta" id="meta"></div>
  </header>
  <main id="main"></main>
  <nav class="bottom" id="nav" aria-label="Экраны урока"></nav>
</div>
<div id="nb" hidden></div>

<script>
(function(){
const STEPS={1:"Я придумываю",2:"Я выбираю фон",3:"Я ставлю главное",4:"Я добавляю мелочи",5:"Я проверяю и подписываю"};
const SHORT={1:"Придумываю",2:"Фон",3:"Главное",4:"Мелочи",5:"Проверяю, подписываю"};
const CMDS={1:"Придумай: коллаж будет про осенний лес",2:"Выбери фон",3:"Поставь главное",4:"Добавь мелочи",5:"Проверь и подпиши"};
const SCREENS=[
 {id:"title",label:"1 Титул",stage:"Я автор",block:"Мотивация · 0–3 мин"},
 {id:"ladder",label:"2 Сборка лестницы",stage:"Лестница автора",block:"Блок 1 · 3–13 мин"},
 {id:"confirm",label:"3 Подтверждение",stage:"Лестница автора: сверяем",block:"Блок 1 · 3–13 мин"},
 {id:"command",label:"4 Команда роботу",stage:"Робот-автор: команда",block:"Блок 2 · 13–23 мин"},
 {id:"robot",label:"5 Исполнение",stage:"Робот выполняет",block:"Блок 2 · 13–23 мин"},
 {id:"compare",label:"Автор / робот",stage:"Что хотел автор, что сделал робот",block:"Блок 2 · пауза",opt:true},
 {id:"transition",label:"Переход",stage:"Новое задание",block:"Блок 2 → Блок 3",opt:true},
 {id:"friend",label:"6 Коллаж друга",stage:"Помоги другу дойти до конца лестницы",block:"Блок 3 · 23–33 мин"},
 {id:"reflect",label:"7 Рефлексия",stage:"Я умею…",block:"Рефлексия · 33–40 мин"}
];
const fresh=()=>({ladder:[null,null,null,null,null],tray:[3,5,1,4,2],saved:null,checked:false,fixed:false,
  tokens:[0,0,0,0,0],arrows:[0,0,0,0,0],stars:[0,0,0,0,0],used:[],cur:null,robot:{bg:null,items:[]},marks:[],answers:false});
let S=fresh();
try{const raw=localStorage.getItem("ya-avtor-v1");if(raw)S=Object.assign(fresh(),JSON.parse(raw));}catch(e){}
function save(){try{localStorage.setItem("ya-avtor-v1",JSON.stringify(S));}catch(e){}}
let cur=0;

/* ---------- рисунки для коллажа (центр в 0,0) ---------- */
const ART={
 hedgehog:{kind:"main",label:"Ёжик",s:1.3,svg:`<g><path d="M-38 12 L-34 -10 L-26 -4 L-22 -26 L-12 -12 L-6 -32 L2 -14 L10 -30 L14 -10 L24 -22 L26 -2 L36 -8 L34 12 Z" fill="#6B4A2B"/><ellipse cx="0" cy="10" rx="36" ry="18" fill="#8A6239"/><ellipse cx="34" cy="14" rx="14" ry="10" fill="#E8C89A"/><circle cx="46" cy="12" r="4" fill="#1D2738"/><circle cx="34" cy="9" r="2.6" fill="#1D2738"/><rect x="-24" y="24" width="8" height="8" rx="3" fill="#6B4A2B"/><rect x="14" y="24" width="8" height="8" rx="3" fill="#6B4A2B"/></g>`},
 snowman:{kind:"main",label:"Снеговик",s:1.3,svg:`<g stroke="#9DB3CC" stroke-width="2"><circle cx="0" cy="22" r="22" fill="#fff"/><circle cx="0" cy="-10" r="16" fill="#fff"/><circle cx="0" cy="-34" r="11" fill="#fff"/></g><circle cx="-4" cy="-36" r="2" fill="#1D2738"/><circle cx="4" cy="-36" r="2" fill="#1D2738"/><path d="M0 -32 L14 -30 L0 -28 Z" fill="#EE7A1F"/><rect x="-10" y="-52" width="20" height="9" fill="#1D2738"/>`},
 tree:{kind:"main",label:"Дерево",s:1.4,svg:`<rect x="-6" y="0" width="12" height="40" fill="#7E5427"/><circle cx="0" cy="-14" r="24" fill="#E8902A"/><circle cx="-18" cy="-2" r="14" fill="#D9A400"/><circle cx="18" cy="-4" r="15" fill="#D45A1E"/>`},
 leaf:{kind:"small",label:"Листик",s:1,svg:`<path d="M0 -18 C14 -12 16 6 0 18 C-16 6 -14 -12 0 -18 Z" fill="#EE7A1F"/><path d="M0 -16 L0 22" stroke="#A3501A" stroke-width="2"/>`},
 mushroom:{kind:"small",label:"Гриб",s:1,svg:`<rect x="-6" y="-2" width="12" height="20" rx="4" fill="#F5E6CC"/><path d="M-20 0 C-20 -22 20 -22 20 0 Z" fill="#D63A2F"/><circle cx="-8" cy="-9" r="3" fill="#fff"/><circle cx="7" cy="-12" r="2.5" fill="#fff"/>`},
 snowflake:{kind:"small",label:"Снежинка",s:1,svg:`<g stroke="#4A90C9" stroke-width="3" stroke-linecap="round"><path d="M0 -18 V18 M-16 -9 L16 9 M-16 9 L16 -9"/></g>`},
 sun:{kind:"small",label:"Солнце",s:1.1,svg:`<g stroke="#F2B705" stroke-width="3" stroke-linecap="round"><path d="M0 -24 V-17 M0 17 V24 M-24 0 H-17 M17 0 H24 M-17 -17 L-12 -12 M12 12 L17 17 M-17 17 L-12 12 M12 -12 L17 -17"/></g><circle r="12" fill="#F2B705"/>`},
 flower:{kind:"small",label:"Цветок",s:1,svg:`<path d="M0 6 V24" stroke="#3A9E4C" stroke-width="3"/><g fill="#E35D9B"><circle cx="0" cy="-9" r="7"/><circle cx="9" cy="0" r="7"/><circle cx="0" cy="9" r="7"/><circle cx="-9" cy="0" r="7"/></g><circle r="5" fill="#F2B705"/>`},
 sign:{kind:"sign",label:"Подпись",s:1,svg:`<text x="0" y="6" text-anchor="middle" font-family="Caveat, cursive" font-size="22" font-weight="700" fill="#1F3C8A">Автор: я</text>`}
};
const BGS={
 autumn:{label:"Осень",svg:`<rect width="400" height="300" fill="#FBE3C4"/><rect y="220" width="400" height="80" fill="#C98A4B"/><circle cx="340" cy="50" r="26" fill="#F2B705" opacity=".7"/>`},
 winter:{label:"Зима",svg:`<rect width="400" height="300" fill="#DCEBFA"/><rect y="215" width="400" height="85" fill="#FFFFFF"/><path d="M0 215 Q100 195 200 215 T400 215" fill="#FFFFFF"/>`},
 summer:{label:"Лето",svg:`<rect width="400" height="300" fill="#CDEBFF"/><rect y="210" width="400" height="90" fill="#7CC46B"/>`}
};
function bgThumb(k){return `<svg viewBox="0 0 400 300" aria-hidden="true">${BGS[k].svg}</svg>`}
function artThumb(k){const a=ART[k];return `<svg viewBox="-60 -60 120 120" aria-hidden="true"><g transform="scale(${k==='sign'?1.3:1})">${a.svg}</g></svg>`}
function placed(it){const a=ART[it.k];return `<g class="pl" data-i="${it.i}" transform="translate(${it.x} ${it.y}) scale(${a.s})" style="cursor:grab">${a.svg}</g>`}
function collageSVG(bg,items,extra,id){
  return `<svg class="collage" ${id?`id="${id}"`:""} viewBox="0 0 400 300" role="img" aria-label="Коллаж">${bg?BGS[bg].svg:`<rect width="400" height="300" fill="#fff"/>`}${items.map(placed).join("")}${extra||""}</svg>`;
}
const REF={bg:"autumn",items:[{k:"tree",x:85,y:150},{k:"hedgehog",x:220,y:205},{k:"leaf",x:300,y:120},{k:"leaf",x:150,y:250},{k:"mushroom",x:330,y:235},{k:"sign",x:330,y:280}]};
const FRIEND={bg:null,items:[{k:"snowman",x:200,y:170},{k:"sun",x:330,y:60},{k:"flower",x:90,y:235},{k:"leaf",x:290,y:230},{k:"snowflake",x:110,y:80},{k:"sign",x:330,y:280}]};
REF.items.forEach((it,i)=>it.i=i);FRIEND.items.forEach((it,i)=>it.i=i);
FRIEND.items[5]=Object.assign({},FRIEND.items[5]);

/* ---------- элементы ---------- */
function chip(s,hideNum){return `<div class="chip" data-s="${s}"><span class="n${hideNum?' hidden-n':''}">${hideNum?'?':s}</span><span>${STEPS[s]}</span></div>`}
function shownLadder(){return S.fixed?[1,2,3,4,5]:S.ladder}
function miniLadder(mode){
  const L=shownLadder();
  let html=`<div class="ladder mini">`;
  for(let i=0;i<5;i++){
    const s=L[i];
    let marks="";
    if(S.tokens[i])marks+=`<span class="token" title="Жетон команды">✓</span>`;
    if(S.arrows[i])marks+=`<span class="arrow" title="Сбой">➜</span>`;
    if(S.stars[i])marks+=`<span class="stars">${"★".repeat(Math.min(S.stars[i],8))}</span>`;
    html+=`<button type="button" class="rung ${s?'filled':''}" data-r="${i}" aria-label="Ступень ${i+1}">${s?chip(s).replace('class="chip"','class="chip" style="cursor:pointer"'):`<span class="no">${i+1}</span>`}<span class="marks">${marks}</span></button>`;
  }
  return html+`</div>`;
}
function ladderHint(mode){
  return {token:"Нажмите на ступень — поставить жетон команды",arrow:"Нажмите на ступень — поставить красную стрелку",star:"Выходите по одному: нажмите на ступень, которой гордитесь",view:"Наша лестница"}[mode];
}
function ladderPanel(mode){
  return `<aside class="panel grp" id="lp"><p class="cap">${ladderHint(mode)}</p>${miniLadder(mode)}</aside>`;
}

/* ---------- экраны ---------- */
const R={};
R.title=()=>`
 <section class="screen split">
  <div class="panel grp" style="align-content:start;gap:16px">
    <p class="big">Как автор пришёл к такому коллажу?</p>
    <p class="lead">Этот лист вы видели на прошлом уроке. Он не появился сразу.</p>
    ${collageSVG(REF.bg,REF.items)}
  </div>
  <aside class="panel grp"><p class="cap">Лестница автора — пока пустая</p><div class="ladder mini">${[0,1,2,3,4].map(i=>`<div class="rung"><span class="no">${i+1}</span></div>`).join("")}</div></aside>
 </section>`;

R.ladder=()=>{
  const trayItems=S.tray.map(s=>`<div class="drag" data-from="tray" data-s="${s}">${chip(s,true)}</div>`).join("");
  let rungs="";
  for(let i=0;i<5;i++){const s=S.ladder[i];
    rungs+=`<div class="rung ${s?'filled':''} drop" data-r="${i}">${s?`<div class="drag" style="width:100%" data-from="rung" data-r="${i}" data-s="${s}">${chip(s,true)}</div>`:`<span class="no">${i+1}</span><span style="color:var(--muted);font-size:18px">Перетащи сюда шаг</span>`}</div>`;}
  const savedHtml=S.saved?`<div class="panel grp" style="padding:12px"><p class="cap">Отложенный вариант</p>${S.saved.map((s,i)=>`<div style="font-size:16px">${i+1}. ${s?STEPS[s]:"—"}</div>`).join("")}</div>`:"";
  return `
  <section class="screen lad2">
   <div class="grp" style="align-content:start;gap:14px">
     <div class="panel grp"><p class="cap">Шаги вперемешку</p><div class="tray drop" data-r="tray">${trayItems||`<p class="lead" style="font-size:17px">Все шаги на лестнице</p>`}</div></div>
     <div class="rule">Поставил шаг — скажи, почему он идёт после того, что выше.</div>
     <div class="row">
       <button class="btn soft" id="saveVar" type="button">Отложить вариант</button>
       <button class="btn ghost" id="resetL" type="button">Сначала</button>
     </div>
     ${savedHtml}
   </div>
   <div class="panel"><p class="cap">Ступень 1 — вверху. Идём сверху вниз.</p><div class="ladder" id="bigLadder">${rungs}</div></div>
  </section>`;
};

R.confirm=()=>{
  let rows="";
  for(let i=0;i<5;i++){const s=S.ladder[i];const ok=s===i+1;
    rows+=`<div class="row" style="flex-wrap:nowrap">${s?`<div style="flex:1;min-width:0">${chip(s,!S.checked)}</div>`:`<div class="chip" style="flex:1;--c:var(--line);--t:var(--paper)"><span class="n">${i+1}</span><span>пусто</span></div>`}
      <span style="flex:none;width:56px;text-align:center;font-size:34px;color:${S.checked?(ok?'var(--ok)':'var(--s3)'):'var(--line)'}">${S.checked?(ok?'✓':'?'):'•'}</span></div>`;}
  return `
  <section class="screen split">
   <div class="panel grp" style="align-content:start;gap:12px">
     <p class="cap">Наша лестница · ступень 1 вверху</p>${rows}
   </div>
   <aside class="grp" style="align-content:start;gap:14px">
     <div class="panel grp"><p class="lead" style="color:var(--ink)">Контролёры: согласны с лестницей? Нажмите «Проверяем».</p>
       <button class="btn" id="check" type="button">${S.checked?'Проверено':'Проверяем'}</button>
       ${S.checked?`<p class="lead" style="font-size:17px">«?» — ступень для разговора. Решаем вместе.</p>`:""}
       <button class="btn soft" id="fix" type="button">${S.fixed?'Лестница закреплена':'Закрепить лестницу'}</button>
     </div>
     <button class="btn" style="background:var(--ink)" data-nb="ladder" type="button">Сели, записали</button>
   </aside>
  </section>`;
};

};

   <div class="panel grp" style="align-content:start;gap:12px">
     <div class="grp"><h4>Фон</h4><div class="items">${bgs}</div></div>
     <div class="grp"><h4>Главное</h4><div class="items">${g("main")}</div></div>
     <div class="grp"><h4>Мелочи</h4><div class="items">${g("small")}${g("sign")}</div></div>
     <p class="cap" style="margin:0">Утащи картинку с листа — она исчезнет</p>
   </div>
   ${ladderPanel("token")}

};

R.reflect=()=>`
  <section class="screen split">
   <div class="panel grp" style="align-content:start;gap:16px">
     <p class="big">Нажми на ступень, которой гордишься, и скажи: «Я умею…»</p>

/* ---------- образцы для тетради ---------- */
function nbLadder(withArrows,withStar){
  let h="";for(let i=0;i<5;i++){h+=`<div class="nb-line"><span>${i+1}</span><span>${SHORT[i+1]}</span>${withArrows&&S.arrows[i]?`<span style="color:var(--red)">⟵</span>`:""}${withStar?`<span style="color:#C89200">${S.stars[i]?"★":""}</span>`:""}</div>`;}return h;
}
const NB={
 ladder:()=>`<h3>Блок 1 · запишите лестницу</h3>${nbLadder(false,false)}<div style="font-size:.7em;color:var(--muted)">номер + первое слово</div>`,
 robot:()=>`<h3>Блок 2 · рядом с лестницей</h3><div>Робот не понял:</div><div>команда № ___</div><div style="font-size:.7em;color:var(--muted)">только номер</div>`,
 friend:()=>`<h3>Блок 3 · стрелки на свою лестницу</h3>${nbLadder(true,false)}<div style="font-size:.7em;color:var(--muted)">стрелка ⟵ там, где Даша сбилась</div>`,
 reflect:()=>`<h3>Рефлексия · звёздочка на своей ступени</h3>${nbLadder(false,true)}<div style="font-size:.7em;color:var(--muted)">★ — ступень, которой я горжусь</div>`
};
function openNB(k){const w=document.getElementById("nb");w.innerHTML=`<div class="nb-wrap" id="nbw"><div class="notebook" role="dialog" aria-label="Образец записи в тетрадь"><button class="btn soft nb-close" id="nbx" type="button" style="min-height:44px;padding:8px 14px">Закрыть</button>${NB[k]()}</div></div>`;w.hidden=false;
  document.getElementById("nbx").onclick=closeNB;document.getElementById("nbw").onclick=e=>{if(e.target.id==="nbw")closeNB();};}
function closeNB(){const w=document.getElementById("nb");w.hidden=true;w.innerHTML="";}

/* ---------- перетаскивание ---------- */
function startDrag(e,srcEl,onDrop){
  e.preventDefault();
  const ghost=srcEl.cloneNode(true);ghost.classList.add("ghost-drag");
  const r=srcEl.getBoundingClientRect();ghost.style.width=r.width+"px";
  document.body.appendChild(ghost);
  const move=(ev)=>{ghost.style.left=ev.clientX+"px";ghost.style.top=ev.clientY+"px";
    document.querySelectorAll(".over").forEach(x=>x.classList.remove("over"));
    const t=document.elementFromPoint(ev.clientX,ev.clientY);const d=t&&t.closest(".drop");if(d)d.classList.add("over");};
  move(e);
  const up=(ev)=>{window.removeEventListener("pointermove",move);window.removeEventListener("pointerup",up);window.removeEventListener("pointercancel",up);
    ghost.remove();document.querySelectorAll(".over").forEach(x=>x.classList.remove("over"));
    const t=document.elementFromPoint(ev.clientX,ev.clientY);onDrop(t,ev);};
  window.addEventListener("pointermove",move);window.addEventListener("pointerup",up);window.addEventListener("pointercancel",up);
}
function svgPoint(svg,ev){const r=svg.getBoundingClientRect();return{x:Math.round((ev.clientX-r.left)/r.width*400),y:Math.round((ev.clientY-r.top)/r.height*300),inside:ev.clientX>=r.left&&ev.clientX<=r.right&&ev.clientY>=r.top&&ev.clientY<=r.bottom};}

/* ---------- обработчики ---------- */
function bind(id){
  const $=s=>document.querySelector(s);
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(SCREENS.findIndex(x=>x.id===b.dataset.go)));
  document.querySelectorAll("[data-nb]").forEach(b=>b.onclick=()=>openNB(b.dataset.nb));
  const lp=$("#lp");
  if(lp){lp.querySelectorAll(".rung").forEach(b=>b.onclick=()=>{const i=+b.dataset.r;
    if(id==="command"||id==="robot")S.tokens[i]=S.tokens[i]?0:1;
    if(id==="friend")S.arrows[i]=S.arrows[i]?0:1;
    if(id==="reflect")S.stars[i]++;
    save();render();});}

  if(id==="ladder"){
    document.querySelectorAll(".drag").forEach(el=>el.addEventListener("pointerdown",e=>{
      const s=+el.dataset.s,from=el.dataset.from,fr=el.dataset.r;
      startDrag(e,el,(t)=>{const d=t&&t.closest(".drop");if(!d)return;
        const to=d.dataset.r;
        if(from==="tray")S.tray=S.tray.filter(x=>x!==s);else S.ladder[+fr]=null;
        if(to==="tray"){S.tray.push(s);}
        else{const i=+to,prev=S.ladder[i];S.ladder[i]=s;if(prev){if(from==="rung")S.ladder[+fr]=prev;else S.tray.push(prev);}}
        S.checked=false;S.fixed=false;save();render();});
    }));
    $("#saveVar").onclick=()=>{S.saved=S.ladder.slice();save();render();};
    $("#resetL").onclick=()=>{S.ladder=[null,null,null,null,null];S.tray=[3,5,1,4,2];S.checked=false;S.fixed=false;save();render();};
  }
  if(id==="confirm"){
    $("#check").onclick=()=>{S.checked=true;save();render();};
    $("#fix").onclick=()=>{S.fixed=true;S.ladder=[1,2,3,4,5];S.tray=[];S.checked=true;save();render();};
  }
  if(id==="command"){
    document.querySelectorAll("[data-cmd]").forEach(b=>b.onclick=()=>{const n=+b.dataset.cmd;S.cur=n;if(!S.used.includes(n))S.used.push(n);save();render();});
  }
  if(id==="robot"){
    const cv=$("#canvas");
    document.querySelectorAll(".item").forEach(el=>el.addEventListener("pointerdown",e=>{
      startDrag(e,el,(t,ev)=>{const p=svgPoint(cv,ev);if(!p.inside)return;
        if(el.dataset.bg)S.robot.bg=el.dataset.bg;
        else S.robot.items.push({k:el.dataset.art,x:p.x,y:p.y,i:Date.now()});
        save();render();});
    }));
    cv.querySelectorAll(".pl").forEach(g=>g.addEventListener("pointerdown",e=>{
      e.preventDefault();const idx=S.robot.items.findIndex(it=>String(it.i)===g.dataset.i);if(idx<0)return;
      const it=S.robot.items[idx];
      const mv=ev=>{const p=svgPoint(cv,ev);g.setAttribute("transform",`translate(${p.x} ${p.y}) scale(${ART[it.k].s})`);};
      const up=ev=>{window.removeEventListener("pointermove",mv);window.removeEventListener("pointerup",up);window.removeEventListener("pointercancel",up);
        const p=svgPoint(cv,ev);if(!p.inside)S.robot.items.splice(idx,1);else{it.x=p.x;it.y=p.y;}save();render();};
      window.addEventListener("pointermove",mv);window.addEventListener("pointerup",up);window.addEventListener("pointercancel",up);
    }));
    $("#clearC").onclick=()=>{S.robot={bg:null,items:[]};save();render();};
  }
  if(id==="friend"){
    const fc=$("#friendC");
    fc.addEventListener("pointerup",ev=>{const m=ev.target.closest&&ev.target.closest(".mark-circle");
      if(m){S.marks.splice(+m.dataset.m,1);}else{const p=svgPoint(fc,ev);S.marks.push({x:p.x,y:p.y});}save();render();});
    $("#clearM").onclick=()=>{S.marks=[];save();render();};
    $("#ans").onclick=()=>{S.answers=!S.answers;render();};
  }
  if(id==="reflect"){
    $("#clearStars").onclick=()=>{S.stars=[0,0,0,0,0];save();render();};
    $("#newLesson").onclick=()=>{$("#confirmNew").hidden=false;};
    $("#noNew").onclick=()=>{$("#confirmNew").hidden=true;};
    $("#yesNew").onclick=()=>{S=fresh();save();go(0);};
  }
}

/* ---------- навигация ---------- */
function renderNav(){
  const n=document.getElementById("nav");
  n.innerHTML=`<button class="navbtn arrowbtn" id="prev" type="button" aria-label="Назад">←</button>`+
   SCREENS.map((s,i)=>`<button class="navbtn ${i===cur?'on':''} ${s.opt?'opt':''}" data-i="${i}" type="button">${s.label}</button>`).join("")+
   `<button class="navbtn arrowbtn" id="next" type="button" aria-label="Вперёд">→</button>`;
  n.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>go(+b.dataset.i));
  document.getElementById("prev").onclick=()=>go(Math.max(0,cur-1));
  document.getElementById("next").onclick=()=>go(Math.min(SCREENS.length-1,cur+1));
  const on=n.querySelector(".on");if(on&&on.scrollIntoView)on.scrollIntoView({block:"nearest",inline:"nearest"});
}
function render(){
  const sc=SCREENS[cur];
  document.getElementById("stage").textContent=sc.stage;
  document.getElementById("meta").innerHTML=`<span class="pill">${sc.block}</span>${sc.opt?`<span class="pill opt">желательный экран</span>`:""}`;
  document.getElementById("main").innerHTML=R[sc.id]();
  bind(sc.id);renderNav();
}
function go(i){if(i<0)return;cur=i;try{history.replaceState(null,"","#"+SCREENS[i].id);}catch(e){location.hash=SCREENS[i].id;}closeNB();render();}
function fromHash(){const h=(location.hash||"").slice(1);const i=SCREENS.findIndex(s=>s.id===h);cur=i>=0?i:0;render();}
window.addEventListener("hashchange",fromHash);
window.addEventListener("keydown",e=>{if(e.key==="ArrowRight")go(Math.min(SCREENS.length-1,cur+1));if(e.key==="ArrowLeft")go(Math.max(0,cur-1));if(e.key==="Escape")closeNB();});
fromHash();
})();
</script>
