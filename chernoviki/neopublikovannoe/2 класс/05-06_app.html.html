<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Компьютерный шкаф</title>
<style>
:root{
  --wood:#c98a4b; --wood-dark:#7a4b16;
  --green:#7ed957; --green-d:#3f8f22;
  --blue:#6ec6ff; --blue-d:#2f88c4;
  --yellow:#ffd166; --yellow-d:#c99a1a;
  --pink:#ff9ec7; --pink-d:#d16b9e;
  --red:#ff7b7b; --red-d:#c94c4c;
  --ink:#1e3038; --muted:#5b7482;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{font-size:clamp(20px,2.1vmin,32px);}
body{
  font-family:"Comic Sans MS","Segoe UI",system-ui,sans-serif;
  background:linear-gradient(160deg,#dff1ff,#eafaf0);
  color:var(--ink);height:100vh;overflow:hidden;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;
}
button{font-family:inherit;}
.hidden{display:none !important;}
.spacer{flex:1;}

.screen{position:fixed;inset:0;display:none;flex-direction:column;padding:.4rem;gap:.35rem;}
.screen.active{display:flex;}

.btn{
  font-size:.8rem;font-weight:700;border:none;border-radius:.6rem;
  padding:.55rem .9rem;background:var(--yellow);color:#5a3e00;cursor:pointer;
  box-shadow:0 .16rem 0 var(--yellow-d);min-height:2.8rem;
  transition:transform .06s,box-shadow .06s;white-space:nowrap;
}
.btn:active{transform:translateY(.1rem);box-shadow:0 .05rem 0 var(--yellow-d);}
.btn.green{background:var(--green);color:#0d3912;box-shadow:0 .16rem 0 var(--green-d);}
.btn.blue{background:var(--blue);color:#003a5c;box-shadow:0 .16rem 0 var(--blue-d);}
.btn.pink{background:var(--pink);color:#5c0030;box-shadow:0 .16rem 0 var(--pink-d);}
.btn.gray{background:#dfe8ee;color:#33474f;box-shadow:0 .16rem 0 #a8bcc7;}
.btn.red{background:var(--red);color:#5a0000;box-shadow:0 .16rem 0 var(--red-d);}

.bar{display:flex;align-items:center;gap:.4rem;flex:0 0 auto;flex-wrap:wrap;}
.bar h2{font-size:.95rem;line-height:1.15;}

/* ---------- МЕНЮ ---------- */
#scr-menu{align-items:center;justify-content:center;gap:.7rem;}
#scr-menu h1{font-size:1.7rem;color:#12617f;text-shadow:0 .12rem 0 #fff;}
.tiles{display:flex;gap:.9rem;align-items:stretch;justify-content:center;width:100%;max-width:64rem;padding:.4rem;flex-wrap:wrap;}
.tile{
  flex:1 1 16rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5rem;
  background:#fff;border:.2rem solid #cfe9ff;border-radius:1rem;padding:.9rem .6rem;cursor:pointer;
  box-shadow:0 .4rem .8rem rgba(0,70,120,.14);transition:transform .12s,box-shadow .12s;
  color:var(--ink);min-height:15rem;
}
.tile:hover{transform:translateY(-.22rem);box-shadow:0 .55rem 1rem rgba(0,70,120,.22);}
.tile:active{transform:translateY(.05rem);}
.tile .tname{font-size:1.05rem;font-weight:700;}
.tile .tdesc{font-size:.65rem;color:var(--muted);text-align:center;padding:0 .4rem;line-height:1.3;}
.tile svg{width:5.5rem;height:5.5rem;}

/* ---------- РЕЖИМ 1 ---------- */
#m1-game{display:flex;gap:.5rem;flex:1;min-height:0;}
#m1-pics{flex:1.15;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:.45rem;min-height:0;}
#m1-terms{flex:.85;display:flex;flex-direction:column;gap:.4rem;justify-content:center;min-height:0;overflow:auto;padding:.2rem;}
.pic-card{
  background:#fff;border:.16rem dashed #b9d8ea;border-radius:.8rem;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:.3rem;position:relative;transition:background .2s,border-color .2s,transform .15s;
  cursor:pointer;min-height:0;overflow:hidden;
}
.pic-card svg{width:auto;height:56%;max-height:5rem;flex:0 0 auto;}
.pic-label{font-size:.7rem;font-weight:700;color:#3d6478;margin-top:.15rem;}
.pic-card.over{border-color:var(--green);background:#eaffe2;transform:scale(1.02);}
.pic-card.done{border-style:solid;border-color:var(--green);background:#f0ffee;}
.pic-card.done .pic-check{opacity:1;transform:scale(1);}
.pic-check{
  position:absolute;top:.2rem;right:.25rem;width:1.6rem;height:1.6rem;border-radius:50%;
  background:var(--green);color:#fff;font-size:1.1rem;font-weight:700;display:flex;align-items:center;justify-content:center;
  opacity:0;transform:scale(.3);transition:.25s;box-shadow:0 .1rem .2rem rgba(0,0,0,.2);
}
.matched-term{
  position:absolute;bottom:.12rem;left:.12rem;right:.12rem;
  background:var(--green);color:#fff;border-radius:.4rem;font-size:.62rem;font-weight:700;
  text-align:center;padding:.14rem;
}
.term-card{
  background:linear-gradient(#fff8e0,#ffeeb8);border:.16rem solid var(--yellow-d);
  border-radius:.6rem;padding:.65rem .7rem;font-size:.85rem;font-weight:700;text-align:center;
  cursor:grab;touch-action:none;box-shadow:0 .2rem 0 var(--yellow-d);
  transition:transform .1s,background .15s,opacity .2s;
}
.term-card.sel{background:linear-gradient(#d8f3ff,#a8e2ff);border-color:var(--blue-d);transform:scale(1.03);}
.term-card.used{opacity:.25;pointer-events:none;box-shadow:none;}
.term-card.shake{animation:shake .45s;}
.term-card.dragging{opacity:.35;}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-.4rem)}40%{transform:translateX(.4rem)}60%{transform:translateX(-.25rem)}80%{transform:translateX(.25rem)}}
.drag-ghost{position:fixed;pointer-events:none;z-index:9999;opacity:.94;box-shadow:0 .4rem .8rem rgba(0,0,0,.25);}

#m1-quiz{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.8rem;padding:.5rem;}
.q-title{font-size:1.1rem;font-weight:700;color:#12617f;text-align:center;}
.q-opts{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center;}
.q-opt{
  font-size:.95rem;font-weight:700;padding:.75rem 1.3rem;border-radius:.8rem;border:.2rem solid var(--blue-d);
  background:#fff;cursor:pointer;min-height:3.4rem;min-width:8rem;box-shadow:0 .22rem 0 var(--blue-d);
}
.q-opt.ok{background:var(--green);border-color:var(--green-d);color:#fff;box-shadow:0 .22rem 0 var(--green-d);}
.q-opt.bad{background:#ffc9c9;border-color:#d97a7a;box-shadow:0 .22rem 0 #d97a7a;}
.q-progress{font-size:.75rem;color:var(--muted);}

/* ============ ДРАКОН-ИКОНЫ ============ */
.dk-round{background:#d9f7ff;border:.14rem solid var(--blue-d);border-radius:2rem;}
.dk-rect{background:#fff;border:.14rem solid var(--blue-d);}
.dk-hex{
  background:#ffe6f3;
  clip-path:polygon(7% 0, 93% 0, 100% 50%, 93% 100%, 7% 100%, 0 50%);
  border:none;
}
/* Ввод данных — ЗЕЛЁНЫЙ блок с V-вырезом слева */
.dk-input{
  background:#b8e696;
  clip-path:polygon(0 0, 100% 0, 100% 100%, 0 100%, 14% 50%);
  border:none;
}
.dk-output{
  background:#ffe8c2;
  clip-path:polygon(0 0, 86% 0, 100% 50%, 86% 100%, 0 100%);
  border:none;
}

/* ---------- ДРАКОН-СХЕМА ---------- */
.drakon-scroll{overflow:auto;min-height:0;flex:1;text-align:left;}
.drakon{
  position:relative;
  display:inline-flex;
  flex-direction:column;
  align-items:flex-start;
  padding:.8rem 9rem 1.6rem .4rem;
  min-width:0;
}
.drakon-arrows{
  position:absolute;
  left:0;top:0;
  pointer-events:none;
  z-index:1;
  overflow:visible;
}
.dk-line{
  width:19rem;
  display:flex;
  align-items:center;
  justify-content:flex-start;
  position:relative;
  z-index:2;
  flex:0 0 auto;
}
.dk-line.dk-line-branch{width:auto;}
.dk-spine-cell{
  width:19rem;
  display:flex;
  align-items:center;
  justify-content:flex-start;
  flex:0 0 auto;
}
.dk-branch-arrow{
  font-size:.6rem;font-weight:700;color:var(--green-d);
  background:#eaffe2;border-radius:.35rem;padding:.12rem .4rem;
  white-space:nowrap;flex:0 0 auto;margin:0 .5rem;
}
.dk-arr{
  width:19rem;height:1.1rem;
  display:flex;align-items:center;justify-content:center;
  position:relative;z-index:2;flex:0 0 auto;
}
.dk-arr::before{
  content:'';width:0;height:0;
  border-left:.45rem solid transparent;
  border-right:.45rem solid transparent;
  border-top:.65rem solid #4d6a7a;
}
.dk-arr-label{
  position:absolute;left:calc(50% + .9rem);top:50%;transform:translateY(-50%);
  font-size:.6rem;font-weight:700;color:#4d6a7a;
  background:#eef6fb;border-radius:.3rem;padding:.05rem .35rem;
}
.dk-arr-label.нет{color:#a44a00;background:#fff0e0;}

.slot{
  display:flex;align-items:center;justify-content:center;
  min-height:2.6rem;width:19rem;max-width:19rem;
  padding:.4rem .9rem;font-size:.72rem;font-weight:700;
  color:#123;text-align:center;position:relative;
  transition:filter .2s;
}
.drakon .dk-line-branch > .slot{width:auto;min-width:12rem;max-width:16rem;}
.slot.dk-hex{min-height:3.6rem;padding:.5rem 1.4rem;}
.slot.dk-round{padding:.45rem 1.4rem;}
.slot.dk-input{padding:.45rem 1.2rem .45rem 1.6rem;}
.slot.right{outline:.18rem solid var(--green-d);outline-offset:.1rem;}
.slot.wrong{outline:.18rem solid #e07a7a;outline-offset:.1rem;}
.slot.over{filter:brightness(1.2) drop-shadow(0 .1rem .3rem var(--yellow-d));}
.slot.current{animation:pulse .9s infinite;}
@keyframes pulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.3) drop-shadow(0 0 .3rem var(--yellow-d))}}

.m2-chip{
  font-size:.62rem;font-weight:700;padding:.3rem .55rem;line-height:1.1;text-align:center;
  cursor:grab;touch-action:none;color:#123;max-width:100%;
  display:flex;align-items:center;justify-content:center;min-height:2rem;border-radius:.15rem;
}
.m2-chip.dk-round{background:#a8e2ff;border:none;border-radius:2rem;padding:.3rem .9rem;}
.m2-chip.dk-rect{background:#fff0b8;border:none;}
.m2-chip.dk-hex{background:#ffa8d3;clip-path:polygon(7% 0,93% 0,100% 50%,93% 100%,7% 100%,0 50%);padding:.35rem 1.1rem;min-height:2.6rem;}
.m2-chip.dk-input{background:#8ed466;clip-path:polygon(0 0,100% 0,100% 100%,0 100%,14% 50%);padding:.3rem .5rem .3rem 1rem;}
.m2-chip.in-slot{cursor:pointer;font-size:.55rem;padding:.2rem .4rem;width:100%;}
.m2-chip.dragging{opacity:.35;}

/* ---------- РЕЖИМ 2 ---------- */
#m2-body,#run-body{display:flex;gap:.5rem;flex:1;min-height:0;}
#m2-slots,#run-schema{flex:1.3;display:flex;flex-direction:column;min-height:0;overflow:hidden;}
#run-desk-wrap,#m2-pool{
  flex:.8;display:flex;flex-wrap:wrap;align-content:flex-start;gap:.4rem;
  overflow-y:auto;padding:.5rem;background:#ffffffcc;border-radius:.8rem;border:.14rem solid #d6e6f0;
}
#run-desk-wrap{background:none;border:none;padding:0;border-radius:.8rem;overflow:hidden;position:relative;border:.2rem solid #7f9fb5;}

/* ---------- рабочий стол ---------- */
.desk{position:relative;width:100%;height:100%;overflow:hidden;
  background:radial-gradient(circle at 22% 22%,#7fc4f5 0,transparent 45%),
             radial-gradient(circle at 78% 72%,#4ea3d8 0,transparent 50%),
             linear-gradient(#3a86c9,#1c4f7c);}
.desk-icons{position:absolute;inset:0;padding:.6rem;display:flex;flex-wrap:wrap;align-content:flex-start;gap:.7rem;}
.desk-folder{width:6rem;display:flex;flex-direction:column;align-items:center;gap:.15rem;cursor:default;}
.desk-folder svg{width:3.2rem;height:2.8rem;filter:drop-shadow(0 .1rem .15rem rgba(0,0,0,.4));}
.desk-folder .fname{font-size:.6rem;color:#fff;text-shadow:0 .08rem .12rem #000;text-align:center;word-break:break-word;line-height:1.15;}
.desk-folder.new .fname{background:#fff;color:#123;border-radius:.3rem;padding:.1rem .35rem;text-shadow:none;outline:.16rem solid var(--yellow);min-width:4rem;text-align:center;}
.desk-input{font-size:.72rem;width:5.4rem;border-radius:.3rem;border:.12rem solid #888;padding:.15rem .25rem;font-family:inherit;text-align:center;}
.desk-menu{
  position:absolute;background:#f7fbff;border:.12rem solid #b7c9d6;border-radius:.4rem;
  box-shadow:0 .25rem .6rem rgba(0,0,0,.3);padding:.2rem;min-width:8rem;z-index:20;
}
.desk-menu .mi{font-size:.65rem;padding:.4rem .6rem;border-radius:.3rem;cursor:pointer;}
.desk-menu .mi:hover{background:#d9ecff;}

/* ---------- РЕЖИМ 3 ---------- */
#m3-body{display:flex;gap:.5rem;flex:1;min-height:0;}
.cupboard-wrap{flex:1.25;display:flex;min-height:0;}
.cupboard{flex:1;background:linear-gradient(#b3763b,#8a5a26);border-radius:.7rem;padding:.5rem;display:flex;flex-direction:column;gap:.35rem;overflow-y:auto;border:.2rem solid #6d451d;}
.cupboard-top{height:.55rem;background:linear-gradient(#e0a768,#c98a4b);border-radius:.4rem;flex:0 0 auto;}
.shelf{background:linear-gradient(#fffdf5,#fff3d9);border-bottom:.32rem solid var(--wood);border-radius:.4rem;padding:.3rem .5rem .35rem;display:flex;gap:.5rem;align-items:flex-start;min-height:3.6rem;flex:0 0 auto;transition:.15s;position:relative;padding-right:2rem;}
.shelf.hl{box-shadow:0 0 0 .16rem var(--yellow-d);}
.shelf.over{background:#e6ffe0;box-shadow:0 0 0 .16rem var(--green-d);}
.shelf-name{font-size:.65rem;font-weight:700;color:#fff;background:var(--wood);border-radius:.3rem;padding:.22rem .5rem;white-space:nowrap;flex:0 0 auto;max-width:8rem;overflow:hidden;text-overflow:ellipsis;}
.shelf-files{display:flex;flex-wrap:wrap;gap:.3rem;flex:1;min-height:2.2rem;}
.shelf-del{
  position:absolute;right:.25rem;top:.3rem;width:1.7rem;height:1.7rem;
  background:#ff7b7b;color:#fff;border:none;border-radius:50%;
  font-size:.85rem;font-weight:700;cursor:pointer;line-height:1.7rem;text-align:center;padding:0;
  box-shadow:0 .1rem .18rem rgba(0,0,0,.25);font-family:inherit;
}
.shelf-del:hover{background:#e05050;}
.empty-note{font-size:.65rem;color:#7a8b95;padding:.7rem;text-align:center;width:100%;}
.right-col{flex:1;display:flex;flex-direction:column;gap:.4rem;min-height:0;}
.panel-title{font-size:.72rem;font-weight:700;color:#3d6478;padding-left:.25rem;}
.basket{flex:1;background:#fff8e6;border:.18rem dashed var(--wood);border-radius:.7rem;padding:.45rem;display:flex;flex-wrap:wrap;align-content:flex-start;gap:.35rem;overflow-y:auto;}
.basket.no-drag .file{pointer-events:none;opacity:.55;}
.file{display:flex;align-items:center;gap:.25rem;background:#fff;border:.1rem solid #cfe0ea;border-radius:.5rem;padding:.25rem .4rem;box-shadow:0 .1rem .22rem rgba(0,0,0,.14);cursor:grab;touch-action:none;max-width:12rem;position:relative;}
.file svg{width:1.6rem;height:1.6rem;flex:0 0 auto;}
.file .ftext{font-size:.55rem;line-height:1.15;font-weight:700;color:#2c4653;}
.file .sticker{width:.85rem;height:.85rem;border-radius:.2rem;flex:0 0 auto;border:.05rem solid #0002;}
.sticker.green{background:#7ed957;}
.sticker.red{background:#ff7b7b;}
.sticker.blue{background:#6ec6ff;}
.sticker.yellow{background:#ffd166;}
.sticker.red\+yellow{background:linear-gradient(135deg,#ff7b7b 50%,#ffd166 50%);}
.sticker.green\+yellow{background:linear-gradient(135deg,#7ed957 50%,#ffd166 50%);}
.file.hl{box-shadow:0 0 0 .14rem var(--yellow-d);}
.file.dragging{opacity:.35;}
.stars{font-size:.85rem;font-weight:700;color:#a06b00;}
#ws-timer{display:flex;align-items:center;gap:.35rem;background:#fff3cf;border-radius:.5rem;padding:.25rem .6rem;font-size:.85rem;font-weight:700;color:#8a5a00;}
#ws-timer svg{width:1.7rem;height:1.7rem;}
#ws-timer.urgent{background:#ffd9d9;color:#a00000;animation:blink .5s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.55}}

/* ---------- оверлеи ---------- */
.overlay{position:fixed;inset:0;background:rgba(10,40,60,.55);display:none;align-items:center;justify-content:center;z-index:900;padding:.6rem;}
.overlay.show{display:flex;}
.overlay-box{background:#fff;border-radius:1rem;padding:1rem;max-width:56rem;width:100%;max-height:94vh;overflow-y:auto;box-shadow:0 .8rem 2rem rgba(0,0,0,.35);}
.overlay-title{font-size:1rem;font-weight:700;color:#12617f;margin-bottom:.6rem;text-align:center;}
#modal{z-index:1200;}
#kb{z-index:1000;}
#schema2-overlay{z-index:1100;}
#m5-overlay{z-index:950;}

/* ---------- учителю ---------- */
.teacher{position:fixed;left:.5rem;right:.5rem;bottom:.5rem;z-index:800;background:linear-gradient(#a8f09a,#6fd156);color:#083a08;border-radius:.8rem;padding:.6rem .8rem;display:none;align-items:flex-start;gap:.6rem;box-shadow:0 .4rem 1rem rgba(0,60,0,.35);border:.14rem solid #4ea832;}
.teacher.show{display:flex;}
.teacher-icon{font-size:1.4rem;line-height:1;}
.teacher-text{flex:1;font-size:.75rem;line-height:1.4;}
.teacher-text b{color:#05400a;}
.teacher-close{background:#fff;border:none;border-radius:.5rem;padding:.4rem .7rem;font-size:.7rem;font-weight:700;cursor:pointer;color:#0e3d10;font-family:inherit;min-height:2.2rem;}

/* ---------- тост ---------- */
.toast{position:fixed;left:50%;top:1rem;transform:translate(-50%,-4rem);background:#12617f;color:#fff;font-size:.85rem;font-weight:700;padding:.65rem 1.05rem;border-radius:.7rem;z-index:1100;opacity:0;transition:.25s;pointer-events:none;max-width:82vw;text-align:center;box-shadow:0 .3rem .8rem rgba(0,0,0,.3);}
.toast.show{opacity:1;transform:translate(-50%,0);}
.toast.err{background:#d9702a;}

/* ---------- клавиатура ---------- */
#kb .overlay-box{max-width:56rem;}
.kb-title{font-size:.95rem;font-weight:700;text-align:center;color:#12617f;margin-bottom:.5rem;}
.kb-display{font-size:1.3rem;font-weight:700;text-align:center;background:#f0f8ff;border:.14rem solid var(--blue-d);border-radius:.6rem;padding:.5rem;margin-bottom:.6rem;min-height:3rem;letter-spacing:.03em;word-break:break-word;}
.kb-row{display:flex;justify-content:center;gap:.22rem;margin-bottom:.22rem;flex-wrap:wrap;}
.kb-key{font-family:inherit;font-size:.8rem;font-weight:700;width:2.8rem;height:3rem;border:none;border-radius:.45rem;background:#eaf4fb;color:#123;cursor:pointer;box-shadow:0 .12rem 0 #b9cfdd;transition:.06s;}
.kb-key:active{transform:translateY(.1rem);box-shadow:0 .02rem 0 #b9cfdd;background:#cfe8fa;}
.kb-bottom{display:flex;gap:.5rem;justify-content:center;margin-top:.6rem;flex-wrap:wrap;}

/* ---------- модалка ---------- */
.modal-box{max-width:36rem;text-align:center;}
.modal-shape{font-size:1.9rem;font-weight:700;width:4rem;height:4rem;line-height:4rem;margin:0 auto .5rem;background:var(--pink);color:#5c0030;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);}
.modal-title{font-size:1.05rem;font-weight:700;margin-bottom:.4rem;color:#12617f;}
.modal-text{font-size:.85rem;margin-bottom:.8rem;color:var(--muted);line-height:1.4;}
.modal-btns{display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap;}

/* ---------- миссия 5 ---------- */
#m5-desk-wrap{width:100%;height:22rem;border-radius:.7rem;overflow:hidden;border:.2rem solid #7f9fb5;margin-bottom:.5rem;position:relative;}
.m5-hint{font-size:.85rem;font-weight:700;text-align:center;color:#12617f;min-height:2.2rem;padding:.3rem;margin-bottom:.4rem;}
</style>
</head>
<body>

<!-- ================= МЕНЮ ================= -->
<section class="screen active" id="scr-menu">
  <h1>Компьютерный шкаф</h1>
  <div class="tiles">
    <button type="button" class="tile" data-go="m1">
      <svg viewBox="0 0 100 100">
        <rect x="12" y="10" width="76" height="80" rx="8" fill="#e8b877" stroke="#8a5a26" stroke-width="5"/>
        <line x1="50" y1="14" x2="50" y2="86" stroke="#8a5a26" stroke-width="4"/>
        <circle cx="42" cy="50" r="4" fill="#ffe08a" stroke="#8a5a26" stroke-width="2"/>
        <circle cx="58" cy="50" r="4" fill="#ffe08a" stroke="#8a5a26" stroke-width="2"/>
        <rect x="22" y="60" width="20" height="20" rx="4" fill="#7ed957" stroke="#3f8f22" stroke-width="3"/>
        <rect x="58" y="60" width="20" height="20" rx="4" fill="#6ec6ff" stroke="#2f88c4" stroke-width="3"/>
      </svg>
      <span class="tname">Терминология</span>
      <span class="tdesc">Шкаф, полка, пакет — что это по-компьютерному?</span>
    </button>
    <button type="button" class="tile" data-go="m2">
      <svg viewBox="0 0 100 100">
        <rect x="28" y="6" width="44" height="14" rx="7" fill="#a8e2ff" stroke="#2f88c4" stroke-width="4"/>
        <line x1="50" y1="20" x2="50" y2="28" stroke="#4d6a7a" stroke-width="3"/>

<script>
'use strict';
(function(){

/* ====================== УТИЛИТЫ ====================== */
const $  = function(s, r){ return (r||document).querySelector(s); };
const $$ = function(s, r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); };
const SVGNS = 'http://www.w3.org/2000/svg';
function ce(tag, cls, html){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  return e;
}
function svgEl(tag){ return document.createElementNS(SVGNS, tag); }
function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i+1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
  });
}

/* ====================== УЧИТЕЛЮ / ТОСТ / МОДАЛКА ====================== */
function showTeacher(html){
  $('#teacher-text').innerHTML = html;
  $('#teacher').classList.add('show');
}
function hideTeacher(){ $('#teacher').classList.remove('show'); }
$('#teacher-close').addEventListener('click', hideTeacher);

let toastTimer = null;
function toast(msg, kind){
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'toast show' + (kind === 'err' ? ' err' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.className = 'toast'; }, 2600);
}

function showModal(opts){
  $('#modal-shape').textContent = opts.shape || '?';
  $('#modal-title').textContent = opts.title || '';
  $('#modal-text').textContent = opts.text || '';
  const box = $('#modal-btns');
  box.innerHTML = '';
  (opts.buttons || []).forEach(function(b){
    const el = ce('button', 'btn ' + (b.cls || 'green'), b.label);
    el.type = 'button';
    el.addEventListener('click', function(){
      $('#modal').classList.remove('show');
      if (b.action) b.action();
    });
    box.appendChild(el);
  });
  $('#modal').classList.add('show');
}

/* ====================== КЛАВИАТУРА ====================== */
let kbValue = '';
let kbCallback = null;
const KB_ROWS = ['ЙЦУКЕНГШЩЗХЪ','ФЫВАПРОЛДЖЭ','ЯЧСМИТЬБЮЁ','1234567890'];
(function buildKeyboard(){
  const rows = $('#kb-rows');
  KB_ROWS.forEach(function(r){
    const row = ce('div', 'kb-row');
    Array.from(r).forEach(function(ch){
      const b = ce('button', 'kb-key', ch);
      b.type = 'button';
      b.addEventListener('click', function(){
        if (kbValue.length < 16){ kbValue += ch; updateKbDisplay(); }
      });
      row.appendChild(b);
    });
    rows.appendChild(row);
  });
})();
function updateKbDisplay(){ $('#kb-display').textContent = kbValue || '…'; }
function openKeyboard(title, initial, onOk){
  kbValue = initial || '';
  kbCallback = onOk;
  $('#kb-title').textContent = title || 'Введите название';
  updateKbDisplay();
  $('#kb').classList.add('show');
}
$('#kb-space').addEventListener('click', function(){
  if (kbValue.length < 16){ kbValue += ' '; updateKbDisplay(); }
});
$('#kb-del').addEventListener('click', function(){ kbValue = kbValue.slice(0,-1); updateKbDisplay(); });
$('#kb-cancel').addEventListener('click', function(){ $('#kb').classList.remove('show'); });
$('#kb-ok').addEventListener('click', function(){
  const v = kbValue.trim();
  const cb = kbCallback;
  $('#kb').classList.remove('show');
  if (cb) cb(v);
});

/* ====================== DRAG ====================== */
function makeDraggable(el, opts){
  opts = opts || {};
  el.style.touchAction = 'none';
  el.addEventListener('pointerdown', function(e){
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    if (opts.canDrag && !opts.canDrag()) return;
    e.preventDefault();
    const startX = e.clientX, startY = e.clientY;
    const rect = el.getBoundingClientRect();
    let dragging = false, ghost = null;
    function onMove(ev){
      const dx = ev.clientX - startX, dy = ev.clientY - startY;
      if (!dragging && Math.sqrt(dx*dx+dy*dy) > 6){
        dragging = true;
        ghost = el.cloneNode(true);
        ghost.classList.add('drag-ghost');
        ghost.style.width = rect.width + 'px';
        ghost.style.left = rect.left + 'px';
        ghost.style.top = rect.top + 'px';
        document.body.appendChild(ghost);
        if (opts.onDragStart) opts.onDragStart();
      }
      if (dragging){
        ghost.style.left = (ev.clientX - (startX - rect.left)) + 'px';
        ghost.style.top = (ev.clientY - (startY - rect.top)) + 'px';
        const over = document.elementFromPoint(ev.clientX, ev.clientY);
        if (opts.onDragOver) opts.onDragOver(over);
      }
    }
    function onUp(ev){
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      document.removeEventListener('pointercancel', onUp);
      if (ghost){ ghost.remove(); ghost = null; }
      if (dragging){
        const over = document.elementFromPoint(ev.clientX, ev.clientY);
        if (opts.onDrop) opts.onDrop(over);
        if (opts.onDragEnd) opts.onDragEnd();
      } else {
        if (opts.onClick) opts.onClick();
      }
    }
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
    document.addEventListener('pointercancel', onUp);
  });
}

/* ====================== НАВИГАЦИЯ ====================== */
function showScreen(id){
  $$('.screen').forEach(function(s){ s.classList.remove('active'); });
  const el = document.getElementById(id);
  if (el) el.classList.add('active');
  hideTeacher();
  if (typeof stopSearchTimer === 'function') stopSearchTimer();
}
$$('[data-menu]').forEach(function(b){
  b.addEventListener('click', function(){ showScreen('scr-menu'); });
});
$$('.tile').forEach(function(t){
  t.addEventListener('click', function(){
    const go = t.getAttribute('data-go');
    if (go === 'm1') startM1();
    else if (go === 'm2') startM2();
    else if (go === 'm3') startM3();
  });
});

/* ====================== РЕЖИМ 1 ====================== */
const M1_PAIRS = [
  {pic:'Шкаф', term:'Накопитель',
   svg:'<svg viewBox="0 0 100 100"><rect x="15" y="8" width="70" height="84" rx="5" fill="#e8b877" stroke="#8a5a26" stroke-width="4"/><line x1="50" y1="12" x2="50" y2="88" stroke="#8a5a26" stroke-width="3"/><circle cx="43" cy="50" r="3.5" fill="#8a5a26"/><circle cx="57" cy="50" r="3.5" fill="#8a5a26"/></svg>',
   hint:'Шкаф — это накопитель, где хранятся все данные.'},
  {pic:'Полка', term:'Папка',
   svg:'<svg viewBox="0 0 100 100"><rect x="8" y="40" width="84" height="12" fill="#c98a4b" stroke="#8a5a26" stroke-width="3"/><rect x="14" y="52" width="72" height="34" fill="#e8b877" stroke="#8a5a26" stroke-width="3"/><rect x="18" y="20" width="8" height="20" fill="#6ec6ff" stroke="#2f88c4" stroke-width="2"/><rect x="28" y="24" width="8" height="16" fill="#ff7b7b" stroke="#c94c4c" stroke-width="2"/></svg>',
   hint:'Полка — это папка, в которой лежат файлы.'},
  {pic:'Выдвижной ящик', term:'Подпапка',
   svg:'<svg viewBox="0 0 100 100"><rect x="10" y="20" width="80" height="60" rx="4" fill="#e8b877" stroke="#8a5a26" stroke-width="4"/><rect x="15" y="28" width="70" height="20" rx="2" fill="#fff3d9" stroke="#8a5a26" stroke-width="3"/><rect x="15" y="54" width="70" height="20" rx="2" fill="#fff3d9" stroke="#8a5a26" stroke-width="3"/><circle cx="50" cy="38" r="3" fill="#8a5a26"/><circle cx="50" cy="64" r="3" fill="#8a5a26"/></svg>',
   hint:'Ящик — это подпапка: папка внутри папки.'},
  {pic:'Бумажный пакет', term:'Файл',
   svg:'<svg viewBox="0 0 100 100"><path d="M20 30 L80 30 L75 88 Q50 92 25 88 Z" fill="#f0d8a0" stroke="#8a5a26" stroke-width="4" stroke-linejoin="round"/><path d="M32 30 Q35 14 50 14 Q65 14 68 30" fill="none" stroke="#8a5a26" stroke-width="4"/><circle cx="50" cy="55" r="4" fill="#8a5a26"/></svg>',
   hint:'Пакет — это файл, ищи слово «файл».'},
  {pic:'Бумажная этикетка', term:'Имя файла',
   svg:'<svg viewBox="0 0 100 100"><rect x="18" y="30" width="64" height="44" rx="4" fill="#fff" stroke="#8a5a26" stroke-width="4"/><circle cx="30" cy="42" r="3" fill="#8a5a26"/><rect x="40" y="40" width="34" height="3" fill="#8a5a26"/><rect x="26" y="52" width="48" height="3" fill="#8a5a26"/><rect x="26" y="60" width="34" height="3" fill="#8a5a26"/></svg>',
   hint:'Этикетка — это имя файла, как файл называется.'},
  {pic:'Цветная наклейка', term:'Расширение',
   svg:'<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="34" fill="#ff9ec7" stroke="#d16b9e" stroke-width="4"/><path d="M50 22 L56 44 L78 44 L60 56 L66 78 L50 66 L34 78 L40 56 L22 44 L44 44 Z" fill="#fff" opacity="0.85"/></svg>',
   hint:'Наклейка — это расширение, оно говорит, какой это файл.'}
];
let m1Matched = 0, m1Selected = null;

function startM1(){
  showScreen('scr-m1');
  m1Matched = 0; m1Selected = null;
  const picsBox = $('#m1-pics'), termsBox = $('#m1-terms');
  picsBox.innerHTML = ''; termsBox.innerHTML = '';
  $('#m1-quiz').classList.add('hidden');
  $('#m1-quiz').innerHTML = '';
  $('#m1-game').classList.remove('hidden');
  $('#m1-score').textContent = 'Собрано: 0 / 6';

  M1_PAIRS.forEach(function(p, i){
    const card = ce('div', 'pic-card');
    card.setAttribute('data-idx', String(i));
    card.setAttribute('data-target', p.term);
    card.innerHTML = p.svg + '<div class="pic-label">' + esc(p.pic) + '</div><div class="pic-check">✓</div>';
    picsBox.appendChild(card);
    card.addEventListener('click', function(){
      if (card.classList.contains('done')) return;
      if (m1Selected && !m1Selected.classList.contains('used')){
        const sel = m1Selected; m1Selected = null;
        sel.classList.remove('sel');
        tryMatchM1(sel, card);
      }
    });
  });

  shuffle(M1_PAIRS.map(function(_,i){return i;})).forEach(function(i){
    const p = M1_PAIRS[i];
    const t = ce('div', 'term-card', esc(p.term));
    t.setAttribute('data-idx', String(i));
    termsBox.appendChild(t);
    makeDraggable(t, {
      canDrag: function(){ return !t.classList.contains('used'); },
      onDragStart: function(){ t.classList.add('dragging'); },
      onDragOver: function(over){
        $$('.pic-card').forEach(function(c){ c.classList.remove('over'); });
        const pc = over && over.closest ? over.closest('.pic-card') : null;
        if (pc && !pc.classList.contains('done')) pc.classList.add('over');
      },
      onDrop: function(over){
        $$('.pic-card').forEach(function(c){ c.classList.remove('over'); });
        const pc = over && over.closest ? over.closest('.pic-card') : null;
        if (pc) tryMatchM1(t, pc);
      },
      onDragEnd: function(){ t.classList.remove('dragging'); $$('.pic-card').forEach(function(c){c.classList.remove('over');}); },
      onClick: function(){
        if (m1Selected === t){ t.classList.remove('sel'); m1Selected = null; return; }
        $$('.term-card').forEach(function(x){ x.classList.remove('sel'); });
        t.classList.add('sel'); m1Selected = t;
      }
    });
  });

  showTeacher('<b>Учителю:</b> Режим «Терминология». Дети перетаскивают термины на картинки (или: клик по термину → клик по картинке).');
}

function tryMatchM1(termEl, picCard){
  if (termEl.classList.contains('used')) return;
  if (picCard.classList.contains('done')) return;
  const idx = Number(termEl.getAttribute('data-idx'));
  const target = picCard.getAttribute('data-target');
  if (M1_PAIRS[idx].term === target){
    termEl.classList.add('used');
    picCard.classList.add('done');
    picCard.appendChild(ce('div', 'matched-term', esc(M1_PAIRS[idx].term)));
    m1Matched++;
    $('#m1-score').textContent = 'Собрано: ' + m1Matched + ' / 6';
    if (m1Matched === 6) setTimeout(showQuizM1, 600);
  } else {
    termEl.classList.add('shake');
    setTimeout(function(){ termEl.classList.remove('shake'); }, 500);
    toast(M1_PAIRS[idx].hint, 'err');
  }
}

function showQuizM1(){
  $('#m1-game').classList.add('hidden');
  const quiz = $('#m1-quiz');
  quiz.classList.remove('hidden');
  quiz.innerHTML = '';
  const questions = [
    {q:'Шкаф — это…?', opts:['накопитель','папка','файл'], right:'накопитель'},
    {q:'Полка — это…?', opts:['накопитель','папка','файл'], right:'папка'},
    {q:'Пакет — это…?', opts:['накопитель','папка','файл'], right:'файл'}
  ];
  let qi = 0, score = 0;
  const title = ce('div','q-title'), optsBox = ce('div','q-opts'), prog = ce('div','q-progress');
  quiz.appendChild(title); quiz.appendChild(optsBox); quiz.appendChild(prog);

  (function render(){
    if (qi >= questions.length){
      title.textContent = 'Готово! Правильных ответов: ' + score + ' из ' + questions.length;
      optsBox.innerHTML = ''; prog.textContent = '';
      const back = ce('button','btn green','Играть снова');
      back.type = 'button';
      back.addEventListener('click', startM1);
      const menu = ce('button','btn blue','В меню');
      menu.type = 'button';
      menu.addEventListener('click', function(){ showScreen('scr-menu'); });
      optsBox.appendChild(back); optsBox.appendChild(menu);
      return;
    }
    const Q = questions[qi];
    title.textContent = Q.q;
    prog.textContent = 'Вопрос ' + (qi+1) + ' из ' + questions.length;
    optsBox.innerHTML = '';
    shuffle(Q.opts).forEach(function(o){
      const b = ce('button','q-opt',esc(o));
      b.type = 'button';
      b.addEventListener('click', function(){
        if (o === Q.right){ b.classList.add('ok'); score++; }
        else {
          b.classList.add('bad');
          $$('.q-opt').forEach(function(x){ if (x.textContent === Q.right) x.classList.add('ok'); });
        }
        $$('.q-opt').forEach(function(x){ x.disabled = true; });
        setTimeout(function(){ qi++; render(); }, 900);
      });
      optsBox.appendChild(b);
    });
  })();

/* Запланировать перерисовку стрелок для конкретного .drakon */
function scheduleRedraw(drakon){
  if (!drakon) return;
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){ redrawDrakon(drakon); });
  });
}

function buildDrakonSchema(container, nodes, sideNode, mode){
  container.innerHTML = '';
  const drakon = ce('div', 'drakon');
  container.appendChild(drakon);

  let loopBackId = null;
  nodes.forEach(function(n){ if (n.shape === 'hex' && n.loopBack) loopBackId = n.loopBack; });
  if (loopBackId) drakon.setAttribute('data-loopback', loopBackId);

  const svg = svgEl('svg');
  svg.classList.add('drakon-arrows');
  svg.setAttribute('xmlns', SVGNS);
  drakon.appendChild(svg);

  nodes.forEach(function(def, i){
    const isBranch = (def.shape === 'hex');
    if (isBranch){
      const line = ce('div', 'dk-line dk-line-branch');
      const cell = ce('div', 'dk-spine-cell');
      cell.appendChild(makeDrakonSlot(mode, def));
      line.appendChild(cell);
      line.appendChild(ce('div', 'dk-branch-arrow', 'Да →'));
      line.appendChild(makeDrakonSlot(mode, sideNode, true));
      drakon.appendChild(line);
    } else {
      const line = ce('div', 'dk-line');
      line.appendChild(makeDrakonSlot(mode, def));
      drakon.appendChild(line);
    }
    if (i < nodes.length - 1){
      const arr = ce('div', 'dk-arr');
      if (def.shape === 'hex') arr.appendChild(ce('span', 'dk-arr-label нет', 'Нет'));
      drakon.appendChild(arr);
    }
  });

  scheduleRedraw(drakon);
  return drakon;
}

function makeDrakonSlot(mode, def, isSide){
  const slot = ce('div', 'slot dk-' + def.shape);
  slot.setAttribute('data-id', def.id);
  if (mode === 'build'){
    slot.setAttribute('data-slot', isSide ? 'side' : def.id);
  } else if (mode === 'run'){
    if (!isSide) slot.setAttribute('data-run-step', def.id);
    else slot.setAttribute('data-run-step', 'side');
  }
  if (mode === 'static'){
    slot.textContent = def.text;
    return slot;
  }
  if (mode === 'run'){
    const chip = ce('div', 'm2-chip in-slot dk-' + def.shape, esc(def.text));
    slot.appendChild(chip);
    slot.addEventListener('click', function(){
      if (!isSide) onSchemaClick(def.id);
    });
  }
  return slot;
}

/* Возвратная петля: из ПРАВОЙ грани бокового блока → вправо → вверх → влево → в шампур НАД целевым блоком.
   Стрелки пересчитываются относительно текущего layout, поэтому корректно двигаются
   при любом изменении размеров слотов (после заполнения, проверки, ресайза). */
function redrawDrakon(drakon){
  const svg = drakon.querySelector('.drakon-arrows');
  if (!svg) return;
  const w = drakon.scrollWidth;
  const h = drakon.scrollHeight;
  if (w === 0 || h === 0) return;
  svg.setAttribute('width', String(w));
  svg.setAttribute('height', String(h));
  svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
  svg.style.width = w + 'px';
  svg.style.height = h + 'px';
  svg.innerHTML = '';

  const cRect = drakon.getBoundingClientRect();
  function rel(el){
    const r = el.getBoundingClientRect();
    return { l:r.left-cRect.left, t:r.top-cRect.top, r:r.right-cRect.left, b:r.bottom-cRect.top,
             w:r.width, h:r.height, cx:(r.left+r.right)/2-cRect.left, cy:(r.top+r.bottom)/2-cRect.top };
  }

  const branchLine = drakon.querySelector('.dk-line-branch');
  if (!branchLine) return;
  const branchCell = branchLine.querySelector('.dk-spine-cell .slot');
  const sideSlot = branchLine.lastElementChild;
  if (!branchCell || !sideSlot) return;

  const loopBackId = drakon.getAttribute('data-loopback');
  const targetSlot = loopBackId ? drakon.querySelector('[data-id="' + loopBackId + '"]') : null;
  if (!targetSlot) return;

  const branch = rel(branchCell);
  const side = rel(sideSlot);
  const target = rel(targetSlot);

  // 1. «Да» — от правого угла hex к боковому блоку
  const arrY = branch.cy;
  const startX = branch.r + 2;
  const endX = side.l - 12;
  const line1 = svgEl('path');
  line1.setAttribute('d', 'M ' + startX + ' ' + arrY + ' L ' + endX + ' ' + arrY);
  line1.setAttribute('fill','none');
  line1.setAttribute('stroke','#3f8f22');
  line1.setAttribute('stroke-width','2.5');
  svg.appendChild(line1);

  const arrow1 = svgEl('polygon');
  arrow1.setAttribute('points',
    (endX + 1) + ',' + (arrY - 7) + ' ' +
    (endX + 12) + ',' + arrY + ' ' +
    (endX + 1) + ',' + (arrY + 7));
  arrow1.setAttribute('fill','#3f8f22');
  svg.appendChild(arrow1);

  // 2. Возврат: из правой грани бокового блока вправо-вверх, к шампуру НАД целевым блоком
  const outerX = Math.max(side.r, target.r) + 26;
  const enterY = target.t - 14;
  const spineX = target.cx;
  const loopPath = svgEl('path');
  const d = 'M ' + side.r + ' ' + side.cy +
            ' L ' + outerX + ' ' + side.cy +
            ' L ' + outerX + ' ' + enterY +
            ' L ' + spineX + ' ' + enterY;
  loopPath.setAttribute('d', d);
  loopPath.setAttribute('fill','none');
  loopPath.setAttribute('stroke','#3f8f22');
  loopPath.setAttribute('stroke-width','2.5');
  loopPath.setAttribute('stroke-dasharray','7 5');
  loopPath.setAttribute('stroke-linejoin','round');
  svg.appendChild(loopPath);

  const arrow2 = svgEl('polygon');
  arrow2.setAttribute('points',
    (spineX - 8) + ',' + (enterY + 1) + ' ' +
    spineX + ',' + (enterY + 14) + ' ' +
    (spineX + 8) + ',' + (enterY + 1));
  arrow2.setAttribute('fill','#3f8f22');
  svg.appendChild(arrow2);

  const lab = svgEl('text');
  lab.setAttribute('x', String(outerX + 6));
  lab.setAttribute('y', String(side.cy - 6));
  lab.setAttribute('fill', '#3f8f22');
  lab.setAttribute('font-size', '18');
  lab.setAttribute('font-weight', '700');
  lab.textContent = '↺';
  svg.appendChild(lab);
}

function startM2(){
  showScreen('scr-m2');
  buildDrakonSchema($('#m2-slots'), M2_CORRECT, M2_SIDE, 'build');

  const pool = $('#m2-pool');
  pool.innerHTML = '';
  shuffle(M2_CORRECT.concat([M2_SIDE])).forEach(function(def){
    const chip = ce('div', 'm2-chip dk-' + def.shape, esc(def.text));
    chip.setAttribute('data-id', def.id);
    chip.setAttribute('data-shape', def.shape);
    pool.appendChild(chip);
    makeChipDraggable(chip);
  });

  $('#m2-check').classList.remove('hidden');
  $('#m2-run').classList.add('hidden');

  showTeacher('<b>Учителю:</b> Режим «Сборка схемы». Расставьте иконки по слотам слева. Шестиугольник — вопрос, «Ввести имя» — зелёный блок с вырезом слева, «Придумать другое имя» — боковой блок на ветке «Да».');
}

function makeChipDraggable(chip){
  makeDraggable(chip, {
    onDragStart: function(){ chip.classList.add('dragging'); },
    onDragOver: function(over){
      $$('#m2-slots .slot').forEach(function(s){ s.classList.remove('over'); });
      const slot = over && over.closest ? over.closest('#m2-slots .slot') : null;
      if (slot) slot.classList.add('over');
    },
    onDrop: function(over){
      $$('#m2-slots .slot').forEach(function(s){ s.classList.remove('over'); });
      const slot = over && over.closest ? over.closest('#m2-slots .slot') : null;
      if (slot) placeChipInSlot(chip, slot);
      else returnChipToPool(chip);
    },
    onDragEnd: function(){ chip.classList.remove('dragging'); },
    onClick: function(){
      if (chip.parentElement && chip.parentElement.classList.contains('slot')){
        returnChipToPool(chip);
      }
    }
  });
}

function returnChipToPool(chip){
  const oldSlot = chip.parentElement;
  if (oldSlot && oldSlot.classList.contains('slot')){
    oldSlot.innerHTML = '';
    oldSlot.classList.remove('occupied');
  }
  $('#m2-pool').appendChild(chip);
  chip.classList.remove('in-slot');
  chip.style.cursor = 'grab';
  // ДИНАМИЧЕСКАЯ перерисовка стрелок после изменения состава слота
  const drakon = $('#m2-slots .drakon');
  scheduleRedraw(drakon);
}

function placeChipInSlot(chip, slot){
  const oldSlot = chip.parentElement;
  if (oldSlot && oldSlot.classList.contains('slot') && oldSlot !== slot){
    oldSlot.innerHTML = '';
    oldSlot.classList.remove('occupied');
  }
  while (slot.firstChild){
    const prev = slot.firstChild;
    slot.removeChild(prev);
    $('#m2-pool').appendChild(prev);
    prev.classList.remove('in-slot');
    prev.style.cursor = 'grab';
  }
  slot.appendChild(chip);
  slot.classList.add('occupied');
  chip.classList.add('in-slot');
  chip.style.cursor = 'pointer';
  // ДИНАМИЧЕСКАЯ перерисовка стрелок после изменения состава слота
  const drakon = slot.closest('.drakon');
  scheduleRedraw(drakon);
}

$('#m2-check').addEventListener('click', function(){
  $$('#m2-slots .slot').forEach(function(s){ s.classList.remove('right','wrong'); });
  let allRight = true, filled = 0;
  M2_CORRECT.forEach(function(def){
    const slot = $('#m2-slots .slot[data-slot="' + def.id + '"]');
    if (!slot) return;
    const held = slot.firstChild ? slot.firstChild.getAttribute('data-id') : null;
    if (held) filled++;
    if (held === def.id) slot.classList.add('right');
    else { slot.classList.add('wrong'); allRight = false; }
  });
  const side = $('#m2-slots .slot[data-slot="side"]');
  const sideHeld = side.firstChild ? side.firstChild.getAttribute('data-id') : null;
  if (sideHeld) filled++;
  if (sideHeld === M2_SIDE.id) side.classList.add('right');
  else { side.classList.add('wrong'); allRight = false; }

  // Обновить SVG-стрелки после применения классов (на случай изменения layout)
  scheduleRedraw($('#m2-slots .drakon'));

  if (filled < 9){ toast('Не все иконки на месте! Осталось ' + (9 - filled) + '.', 'err'); return; }
  if (allRight){
    toast('Отлично! Схема собрана верно.');
    $('#m2-run').classList.remove('hidden');
    showTeacher('<b>Учителю:</b> Схема собрана! Нажмите «Исполнить ▶».');
  } else {
    toast('Есть ошибки. Красные слоты — переставь.', 'err');
  }
});

let runState = null;

function startM2Run(){
  showScreen('scr-m2run');
  runState = { step: 0, folderEl: null, created: false };
  buildDrakonSchema($('#run-schema'), M2_CORRECT, M2_SIDE, 'run');
  renderRunDesk();
  updateRunHighlight();
  showTeacher('<b>Учителю:</b> Нажимайте иконки схемы по очереди. Введите «Рисунки» — увидите ветвление. Ветка «Да» обходит справа-сверху и входит в шампур над «Ввести имя».');
}

function updateRunHighlight(){
  $$('#run-schema .slot').forEach(function(s){
    s.classList.remove('current','right');
    const stepId = s.getAttribute('data-run-step');
    const idx = M2_CORRECT.findIndex(function(d){ return d.id === stepId; });
    if (idx >= 0 && idx < runState.step) s.classList.add('right');
  });
  if (runState.step < M2_CORRECT.length){
    const curId = M2_CORRECT[runState.step].id;
    const cur = $('#run-schema .slot[data-run-step="' + curId + '"]');
    if (cur) cur.classList.add('current');
  }
  // Перерисовать SVG-стрелки, чтобы они оставались в правильных местах
  scheduleRedraw($('#run-schema .drakon'));
}

function renderRunDesk(){
  const wrap = $('#run-desk-wrap');
  wrap.innerHTML = '';
  const desk = ce('div', 'desk');
  const icons = ce('div', 'desk-icons');
  desk.appendChild(icons);
  icons.appendChild(makeDeskFolder('Рисунки', true));
  wrap.appendChild(desk);
}

function makeDeskFolder(name, isInitial){
  const f = ce('div', 'desk-folder');
  f.setAttribute('data-name', name);
  f.innerHTML = '<svg viewBox="0 0 40 40"><path d="M4 10 L16 10 L19 14 L36 14 L36 32 L4 32 Z" fill="#ffd166" stroke="#8a5a00" stroke-width="2" stroke-linejoin="round"/><path d="M4 10 L16 10 L19 14 L4 14 Z" fill="#ffb700" stroke="#8a5a00" stroke-width="2"/></svg><div class="fname">' + esc(name) + '</div>';
  if (isInitial) f.classList.add('init');
  return f;
}

function onSchemaClick(stepId){
  if (!runState) return;
  const expected = M2_CORRECT[runState.step];
  if (!expected) return;
  if (stepId !== expected.id){
    toast('Сейчас не этот шаг. Смотри на подсвеченную иконку.', 'err');
    return;
  }
  const result = execStep(expected.id);
  if (result === 'wait' || result === 'fail') return;
  runState.step++;
  updateRunHighlight();
  if (runState.step >= M2_CORRECT.length) setTimeout(finishRun, 400);
}

function closeAllMenus(){ $$('.desk-menu').forEach(function(m){ m.remove(); }); }

function execStep(id){
  const desk = $('#run-desk-wrap .desk');
  if (!desk) return 'fail';
  const icons = desk.querySelector('.desk-icons');

  if (id === 'start'){ toast('Начало!'); return; }

  if (id === 'rclick'){
    closeAllMenus();
    const menu = ce('div', 'desk-menu');
    ['Создать','Обновить','Свойства'].forEach(function(mi){
      menu.appendChild(ce('div','mi',mi));
    });
    menu.style.left = '30%'; menu.style.top = '28%';
    desk.appendChild(menu);
    return;
  }

  if (id === 'create'){
    closeAllMenus();
    const menu = ce('div', 'desk-menu');
    ['Папка','Документ'].forEach(function(mi){
      menu.appendChild(ce('div','mi',mi));
    });
    menu.style.left = '40%'; menu.style.top = '34%';
    desk.appendChild(menu);
    return;
  }

  if (id === 'folder'){
    closeAllMenus();
    const f = ce('div', 'desk-folder new');
    f.innerHTML = '<svg viewBox="0 0 40 40"><path d="M4 10 L16 10 L19 14 L36 14 L36 32 L4 32 Z" fill="#ffd166" stroke="#8a5a00" stroke-width="2" stroke-linejoin="round"/><path d="M4 10 L16 10 L19 14 L4 14 Z" fill="#ffb700" stroke="#8a5a00" stroke-width="2"/></svg><input class="desk-input" maxlength="14" placeholder="имя…" value="">';
    icons.appendChild(f);
    runState.folderEl = f;
    const inp = f.querySelector('input');
    inp.addEventListener('click', function(e){ e.stopPropagation(); });
    inp.addEventListener('keydown', function(e){
      if (e.key === 'Enter'){
        if (runState.step === M2_CORRECT.findIndex(function(d){ return d.id === 'name'; })){
          runState.step = M2_CORRECT.findIndex(function(d){ return d.id === 'check'; });
          updateRunHighlight();
        }
        if (runState.step === M2_CORRECT.findIndex(function(d){ return d.id === 'check'; })){
          onSchemaClick('check');
        }
      }
    });
    return;
  }

  if (id === 'name'){
    const inp = runState.folderEl && runState.folderEl.querySelector('input');
    if (!inp){ toast('Сначала создай папку.', 'err'); return 'fail'; }
    inp.focus();
    toast('Введи имя и нажми Enter. Попробуй «Рисунки».');
    return;
  }

  if (id === 'check'){
    const inp = runState.folderEl && runState.folderEl.querySelector('input');
    if (!inp){ return; }
    const name = inp.value.trim();
    if (!name){ toast('Введи имя папки.', 'err'); inp.focus(); return 'fail'; }
    if (name.toLowerCase() === 'рисунки'){
      showModal({
        shape:'?',
        title:'Такое имя уже есть?',
        text:'На столе уже есть папка «Рисунки». Что делать?',
        buttons:[
          {label:'Да, другое имя', cls:'green', action: function(){
            toast('Придумай другое имя!', 'err');
            inp.value = ''; inp.focus();
            runState.step = M2_CORRECT.findIndex(function(d){ return d.id === 'name'; });
            updateRunHighlight();
          }},
          {label:'Нет, создать', cls:'gray', action: function(){
            finalizeFolder(name);
            runState.step = M2_CORRECT.findIndex(function(d){ return d.id === 'aside'; });
            updateRunHighlight();
          }}
        ]
      });
      return 'wait';
    }
    finalizeFolder(name);
    toast('Имя «' + name + '» подходит.');
    return;
  }

  if (id === 'aside'){ toast('Папка зафиксирована. Конец!'); return; }
  if (id === 'end') return;
}

function finalizeFolder(name){
  if (!runState.folderEl) return;
  const inp = runState.folderEl.querySelector('input');
  const fnameEl = ce('div', 'fname', esc(name));
  if (inp) inp.replaceWith(fnameEl);
  else runState.folderEl.appendChild(fnameEl);
  runState.folderEl.classList.remove('new');
  runState.created = true;
}

function finishRun(){
  const desk = $('#run-desk-wrap .desk');
  if (!desk) return;
  const done = ce('div');
  done.style.cssText = 'position:absolute;inset:0;background:rgba(255,255,255,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5rem;z-index:60;';
  done.innerHTML = '<div style="font-size:1.5rem;font-weight:700;color:#2f8f22">Готово! 🎉</div><div style="font-size:.9rem;color:#2c4653">Папка создана на рабочем столе.</div>';
  desk.appendChild(done);
  showTeacher('<b>Учителю:</b> Схема пройдена. Дети увидели, как создаётся папка.');
}

function fileSVG(icon){ return ICON_SVG[icon] || ICON_SVG.book; }

let ws = null;
let missionTimer = null;

function stopSearchTimer(){
  if (missionTimer){ clearInterval(missionTimer); missionTimer = null; }
  const t = $('#ws-timer');
  if (t){ t.classList.add('hidden'); t.classList.remove('urgent'); }
}

function startM3(){
  showScreen('scr-m3');
  ws = { shelves: [], basket: [], stars: 0, mission: 0, shelfSeq: 1, searchTarget: null, searchList: [], mission4Init: false, mission6Done: false };
  updateStars(); updateMissionTitle(); renderWorkshop();
  showSchema2Overlay();
  showTeacher('<b>Учителю:</b> Режим «Мастерская». Шкаф пустой. Сначала — схема 2. Затем создавайте полки кнопкой «＋ Полка». Миссии — по кнопке «Следующая миссия».');
}

function updateStars(){ if (ws) $('#ws-stars').textContent = '⭐ ' + ws.stars; }
function updateMissionTitle(){
  if (!ws) return;
  const t = $('#m3-title');
  if (ws.mission === 0) t.textContent = 'Мастерская — подготовка';
  else t.textContent = 'Мастерская — миссия ' + ws.mission;
}

function renderWorkshop(){
  if (!ws) return;
  const box = $('#ws-shelves');
  box.innerHTML = '';
  if (ws.shelves.length === 0) box.appendChild(ce('div','empty-note','Шкаф пустой. Нажми «＋ Полка», чтобы добавить первую полку.'));
  ws.shelves.forEach(function(shelf){
    const el = ce('div', 'shelf');
    el.setAttribute('data-shelf-id', String(shelf.id));
    el.appendChild(ce('div','shelf-name',esc(shelf.name)));
    const filesBox = ce('div','shelf-files');
    if (shelf.files.length === 0) filesBox.appendChild(ce('div','empty-note','— пусто —'));
    else shelf.files.forEach(function(f){ filesBox.appendChild(makeFileEl(f, true)); });
    el.appendChild(filesBox);
    const del = ce('button', 'shelf-del', '✕');
    del.type = 'button';
    del.title = 'Удалить полку';
    del.addEventListener('click', function(e){
      e.stopPropagation();
      tryRemoveShelf(shelf.id);
    });
    el.appendChild(del);
    box.appendChild(el);
  });

  const basket = $('#ws-basket');
  basket.innerHTML = '';
  if (ws.basket.length === 0) basket.appendChild(ce('div','empty-note','— корзина пуста —'));
  else ws.basket.forEach(function(f){ basket.appendChild(makeFileEl(f, false)); });
  if (ws.mission === 2) basket.classList.add('no-drag');
  else basket.classList.remove('no-drag');
  updateStars();
}

function makeFileEl(file, onShelf){
  const el = ce('div','file');
  el.setAttribute('data-file-id', file.id);
  el.setAttribute('data-type', file.type);
  el.setAttribute('data-name', file.name);

  const svgWrap = ce('span');
  svgWrap.innerHTML = fileSVG(file.icon);
  const svgEl0 = svgWrap.firstChild;
  svgEl0.style.width = '1.6rem'; svgEl0.style.height = '1.6rem';
  el.appendChild(svgEl0);
  el.appendChild(ce('div', 'sticker ' + file.sticker));
  el.appendChild(ce('div','ftext',esc(file.name)));

  const canDrag = !(ws && ws.mission === 2 && !onShelf);
  if (canDrag){
    makeDraggable(el, {
      onDragStart: function(){ el.classList.add('dragging'); },
      onDragOver: function(over){
        $$('.shelf').forEach(function(s){ s.classList.remove('over'); });
        const sh = over && over.closest ? over.closest('.shelf') : null;
        if (sh) sh.classList.add('over');
      },
      onDrop: function(over){
        $$('.shelf').forEach(function(s){ s.classList.remove('over'); });
        const sh = over && over.closest ? over.closest('.shelf') : null;
        if (sh){ const sid = Number(sh.getAttribute('data-shelf-id')); tryDropFile(file.id, sid); }
        else if (onShelf){ returnFileToBasket(file.id); }
      },
      onDragEnd: function(){ el.classList.remove('dragging'); $$('.shelf').forEach(function(s){ s.classList.remove('over'); }); }
    });
  }

  if (file.type === 'trap'){
    el.addEventListener('pointerenter', function(){ highlightTrap(file); });
    el.addEventListener('pointerleave', clearTrapHighlight);
  }
  return el;
}

function getFileById(id){
  for (let i = 0; i < ws.shelves.length; i++){
    const s = ws.shelves[i];
    const f = s.files.find(function(x){ return x.id === id; });
    if (f) return { file:f, shelf:s };
  }
  const f = ws.basket.find(function(x){ return x.id === id; });
  if (f) return { file:f, shelf:null };
  return null;
}
function removeFileEverywhere(id){
  ws.basket = ws.basket.filter(function(f){ return f.id !== id; });
  ws.shelves.forEach(function(s){ s.files = s.files.filter(function(f){ return f.id !== id; }); });
}

function tryDropFile(fileId, shelfId){
  const info = getFileById(fileId);
  if (!info) return;
  const target = ws.shelves.find(function(s){ return s.id === shelfId; });
  if (!target) return;
  const res = checkFileToShelf(info.file, target.name);
  if (res.ok){
    removeFileEverywhere(fileId);
    target.files.push(info.file);
    ws.stars++;
    toast('Верно! ⭐');
    renderWorkshop();
  } else {
    toast(res.hint || 'Подумай ещё, куда это положить.', 'err');
    renderWorkshop();
  }
}
function returnFileToBasket(id){
  const info = getFileById(id);
  if (!info || !info.shelf) return;
  info.shelf.files = info.shelf.files.filter(function(f){ return f.id !== id; });
  ws.basket.push(info.file);
  renderWorkshop();
}

function checkFileToShelf(file, shelfName){
  const sn = shelfName.toLowerCase();
  if (file.name === 'Письмо дедушке' && sn.indexOf('семейн') >= 0) return { ok:true };
  if (file.name === 'Письмо дедушке' && sn.indexOf('документ') >= 0) return { ok:true };
  if (file.type === 'trap'){
    const ok = (file.accept || []).some(function(a){ return sn.indexOf(a) >= 0; });
    if (ok) return { ok:true };
    return { ok:false, hint:'Этот файл подходит двум полкам — например «Музыка» и «Мультики».' };
  }
  const n = file.name.toLowerCase();
  let keys = [], hint = 'Подумай, где бы ты искал этот файл.';
  if (n.indexOf('фотограф') >= 0 || n.indexOf('фото ') === 0 || n === 'фото'){
    keys = ['фото','фотк','снимк']; hint = 'Фотография хочет на полку «Фото».';
  } else if (n.indexOf('рисунок') >= 0){
    keys = ['рисунк','рисуно']; hint = 'Рисунок хочет на полку «Рисунки».';
  } else if (n.indexOf('колыбельн') >= 0 || n.indexOf('песенк') >= 0 || n.indexOf('речка') >= 0){
    keys = ['музык','песн','аудио','колыбельн']; hint = 'Песенка хочет на полку «Музыка».';
  } else if (n.indexOf('сказк') >= 0 || n.indexOf('письм') >= 0 || n.indexOf('рецепт') >= 0){
    keys = ['документ','текст','письм','книг','бумаг','семейн']; hint = 'Текстовый файл хочет на полку «Документы».';
  } else if (n.indexOf('мультик') >= 0){
    keys = ['мульт','видео','фильм']; hint = 'Мультик хочет на полку «Мультики».';
  }
  const ok = keys.some(function(k){ return sn.indexOf(k) >= 0; });
  if (ok) return { ok:true };
  return { ok:false, hint: hint };
}

function highlightTrap(file){
  $$('.shelf').forEach(function(sh){
    const nameEl = sh.querySelector('.shelf-name');
    if (!nameEl) return;
    const name = nameEl.textContent.toLowerCase();
    const ok = (file.accept || []).some(function(a){ return name.indexOf(a) >= 0; });
    if (ok) sh.classList.add('hl');
  });
}
function clearTrapHighlight(){ $$('.shelf').forEach(function(sh){ sh.classList.remove('hl'); }); }

/* Проверка дубликата имени полки (без учёта регистра, с обрезкой пробелов) */
function shelfNameExists(name){
  const n = String(name).trim().toLowerCase();
  if (!n) return false;
  return ws.shelves.some(function(s){ return s.name.trim().toLowerCase() === n; });
}

function addShelf(name){
  if (!ws) return false;
  const trimmed = String(name || '').trim();
  if (!trimmed){ toast('Пустое имя. Попробуй ещё.', 'err'); return false; }
  if (ws.shelves.length >= 8){ toast('Больше 8 полок не поместится!', 'err'); return false; }
  if (shelfNameExists(trimmed)){ toast('Полка «' + trimmed + '» уже есть. Придумай другое имя.', 'err'); return false; }

  const shelf = { id: ws.shelfSeq++, name: trimmed, files: [] };
  ws.shelves.push(shelf);
  renderWorkshop();
  toast('Полка «' + trimmed + '» добавлена.');

  if (ws.mission === 4 && !ws.mission4Init){
    const nm = trimmed.toLowerCase();
    if (nm.indexOf('разн') >= 0){
      ws.mission4Init = true;
      shelf.files.push({id:'m4a' + Date.now(), name:'Рисунок дома', type:'picture', sticker:'green', icon:'drawing'});
      shelf.files.push({id:'m4b' + Date.now() + '_2', name:'Рисунок кораблика', type:'picture', sticker:'green', icon:'drawing'});
      shelf.files.push({id:'m4c' + Date.now() + '_3', name:'Песенка про алфавит', type:'audio', sticker:'red', icon:'note'});
      shelf.files.push({id:'m4d' + Date.now() + '_4', name:'Песенка про паровозик', type:'audio', sticker:'red', icon:'music'});
      renderWorkshop();
    }
  }
  return true;
}

/* --- Удаление полки --- */
function tryRemoveShelf(shelfId){
  if (!ws) return;
  const shelf = ws.shelves.find(function(s){ return s.id === shelfId; });
  if (!shelf) return;
  if (shelf.files.length > 0){
    toast('Полка «' + shelf.name + '» не пустая. Сначала переложи файлы.', 'err');
    return;
  }
  ws.shelves = ws.shelves.filter(function(s){ return s.id !== shelfId; });
  renderWorkshop();
  toast('Полка «' + shelf.name + '» удалена.');
  if (ws.mission === 6) checkMission6();
}

$('#m3-plus').addEventListener('click', function(){
  if (!ws) return;
  if (ws.shelves.length >= 8){ toast('Больше 8 полок не поместится!', 'err'); return; }
  openKeyboard('Назови полку', '', function(v){
    if (!v){ toast('Пустое имя. Попробуй ещё.', 'err'); return; }
    addShelf(v);
  });
});
$('#m3-del').addEventListener('click', function(){
  if (!ws) return;
  const empty = ws.shelves.filter(function(s){ return s.files.length === 0; });
  if (ws.shelves.length === 0){ toast('Полок пока нет.', 'err'); return; }
  if (empty.length === 0){
    toast('Все полки заняты. Переложи файлы, чтобы освободить полку.', 'err');
    return;
  }
  showShelfPicker(empty);
});

function showShelfPicker(emptyShelves){
  const box = $('#modal-btns');
  $('#modal-shape').textContent = '✕';
  $('#modal-title').textContent = 'Какую полку удалить?';
  $('#modal-text').textContent = 'Удалить можно только пустую полку.';
  box.innerHTML = '';
  emptyShelves.forEach(function(s){
    const b = ce('button', 'btn red', esc(s.name));
    b.type = 'button';
    b.addEventListener('click', function(){

      ws.shelves = ws.shelves.filter(function(x){ return x.id !== s.id; });
      renderWorkshop();
      toast('Полка «' + s.name + '» удалена.');
      if (ws.mission === 6) checkMission6();
    });
    box.appendChild(b);
  });
  const cancel = ce('button', 'btn gray', 'Отмена');
  cancel.type = 'button';

}

/* --- миссии --- */
function nextMission(){
  if (!ws) return;
  stopSearchTimer();
  ws.mission++;
  if (ws.mission > 6){ toast('Все миссии пройдены! Молодцы!'); ws.mission = 6; return; }
  updateMissionTitle();
  setupMission(ws.mission);
}

function setupMission(n){
  if (n === 1){
    ws.shelves = []; ws.basket = [];
    let uid = 1;
    FILES_DATA.forEach(function(f){
      const copy = JSON.parse(JSON.stringify(f));
      copy.id = 'b' + (uid++);
      ws.basket.push(copy);
    });
    renderWorkshop();
    showTeacher('<b>Учителю:</b> Миссия 1. Сортировка по смыслу. Создайте полки (например: Фото, Рисунки, Музыка, Документы, Мультики) и попросите ребёнка разложить файлы.');
  }
  else if (n === 2){
    if (ws.shelves.length === 0){
      ['Фото','Рисунки','Музыка','Документы','Мультики'].forEach(function(nm){ addShelf(nm); });
    }
    let need = true;
    ws.shelves.forEach(function(s){ if (s.files.length > 0) need = false; });
    if (need){
      let i = 0;
      FILES_DATA.forEach(function(f){
        const s = ws.shelves[i % ws.shelves.length];
        const copy = JSON.parse(JSON.stringify(f));
        copy.id = 's' + (i++);
        s.files.push(copy);
      });
    }
    ws.basket = [];
    renderWorkshop();
    startSearchMission();
    showTeacher('<b>Учителю:</b> Миссия 2. Поиск. Диктуйте детям имена файлов. Ребёнок кликает по полке, где файл живёт. 10 секунд.');
  }
  else if (n === 3){
    if (ws.shelves.length === 0){
      ['Документы','Фото','Рисунки','Музыка','Мультики'].forEach(function(nm){ addShelf(nm); });
    }
    let docShelf = ws.shelves.find(function(s){ return s.name.toLowerCase().indexOf('документ') >= 0; });
    if (!docShelf){ addShelf('Документы'); docShelf = ws.shelves[ws.shelves.length - 1]; }
    ws.basket = ws.basket.filter(function(f){ return f.name !== 'Письмо дедушке'; });
    ws.shelves.forEach(function(s){ s.files = s.files.filter(function(f){ return f.name !== 'Письмо дедушке'; }); });
    docShelf.files.push({id:'letter' + Date.now(), name:'Письмо дедушке', type:'text', sticker:'blue', icon:'letter'});
    renderWorkshop();
    showTeacher('<b>Учителю:</b> Миссия 3. Файл «Письмо дедушке» лежит на полке «Документы». Создайте полку «Семейное» и попросите ребёнка перенести туда письмо.');
  }
  else if (n === 4){
    if (ws.shelves.length === 0){
      ['Фото','Рисунки','Музыка','Документы','Мультики'].forEach(function(nm){ addShelf(nm); });
    }
    ws.mission4Init = false;
    renderWorkshop();
    showTeacher('<b>Учителю:</b> Миссия 4. Создайте полку «Разное» — в неё упадут 4 файла. Задача: 2 рисунка — на «Рисунки», 2 песенки — на «Музыку».');
  }
  else if (n === 5){
    renderWorkshop();
    showTeacher('<b>Учителю:</b> Миссия 5. Нажмите «Создать папку» — откроется мини-сценарий с виртуальным столом: ПКМ → Создать → Папка → ввод имени. Попробуйте имя «Рисунки».');
  }
  else if (n === 6){
    if (ws.shelves.length === 0){
      ['Документы','Фото','Рисунки','Музыка','Мультики','Разное'].forEach(function(nm){ addShelf(nm); });
      const r = ws.shelves.find(function(s){ return s.name === 'Разное'; });
      if (r){
        r.files.push({id:'m6a' + Date.now(), name:'Рисунок солнца', type:'picture', sticker:'green', icon:'drawing'});
        r.files.push({id:'m6b' + Date.now() + '_2', name:'Колыбельная мамы', type:'audio', sticker:'red', icon:'note'});
      }
    } else {
      let r = ws.shelves.find(function(s){ return s.name.toLowerCase().indexOf('разн') >= 0; });
      if (!r && ws.shelves.length < 8){
        addShelf('Разное');
        r = ws.shelves.find(function(s){ return s.name === 'Разное'; });
        if (r){
          r.files.push({id:'m6a' + Date.now(), name:'Рисунок солнца', type:'picture', sticker:'green', icon:'drawing'});
          r.files.push({id:'m6b' + Date.now() + '_2', name:'Колыбельная мамы', type:'audio', sticker:'red', icon:'note'});
        }
      }
    }
    ws.mission6Done = false;
    renderWorkshop();
    showTeacher('<b>Учителю:</b> Миссия 6. В шкафу есть полка «Разное» с файлами. Разложите все файлы по другим полкам, чтобы «Разное» опустела, и удалите её кнопкой «🗑 Удалить полку».');
  }
}

function checkMission6(){
  if (!ws || ws.mission !== 6 || ws.mission6Done) return;
  const empty = ws.shelves.filter(function(s){ return s.files.length === 0; });
  if (empty.length === 0 && ws.shelves.length > 0){
    ws.mission6Done = true;
    ws.stars += 3;
    updateStars();
    toast('Отлично! Пустая полка удалена. ⭐⭐⭐');
    showTeacher('<b>Учителю:</b> Миссия 6 выполнена. Ребёнок разложил файлы и удалил пустую полку.');
  }
}

/* --- миссия 2: поиск --- */
function startSearchMission(){
  ws.searchList = [];
  ws.shelves.forEach(function(s){
    s.files.forEach(function(f){
      if (f.name === 'Письмо дедушке') return;
      ws.searchList.push({ file:f, shelfName:s.name });
    });
  });
  ws.searchList = shuffle(ws.searchList);
  if (ws.searchList.length === 0){ ws.searchTarget = null; return; }
  ws.searchTarget = ws.searchList[0];
  const basket = $('#ws-basket');
  basket.innerHTML = '';
  basket.appendChild(ce('div','empty-note','Слушай учителя и кликай по полке.'));
  showTeacher('<b>Учителю:</b> Назовите файл: «<b>' + esc(ws.searchTarget.file.name) + '</b>».');
  startSearchTimer();
}
function startSearchTimer(){
  stopSearchTimer();
  const t = $('#ws-timer');
  let left = 10;
  t.classList.remove('hidden'); t.classList.remove('urgent');
  t.querySelector('.tnum').textContent = left;
  missionTimer = setInterval(function(){
    left--;
    t.querySelector('.tnum').textContent = left;
    if (left <= 3) t.classList.add('urgent');
    if (left <= 0){
      stopSearchTimer();
      toast('Время вышло! Попробуй ещё раз — не страшно.', 'err');
      setTimeout(function(){ if (ws && ws.mission === 2) startSearchMission(); }, 900);
    }
  }, 1000);
}
document.addEventListener('click', function(e){
  if (!ws || ws.mission !== 2) return;
  const shelfEl = e.target.closest ? e.target.closest('.shelf') : null;
  if (!shelfEl) return;
  if (!ws.searchTarget) return;
  const sid = Number(shelfEl.getAttribute('data-shelf-id'));
  const shelf = ws.shelves.find(function(s){ return s.id === sid; });
  if (!shelf) return;
  const file = ws.searchTarget.file;
  const res = checkFileToShelf(file, shelf.name);
  if (res.ok){
    stopSearchTimer();
    toast('Нашёл! Молодец! ⭐');
    ws.stars++; updateStars();
    ws.searchList.shift();
    if (ws.searchList.length === 0){
      ws.searchTarget = null;
      showTeacher('<b>Учителю:</b> Все файлы найдены! Можно переходить к следующей миссии.');
      return;
    }
    ws.searchTarget = ws.searchList[0];
    showTeacher('<b>Учителю:</b> Назовите файл: «<b>' + esc(ws.searchTarget.file.name) + '</b>».');
    startSearchTimer();
  } else {
    toast('Не сюда. Подумай, где бы ты искал этот файл.', 'err');
  }
});

/* ====================== МИССИЯ 5 ====================== */
let m5State = null;

function openM5(){
  m5State = { step:0, folderName:'', folderEl:null, menuEl:null };
  $('#m5-overlay').classList.add('show');
  renderM5Desk();
  updateM5Hint('Нажми «Правая кнопка» на пустом месте стола.');
}
function renderM5Desk(){
  const wrap = $('#m5-desk-wrap');
  wrap.innerHTML = '';
  const desk = ce('div','desk');
  const icons = ce('div','desk-icons');
  desk.appendChild(icons);
  icons.appendChild(makeDeskFolder('Рисунки', true));
  wrap.appendChild(desk);
  desk.addEventListener('click', function(e){
    if (e.target.closest && e.target.closest('.desk-menu')) return;
    if (m5State && m5State.step === 4) m5Finish();
  });
}
function updateM5Hint(text){ $('#m5-hint').textContent = text; }

$('#m5-pkm').addEventListener('click', function(){
  if (!m5State) return;
  if (m5State.step > 0){ toast('Уже открыто.', 'err'); return; }
  m5State.step = 1;
  const desk = $('#m5-desk-wrap .desk');
  const menu = ce('div','desk-menu');
  ['Создать','Обновить','Свойства'].forEach(function(mi){
    menu.appendChild(ce('div','mi',mi));
  });
  menu.style.left = '30%'; menu.style.top = '30%';
  menu.style.pointerEvents = 'auto';
  desk.appendChild(menu);
  m5State.menuEl = menu;
  Array.from(menu.children).forEach(function(it, idx){
    it.addEventListener('click', function(e){
      e.stopPropagation();
      if (idx === 0) openM5CreateSubmenu();
    });
  });
  updateM5Hint('Теперь выбери «Создать».');
});

function openM5CreateSubmenu(){
  if (!m5State || m5State.step !== 1) return;
  m5State.step = 2;
  if (m5State.menuEl) m5State.menuEl.remove();
  const desk = $('#m5-desk-wrap .desk');
  const menu = ce('div','desk-menu');
  menu.style.pointerEvents = 'auto';
  ['Папка','Документ'].forEach(function(mi){
    menu.appendChild(ce('div','mi',mi));
  });
  menu.style.left = '38%'; menu.style.top = '36%';
  desk.appendChild(menu);
  m5State.menuEl = menu;
  Array.from(menu.children).forEach(function(it, idx){
    it.addEventListener('click', function(e){
      e.stopPropagation();
      if (idx === 0) openM5NewFolder();
    });
  });
  updateM5Hint('Выбери «Папка».');
}

function openM5NewFolder(){
  if (!m5State || m5State.step !== 2) return;
  m5State.step = 3;
  if (m5State.menuEl) m5State.menuEl.remove();
  const icons = $('#m5-desk-wrap .desk-icons');
  const f = ce('div','desk-folder new');
  f.innerHTML = '<svg viewBox="0 0 40 40"><path d="M4 10 L16 10 L19 14 L36 14 L36 32 L4 32 Z" fill="#ffd166" stroke="#8a5a00" stroke-width="2" stroke-linejoin="round"/><path d="M4 10 L16 10 L19 14 L4 14 Z" fill="#ffb700" stroke="#8a5a00" stroke-width="2"/></svg><input class="desk-input" maxlength="14" placeholder="имя…" value="">';
  icons.appendChild(f);
  m5State.folderEl = f;
  const inp = f.querySelector('input');
  inp.addEventListener('click', function(e){ e.stopPropagation(); });
  inp.addEventListener('keydown', function(e){
    if (e.key === 'Enter') m5ConfirmName(inp.value.trim());
  });
  setTimeout(function(){ inp.focus(); }, 50);
  updateM5Hint('Введи имя папки и нажми Enter. Попробуй «Рисунки».');
}

function m5ConfirmName(name){
  if (!name){ toast('Введи имя.', 'err'); return; }
  if (name.toLowerCase() === 'рисунки'){
    showModal({
      shape:'?',
      title:'Такое имя уже есть?',
      text:'На столе уже есть папка «Рисунки». Что делать?',
      buttons:[
        {label:'Да, другое имя', cls:'green', action: function(){
          toast('Придумай другое имя!', 'err');
          if (m5State && m5State.folderEl){
            const inp = m5State.folderEl.querySelector('input');
            if (inp){ inp.value = ''; inp.focus(); }
          }
        }},
        {label:'Нет, создать', cls:'gray', action: function(){ m5Finalize(name); }}
      ]
    });
  } else {
    m5Finalize(name);
  }
}

function m5Finalize(name){
  if (!m5State || !m5State.folderEl) return;
  const inp = m5State.folderEl.querySelector('input');
  const fnameEl = ce('div', 'fname', esc(name));
  if (inp) inp.replaceWith(fnameEl);
  else m5State.folderEl.appendChild(fnameEl);
  m5State.folderEl.classList.remove('new');
  m5State.folderName = name;
  m5State.step = 4;
  updateM5Hint('Папка «' + name + '» создана. Щёлкни мимо, чтобы закончить.');
}

function m5Finish(){
  if (!m5State) return;
  if (!m5State.folderName){ toast('Сначала создай папку.', 'err'); return; }
  toast('Готово! Папка создана на рабочем столе.');
  if (ws){ ws.stars++; updateStars(); }
  m5State.step = 5;
}

$('#m5-aside').addEventListener('click', function(){
  if (!m5State) return;
  if (m5State.step === 3){ toast('Сначала введи имя папки или нажми Enter.', 'err'); return; }
  if (m5State.folderName) m5Finish();
  else toast('Сначала создай папку.', 'err');
});
$('#m5-close').addEventListener('click', function(){ $('#m5-overlay').classList.remove('show'); });

/* Перерисовка при изменении окна */
window.addEventListener('resize', function(){
  const d1 = $('#m2-slots .drakon');
  if (d1) redrawDrakon(d1);
  const d2 = $('#run-schema .drakon');
  if (d2) redrawDrakon(d2);
  const d3 = $('#schema2-holder .drakon');
  if (d3) redrawDrakon(d3);
});

/* ====================== СТАРТ ====================== */
showScreen('scr-menu');

})();
</script>
