<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ресторан: собираем ТТК салата</title>
<style>
:root{
  --cream:#FBF3E4; --paper:#FFFCF5; --ink:#2B1F16; --ink2:#5C4A3A;
  --brick:#A9442A; --carrot:#E07A2E; --carrot-l:#FBE3CC;
  --green:#2E6040; --green-l:#DDEFD9; --yel:#E5A823; --yel-l:#FCEFC7;
  --red:#B8322A; --red-l:#F8D9D4; --line:#E2CFAE; --grey:#E7DFD2;
}
*{box-sizing:border-box}
html{font-size:19px}
body{margin:0;background:var(--cream);color:var(--ink);font-family:"Segoe UI","PT Sans",Roboto,"Helvetica Neue",Arial,sans-serif;line-height:1.45}
h1,h2,h3{font-family:Georgia,"PT Serif","Times New Roman",serif;color:var(--brick);margin:.2em 0 .45em;line-height:1.2}
h1{font-size:36px} h2{font-size:28px} h3{font-size:22px}
p{margin:.4em 0 .7em}
.top{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:4px double var(--line);padding:10px 20px 12px;box-shadow:0 2px 10px rgba(80,50,20,.08)}
.toprow{display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.brand{font-family:Georgia,"PT Serif",serif;font-size:24px;font-weight:700;color:var(--brick)}
.leader{font-family:inherit;font-size:18px;color:var(--ink2);font-weight:600;margin-left:12px}
.timers{display:flex;gap:10px;flex-wrap:wrap}
.tm{border-radius:12px;padding:5px 14px;font-variant-numeric:tabular-nums;font-weight:800;font-size:24px;border:2px solid;display:flex;gap:10px;align-items:center}
.tm small{font-size:14px;font-weight:700;opacity:.85}
.tm.ok{background:var(--green-l);border-color:var(--green);color:var(--green)}
.tm.warn{background:var(--yel-l);border-color:var(--yel);color:#6e4d00}
.tm.over{background:var(--red-l);border-color:var(--red);color:var(--red)}
.progress{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:10px 0 8px}
.seg{height:40px;border-radius:8px;background:var(--grey);color:#857a6b;font:700 16px/1 inherit;font-family:inherit;display:flex;align-items:center;justify-content:center;border:none;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:default}
.seg.done{background:var(--green);color:#fff;cursor:pointer}
.seg.cur{background:var(--carrot);color:#fff;cursor:pointer;animation:blink 1.6s ease-in-out infinite}
.seg.view{outline:3px solid var(--brick);outline-offset:2px}
@keyframes blink{50%{opacity:.5}}
@media (prefers-reduced-motion:reduce){.seg.cur{animation:none}}
.beacon{display:flex;align-items:center;gap:12px;background:var(--carrot-l);border-left:8px solid var(--carrot);padding:8px 14px;border-radius:8px;font-size:19px}
.beacon b{color:var(--brick)}
.beacon button{margin-left:auto;padding:6px 14px;font-size:17px}
.alarm{margin-top:8px;background:var(--red);color:#fff;padding:12px 16px;border-radius:10px;font-size:21px;font-weight:800;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.alarm button{border-color:#fff;background:#fff;color:var(--red);font-size:17px}
.alarm button.ghost{background:transparent;color:#fff}
.hidden{display:none!important}
main{max-width:1180px;margin:0 auto;padding:20px 20px 30px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:22px 26px;margin-bottom:18px;box-shadow:0 2px 0 var(--line)}
.card.accent{border-left:8px solid var(--carrot)}
.lead{font-size:21px}
.muted{color:var(--ink2)}
.small{font-size:16px}
label.f{display:block;font-weight:700;margin:14px 0 6px}
input[type=text],input[type=number],select,textarea{font:inherit;font-size:19px;padding:9px 12px;border:2px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);width:100%}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:3px solid var(--carrot);outline-offset:1px;border-color:var(--carrot)}
.req.empty{border-color:var(--carrot);background:#FFF6EA}
button{font:inherit;font-size:19px;font-weight:700;border-radius:12px;padding:10px 18px;border:2px solid var(--brick);background:var(--paper);color:var(--brick);cursor:pointer}
button:hover:not(:disabled){filter:brightness(.96)}
.btn-main{background:var(--brick);color:#fff}
.btn-green{background:var(--green);border-color:var(--green);color:#fff}
.btn-sm{font-size:16px;padding:6px 12px;border-radius:9px}
button:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media (max-width:820px){.grid2{grid-template-columns:1fr}}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.tile{text-align:left;border:2px solid var(--line);background:#fff;color:var(--ink);font-weight:600;padding:12px 14px;border-radius:12px;font-size:19px}
.tile.sel{border-color:var(--green);background:var(--green-l);box-shadow:inset 0 0 0 2px var(--green)}
.tile.sel::before{content:"✓ ";color:var(--green);font-weight:900}
.learn{margin-top:10px;padding:10px 14px;background:var(--cream);border-radius:10px;border-left:5px solid var(--carrot)}
.flags{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.flag{display:flex;gap:10px;align-items:center;border:2px solid var(--line);border-radius:12px;padding:10px 14px;background:#fff;font-weight:700;cursor:pointer}
.flag input{width:26px;height:26px;accent-color:var(--green)}
.flag.on{border-color:var(--green);background:var(--green-l)}
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;font-weight:800;font-size:16px;white-space:nowrap}
.b-ok{background:var(--green);color:#fff}
.b-q{background:var(--yel);color:#3b2a00}
.b-no{background:var(--red);color:#fff}
table.t{width:100%;border-collapse:collapse;font-size:18px}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:middle}
table.t th{background:var(--cream);font-size:15px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink2)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.big{font-size:24px;font-weight:800}
.note{padding:12px 16px;border-radius:10px;margin:10px 0}
.note.info{background:var(--carrot-l)}
.note.good{background:var(--green-l);color:#173b24}
.note.warn{background:var(--yel-l);color:#4d3600}
.note.bad{background:var(--red-l);color:#7d1e17}
.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}
.rules div{background:var(--paper);border:2px dashed var(--brick);border-radius:10px;padding:10px;font-weight:700;text-align:center}
@media (max-width:820px){.rules{grid-template-columns:1fr}}
.q{margin:14px 0}
.q b{display:block;margin-bottom:6px}
.qrow{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0;background:#fff}
.qrow code{font-family:inherit;font-weight:700;background:var(--cream);padding:2px 8px;border-radius:6px}
.qtimer{font-weight:800;font-variant-numeric:tabular-nums}
.step{display:grid;grid-template-columns:34px 1fr 230px 46px;gap:8px;align-items:center;margin:8px 0}
.step .n{font-weight:800;color:var(--brick);font-size:21px;text-align:center}
.step .other{grid-column:2/4}
@media (max-width:820px){.step{grid-template-columns:30px 1fr 46px}.step select{grid-column:2/3}}
.inv{display:grid;grid-template-columns:1.4fr 1fr;gap:20px}
@media (max-width:900px){.inv{grid-template-columns:1fr}}
.invrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 12px;border-radius:12px;margin:8px 0;border:2px solid var(--line);background:#fff}
.invrow.ok{border-color:var(--green)} .invrow.q{border-color:var(--yel);background:#FFFBEE} .invrow.no{border-color:var(--red);background:#FFF4F2}
.invrow .sub{grid-column:1/3;font-size:17px}
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-top:12px}
.slot{border:2px solid var(--line);border-radius:12px;background:#fff;padding:10px 8px;text-align:center;min-height:118px;display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:center;font-size:17px}
.slot .sn{font-size:26px;font-weight:900;color:var(--ink)}
.slot.free{cursor:pointer}
.slot.free:hover{border-color:var(--carrot)}
.slot.mine{background:var(--green-l);border-color:var(--green)}
.slot.busy{background:#EFE9E0;color:#8d8170;border-style:dashed}
.picktabs{display:flex;gap:8px;flex-wrap:wrap}
.picktabs .tile{flex:1;min-width:180px}
.nav{position:sticky;bottom:0;background:var(--paper);border-top:4px double var(--line);padding:12px 20px;display:flex;gap:14px;align-items:center;z-index:15}
.nav .msg{flex:1;font-size:17px}
.nav .msg.miss{color:var(--brick)}
.nav .msg.ok{color:var(--green);font-weight:700}
.modal{position:fixed;inset:0;background:rgba(43,31,22,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal .box{background:var(--paper);border-radius:18px;padding:28px 32px;max-width:640px;width:100%;border-top:10px solid var(--carrot);box-shadow:0 10px 40px rgba(0,0,0,.3)}
.picker .box{max-width:820px}
.pickgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px}
.pickgrid button{padding:22px 10px;font-size:22px}
.pickgrid small{display:block;font-size:15px;font-weight:600;margin-top:6px;color:var(--ink2)}
.preview{background:#fff;border:1px solid var(--line);border-radius:6px;padding:18px;box-shadow:0 4px 16px rgba(80,50,20,.12);overflow:auto}
.orn{color:var(--carrot);letter-spacing:.3em;text-align:center;margin:4px 0 0;font-size:18px}

/* ===== ПЕЧАТНЫЙ ЛИСТ ===== */
.ps{font-family:Georgia,"PT Serif","Times New Roman",serif;color:#1d1510;font-size:10.5pt;line-height:1.32;width:100%;max-width:190mm;margin:0 auto}
.ps .hd{border-top:3px double #1d1510;border-bottom:3px double #1d1510;padding:5px 0 6px;text-align:center;margin-bottom:8px}
.ps .hd .r1{font-size:9pt;letter-spacing:.25em;text-transform:uppercase}
.ps .hd .r2{font-size:18pt;font-weight:700;letter-spacing:.04em}
.ps .hd .r3{font-size:12pt;font-style:italic}
.ps .meta{display:flex;justify-content:space-between;font-size:9pt;margin-bottom:6px;gap:8px}
.ps .cols{display:grid;grid-template-columns:60% 40%;gap:0}
.ps .cl{padding-right:4mm;border-right:1px solid #1d1510}
.ps .cr{padding-left:4mm}
.ps h4{font-size:10pt;text-transform:uppercase;letter-spacing:.12em;margin:8px 0 3px;border-bottom:1.5px solid #1d1510;padding-bottom:1px;color:#1d1510;font-family:inherit}
.ps table{width:100%;border-collapse:collapse;font-size:9.5pt;table-layout:fixed;word-wrap:break-word}
.ps th,.ps td{border:1px solid #1d1510;padding:2.5px 4px;text-align:left;vertical-align:top}
.ps th{background:#efe7d8;font-size:8.5pt;text-transform:uppercase;letter-spacing:.05em}
.ps .cr th{letter-spacing:0;font-size:7.5pt}
.ps .bru{font-size:13pt;font-weight:700;text-align:right}
.ps .net{font-size:9pt;font-style:italic;text-align:right}
.ps ol{margin:2px 0 2px 0;padding-left:0;list-style:none;counter-reset:s}
.ps ol li{counter-increment:s;margin:2px 0}
.ps ol li::before{content:"☐ " counter(s) ". ";font-weight:700}
.ps .line{margin:3px 0}
.ps .fine{font-size:8.5pt}
.ps .star{font-weight:700}
.ps .memo{border:2px solid #1d1510;padding:5px 7px;margin-top:8px;background:#f6efe2}
.ps .memo b{display:block;text-transform:uppercase;letter-spacing:.1em;font-size:9pt;margin-bottom:2px}
.ps .sign{margin-top:10px;font-size:9.5pt}
.ps .sign{white-space:nowrap}
.ps .sign span{display:inline-block;border-bottom:1px solid #1d1510;min-width:36mm;height:12pt;vertical-align:bottom}
.ps .draft{border:2px dashed #1d1510;text-align:center;font-weight:700;letter-spacing:.3em;margin-bottom:6px;font-size:10pt}
.ps .box{display:inline-block;width:10pt;height:10pt;border:1px solid #1d1510}
#printSheet{display:none}
@media print{
  @page{size:A4 portrait;margin:10mm}
  html,body{background:#fff;font-size:12pt}
  body>*:not(#printSheet){display:none!important}
  #printSheet{display:block}
  .ps{max-width:none}
  .ps th{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .ps .memo{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="toprow">
      <div class="brand">🍽 <span id="hdrName">Ресторан</span><span class="leader" id="hdrLeader"></span></div>
      <div class="timers">
        <div class="tm ok" id="tmScreen"><small>ЭКРАН</small><span>--:--</span></div>
        <div class="tm ok" id="tmTotal"><small>УРОК</small><span>40:00</span></div>
      </div>
    </div>
    <div class="progress" id="progress"></div>
    <div class="beacon" id="beacon"></div>
    <div class="alarm hidden" id="alarm"></div>
  </header>
  <main id="screen"></main>
  <footer class="nav" id="nav"></footer>
</div>
<div id="modal" class="modal hidden"><div class="box" id="modalBox"></div></div>
<div id="printSheet"></div>

<script>
"use strict";
/* ================== КОНСТАНТЫ (не менять) ================== */
const REF = {carrotB:76, carrotN:61, appleB:43, appleN:30, oil:10, temp:14, life:'не более 1 часа'};
const K = {apple:0.70, carrot:0.80};
const STOCK_DEF = {apple:250, carrot:200};
const STOCK_CLASS = {apple:1000, carrot:800};
const KITCHEN = ['Тёрка крупная','Тёрка мелкая','Весы электронные','Салатник','Тарелка','Нож средний','Разделочная доска','Овощечистка'];
const TOOL_OPTS = KITCHEN.concat(['Стаканчики']);
const PLAN = [3,5,7,6,4,3,2];
const TOTAL = 40;
const TITLES = ['1 · Вход','2 · Рычаги','3 · Склад','4 · Сборка ТТК','5 · Инвентарь','6 · Весы','7 · Финал'];
const TASKS = [
  'назвать ресторан, отметить базу кухни, ответить на 3 вопроса',
  'выбрать 4 рычага — это профиль вашего ресторана',
  'найти цифры, внести их с источником и пересчитать склад',
  'заполнить все разделы ТТК — пустых ячеек быть не должно',
  'проверить, есть ли на кухне каждый инструмент из ТТК',
  'занять свои слоты у весов',
  'проверить соседей и распечатать ТТК'
];
const LEVERS = {
  cut:{label:'Нарезка', opts:[
    ['coarse','Крупная тёрка','Крупная стружка хрустит и держит форму. Сока выделяется меньше.'],
    ['fine','Мелкая тёрка','Нежно, почти как пюре. Сок появляется быстро — подавайте сразу.'],
    ['julienne','Соломка ножом','Красиво, по-ресторанному, но дольше. Понадобятся доска и аккуратность.']]},
  ratio:{label:'Пропорция (морковь : яблоки)', opts:[
    ['2:1','2 : 1 (как ТТК №9)','Как в эталоне: моркови вдвое больше, чем яблок.'],
    ['1:1','1 : 1','Поровну: вкус мягче и слаще.'],
    ['1:2','1 : 2 (яблочная)','Яблок вдвое больше — салат сочный, кисло-сладкий.'],
    ['carrot','Только морковь','Яркий цвет и хруст. Яблоки останутся соседям.'],
    ['apple','Только яблоки','Яблоки темнеют на воздухе — готовьте прямо перед подачей.']]},
  texture:{label:'Текстура', opts:[
    ['peel','С кожурой яблок','Кожура даёт цвет и хруст, но её надо очень хорошо вымыть.'],
    ['nopeel','Без кожуры','Нежнее на вкус. Кожуру снимаете средним ножом.'],
    ['mixed','Смешанно','Часть яблок с кожурой, часть без — пёстрый вид.']]},
  serve:{label:'Подача', opts:[
    ['hill','Горка','Классика, как в ТТК №9.'],
    ['layers','Слои','Морковь и яблоко лежат слоями — красиво в разрезе.'],
    ['cups','Порционно в стаканчиках','Каждому свой стаканчик. Но стаканчики ещё надо найти на кухне.']]}
};
const LEVER_KEYS = ['cut','ratio','texture','serve'];
const WASH_C = {flow:'Проточная вода + замачивание 10 мин', scald:'Ошпаривание'};
const PEEL_C = {peeler:'Овощечисткой', knife:'Средним ножом'};
const WASH_A = {flow:'Под проточной водой'};
const PEEL_A = {none:'Без очистки', knife:'Средним ножом'};
const TOOL_WHY = {'Весы электронные':'взвесить брутто и нетто','Овощечистка':'очистить морковь','Нож средний':'чистка, семенное гнездо',
  'Разделочная доска':'резать безопасно','Тёрка крупная':'натереть овощи','Тёрка мелкая':'натереть овощи','Салатник':'смешать салат',
  'Тарелка':'подача','Стаканчики':'порционная подача'};
const SUGG = {'Стаканчики':'Тарелка','Овощечистка':'Нож средний'};
const QUERIES = ['ттк салат морковь яблоко','салат из моркови и яблоки рецепт пропорции на 100 г','потери при очистке моркови таблица'];
const SLOT_MIN = n => 5 + (n-1)*3;
const MOMENTS = [{k:'a',l:'Яблоки брутто'},{k:'c',l:'Морковь брутто'},{k:'n',l:'Контроль нетто'}];

/* ================== СОСТОЯНИЕ ================== */
const KEY = g => 'ttk-restoran-v1-g' + g;
const ACTIVE = 'ttk-restoran-v1-active';
function emptyStep(){ return {t:'', tool:'', toolOther:''}; }
function fresh(g){
  return {v:1, group:g, startAt:Date.now(), screen:0, maxScreen:0, screenStart:{0:Date.now()},
    name:'', members:['','',''], leader:0,
    base:{salt:false,sugar:false,oil:false,lemon:false,peeler:false},
    diag:{}, levers:{}, stock:{apple:'250', carrot:'200'},
    qt:{}, fd:{val:'',what:'',src:'',site:'',basis:''}, finds:[], ratioNote:'',
    ttk:{title:'', carrotWash:'', carrotWashOther:'', carrotWashConfirm:false, carrotPeel:'',
      appleWash:'', appleWashOther:'', applePeel:'', appleCore:false, dressing:'', sugarG:'',
      prep:[emptyStep(),emptyStep(),emptyStep()], asm:[emptyStep(),emptyStep()], portion:'', time:''},
    stars:{}, inv:{replace:{}, reserve:false, checked:false},
    slots:{a:null,c:null,n:null}, slotPick:'a', busy:{},
    audit:{r1:{name:'',cut:'',ratio:'',texture:'',serve:''}, r2:{name:'',cut:'',ratio:'',texture:'',serve:''}},
    checkinScreen:1+Math.floor(Math.random()*5), checkinDone:false, alarmHidden:false};
}
let S = null;
function save(){ try{ localStorage.setItem(KEY(S.group), JSON.stringify(S)); }catch(e){} }
function readGroup(g){ try{ const r = localStorage.getItem(KEY(g)); return r ? JSON.parse(r) : null; }catch(e){ return null; } }
function load(g){
  const o = readGroup(g); const f = fresh(g);
  if(!o) return f;
  const m = Object.assign(f, o);
  m.ttk = Object.assign(fresh(g).ttk, o.ttk||{});
  return m;
}

/* ================== УТИЛИТЫ ================== */
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num = v => { const n = parseFloat(String(v).replace(',','.')); return isFinite(n) ? n : 0; };
const filled = v => v!=null && String(v).trim()!=='';
function getP(p){ return p.split('.').reduce((o,k)=> o==null?undefined:o[k], S); }
function setP(p,v){ const ks=p.split('.'); let o=S; for(let i=0;i<ks.length-1;i++) o=o[ks[i]]; o[ks[ks.length-1]]=v; }
function fmt(sec){ const neg=sec<0; sec=Math.abs(Math.round(sec)); const m=Math.floor(sec/60), s=sec%60; return (neg?'+':'')+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'); }
function opts(map, cur, ph){ let h = `<option value="">${ph||'— выберите —'}</option>`; for(const [k,l] of Object.entries(map)) h += `<option value="${esc(k)}"${cur===k?' selected':''}>${esc(l)}</option>`; return h; }
function leverLabel(k,v){ const o = (LEVERS[k].opts.find(x=>x[0]===v)||[])[1]; return o||'—'; }
function crew(){ return S.members.filter(filled); }
function need(){ const r=S.levers.ratio; return {c: r!=='apple', a: r!=='carrot'}; }
function score(){ let s=0; if(S.diag.q1==='doc')s++; if(S.diag.q2==='bn')s++; if(S.diag.q3==='repeat')s++; return s; }
function moreHints(){ return score() < 2; }
function dressAvail(){ return {oil:S.base.oil, sugar:S.base.sugar}; }
function noDressing(){ return !S.base.oil && !S.base.sugar; }
function star(k){ return S.stars[k] ? '<span class="star">*</span>' : ''; }

/* ================== РАСЧЁТЫ ================== */
function calc(){
  const sa = num(S.stock.apple), sc = num(S.stock.carrot);
  const aMax = sa*K.apple, cMax = sc*K.carrot;
  let c=0, a=0; const r = S.levers.ratio;
  if(r==='2:1'){ c=Math.min(cMax, aMax*2); a=c/2; }
  else if(r==='1:1'){ c=a=Math.min(cMax,aMax); }
  else if(r==='1:2'){ a=Math.min(aMax, cMax*2); c=a/2; }
  else if(r==='carrot'){ c=cMax; }
  else if(r==='apple'){ a=aMax; }
  const cB=Math.min(sc,Math.round(c/K.carrot)), aB=Math.min(sa,Math.round(a/K.apple));
  const cN=Math.round(cB*K.carrot), aN=Math.round(aB*K.apple);
  const net=cN+aN;
  const oil = S.ttk.dressing==='oil' ? Math.round(net*REF.oil/(REF.carrotN+REF.appleN)) : 0;
  const sugar = S.ttk.dressing==='sugar' ? Math.round(num(S.ttk.sugarG)) : 0;
  return {sa,sc,aMax:Math.round(aMax),cMax:Math.round(cMax),cB,aB,cN,aN,net,oil,sugar,out:net+oil+sugar,
    leftA:sa-aB, leftC:sc-cB, addA:Math.max(0,sa-STOCK_DEF.apple), addC:Math.max(0,sc-STOCK_DEF.carrot)};
}
function stepTool(s){ return s.tool==='other' ? (s.toolOther||'').trim() : (s.tool==='none' ? '' : s.tool); }
function toolsUsed(){
  const m = new Map(); const add=(n,why)=>{ if(n && !m.has(n)) m.set(n,why); };
  const t=S.ttk, nd=need();
  add('Весы электронные', TOOL_WHY['Весы электронные']);
  if(nd.c && t.carrotPeel==='peeler') add('Овощечистка','очистить морковь');
  if((nd.c && t.carrotPeel==='knife') || (nd.a && (t.applePeel==='knife' || t.appleCore))) { add('Нож средний','чистка, семенное гнездо'); add('Разделочная доска','резать безопасно'); }
  t.prep.concat(t.asm).forEach(s=>{ const n=stepTool(s); if(n) add(n, TOOL_WHY[n] || ('шаг: ' + (s.t||'').slice(0,40))); });
  return [...m].map(([name,why])=>({name,why}));
}
function invStatus(n){ if(n==='Овощечистка') return S.base.peeler ? 'ok' : 'q'; return KITCHEN.includes(n) ? 'ok' : 'no'; }
function invRows(){ return toolsUsed().map(r=>({...r, st:invStatus(r.name), rep:S.inv.replace[r.name]||''})); }
function broken(){ return invRows().some(r => (r.st==='no' && !r.rep) || (r.st==='q' && !S.inv.reserve)); }
function othersBusy(){
  const m={};
  [1,2,3].forEach(g=>{ if(g===S.group) return; const o=readGroup(g); if(!o||!o.slots) return;
    Object.values(o.slots).forEach(n=>{ if(n) m[n]='«'+(o.name||('Ресторан '+g))+'»'; }); });
  Object.keys(S.busy).forEach(n=>{ if(S.busy[n] && !m[n]) m[n]='другой ресторан'; });
  return m;
}
function diffWith(o){ return LEVER_KEYS.filter(k=> o[k] && S.levers[k] && o[k]!==S.levers[k]).length; }
function auditFull(o){ return LEVER_KEYS.every(k=>o[k]); }

/* ================== ПРОВЕРКА ЗАПОЛНЕНИЯ ================== */
function missing(i){
  const m=[]; const t=S.ttk, nd=need();
  if(i===0){
    if(!filled(S.name)) m.push('название ресторана');
    if(crew().length<2) m.push('имена поваров (минимум двое)');
    ['q1','q2','q3'].forEach((q,k)=>{ if(!S.diag[q]) m.push('вопрос '+(k+1)); });
  }
  if(i===1){ LEVER_KEYS.forEach(k=>{ if(!S.levers[k]) m.push(LEVERS[k].label.toLowerCase().split(' (')[0]); }); }
  if(i===2){
    if(num(S.stock.apple)<0 || num(S.stock.carrot)<0) m.push('склад');
    if(S.finds.length<1) m.push('хотя бы одна найденная цифра');
    if(S.levers.ratio!=='2:1' && !filled(S.ratioNote)) m.push('фраза об отличии от эталона');
  }
  if(i===3){
    if(!filled(t.title)) m.push('название салата');
    if(nd.c){
      if(!t.carrotWash) m.push('мытьё моркови');
      if(t.carrotWash==='other' && !filled(t.carrotWashOther)) m.push('свой способ мытья моркови');
      if(t.carrotWash==='other' && salineC() && !t.carrotWashConfirm) m.push('подтверждение способа мытья моркови');
      if(!t.carrotPeel) m.push('очистка моркови');
    }
    if(nd.a){
      if(!t.appleWash) m.push('мытьё яблок');
      if(t.appleWash==='other' && !filled(t.appleWashOther)) m.push('свой способ мытья яблок');
      if(!t.applePeel) m.push('очистка яблок');
      if(!t.appleCore) m.push('семенное гнездо');
    }
    if(!noDressing() && !t.dressing) m.push('заправка');
    if(t.dressing==='sugar' && num(t.sugarG)<=0) m.push('сколько сахара');
    [['prep','Подготовка'],['asm','Сборка']].forEach(([k,l])=>{
      if(!t[k].length) m.push(l+': хотя бы один шаг');
      t[k].forEach((s,j)=>{ if(!filled(s.t)) m.push(l+', шаг '+(j+1)); if(!s.tool || (s.tool==='other'&&!filled(s.toolOther))) m.push(l+', инструмент шага '+(j+1)); });
    });
    if(num(t.portion)<=0) m.push('выход порции');
    if(num(t.time)<=0) m.push('время приготовления');
  }
  if(i===4){ if(!S.inv.checked) m.push('нажмите «Проверить карту»'); else if(broken()) m.push('карта битая — нужна замена или резерв'); }
  if(i===5){
    const nd2=need();
    MOMENTS.forEach(mo=>{ if((mo.k==='a'&&!nd2.a)||(mo.k==='c'&&!nd2.c)) return; if(!S.slots[mo.k]) m.push('слот: '+mo.l.toLowerCase()); });
    const b=Math.max(nd2.a?S.slots.a||0:0, nd2.c?S.slots.c||0:0);
    if(S.slots.n && b && S.slots.n<=b) m.push('контроль нетто должен быть позже брутто');
  }
  return m;
}
function salineC(){ return /солев|соль|2\s*%/i.test(S.ttk.carrotWashOther||''); }

function calcBox(){
  const c=calc(), r=S.levers.ratio, nd=need();
  let h=`<table class="t"><tr><th>Продукт</th><th class="num">На складе, брутто</th><th class="num">Коэф.</th><th class="num">Можно получить нетто</th><th class="num">В салат: брутто / нетто</th></tr>`;
  h+=`<tr><td>🥕 Морковь</td><td class="num">${c.sc} г</td><td class="num">0,80</td><td class="num">${c.cMax} г</td><td class="num"><span class="big">${nd.c?c.cB:0} г</span> / <i>${nd.c?c.cN:0} г</i></td></tr>`;
  h+=`<tr><td>🍎 Яблоки</td><td class="num">${c.sa} г</td><td class="num">0,70</td><td class="num">${c.aMax} г</td><td class="num"><span class="big">${nd.a?c.aB:0} г</span> / <i>${nd.a?c.aN:0} г</i></td></tr></table>`;
  h+=`<p class="lead" style="margin-top:12px">Выход салата без заправки: <b>${c.net} г</b>${c.net>0?` — это примерно ${Math.floor(c.net/100)} порц. по 100 г`:''}.</p>`;
  if(c.leftA>0||c.leftC>0) h+=`<p class="muted">Останется на складе: ${c.leftC>0?`морковь ${c.leftC} г `:''}${c.leftA>0?`яблоки ${c.leftA} г`:''} брутто — можно поделиться с соседями.</p>`;
  h+=`<p>Эталон №9 на 100 г: морковь ${REF.carrotN} г : яблоки ${REF.appleN} г нетто ≈ <b>2 : 1</b>. Ваша пропорция: <b>${leverLabel('ratio',r)}</b>.</p>`;
  h+= r==='2:1' ? '<div class="note good">Пропорция как у эталона. Отличаться будете нарезкой, текстурой и подачей.</div>'
                : '<div class="note warn">Ваша пропорция отличается от эталона — объясните одной фразой ниже. Фраза попадёт в ТТК как «особенность рецепта».</div>';
  return h;
}

function invResult(){
  if(!S.inv.checked) return '<span class="muted">Нажмите, когда разберётесь с красными и жёлтыми значками.</span>';
  return broken() ? '<div class="note bad" style="margin:0"><b>Карта битая.</b> Есть красный или жёлтый значок без замены. Печать заблокирована.</div>'
                  : '<div class="note good" style="margin:0"><b>Карта в порядке!</b> Весь инвентарь есть или заменён.</div>';
}

function sc5(){
  const busy=othersBusy(), nd=need();
  const moms=MOMENTS.filter(m=>!((m.k==='a'&&!nd.a)||(m.k==='c'&&!nd.c)));
  if(!moms.find(m=>m.k===S.slotPick)) S.slotPick=moms[0].k;
  const mineOf=n=> moms.find(m=>S.slots[m.k]===n);
  let cells='';
  for(let n=1;n<=9;n++){
    const mine=mineOf(n), b=busy[n];
    const cls = mine?'mine': b?'busy':'free';
    cells+=`<div class="slot ${cls}" ${!b||mine?`data-act="slot" data-n="${n}"`:''}>
      <span class="sn">№${n}</span><span>в ${SLOT_MIN(n)} мин</span>
      ${mine?`<b style="color:var(--green)">✓ ${mine.l}</b>`: b?`<span>занят: ${esc(b)}</span>`:'<span class="muted">свободен</span>'}
      ${!mine?`<button class="btn-sm" data-act="busy" data-n="${n}" style="font-size:13px;padding:2px 8px">${S.busy[n]?'освободить':'занят соседом'}</button>`:''}
    </div>`;
  }
  return `
  <div class="card accent"><h1>Очередь к весам</h1>
    <p class="lead">Весы одни на три ресторана. Каждому нужно 3 взвешивания: яблоки брутто, морковь брутто и контроль нетто. 3 × 3 = 9 слотов.</p>
    <div class="note info"><b>Правило кухни:</b> пока ждёте своей очереди — мойте и чистите. У весов не толпимся!</div></div>
  <div class="card"><h2>Что сейчас записываем?</h2>
    <div class="picktabs">${moms.map(m=>`<button class="tile${S.slotPick===m.k?' sel':''}" data-act="pick" data-k="${m.k}">${m.l}${S.slots[m.k]?` — №${S.slots[m.k]}`:''}</button>`).join('')}</div>
    <p class="muted small">Выберите взвешивание, потом нажмите на свободный слот. Контроль нетто — после брутто. Занятые соседями слоты отметьте кнопкой «занят соседом» (если соседи работают за другим компьютером).</p>
    <div class="slots">${cells}</div></div>`;
}

function auditRes(){
  return ['r1','r2'].map((r,i)=>{ const o=S.audit[r]; const nm=o.name||('Сосед '+(i+1));
    if(!auditFull(o)) return `<div class="note info">«${esc(nm)}»: заполните все 4 рычага.</div>`;
    const d=diffWith(o); const same=LEVER_KEYS.filter(k=>o[k]===S.levers[k]).map(k=>LEVERS[k].label.split(' (')[0].toLowerCase());
    return d>=3 ? `<div class="note good">«${esc(nm)}»: отличаемся по ${d} рычагам из 4. Отлично!</div>`
                : `<div class="note bad"><b>Слишком похожи на соседей!</b> С «${esc(nm)}» отличаемся только по ${d} из 4. Совпадает: ${same.join(', ')}. Поменяйте рычаг на экране 2 или договоритесь с соседями.</div>`;
  }).join('');
}

const SCREENS=[sc0,sc1,sc2,sc3,sc4,sc5,sc6];

/* ================== ПЕЧАТНЫЙ ЛИСТ ================== */
function sheet(){
  const t=S.ttk, c=calc(), nd=need();
  const d=new Date(); const date=d.toLocaleDateString('ru-RU');
  const ing=[];
  if(nd.c) ing.push(['Морковь',c.cB,c.cN,c.addC?`добавлено от другого ресторана: ${c.addC} г`:'' ]);
  if(nd.a) ing.push(['Яблоки',c.aB,c.aN,c.addA?`добавлено от другого ресторана: ${c.addA} г`:'' ]);
  if(c.oil) ing.push(['Масло растительное'+star('dressing'),c.oil,c.oil,'']);
  if(c.sugar) ing.push(['Сахар',c.sugar,c.sugar,'']);
  const wash=(v,o,map)=> v==='other'?esc(o||'—'):(map[v]||'____');
  const proc=[];
  if(nd.c) proc.push(['Морковь', wash(t.carrotWash,t.carrotWashOther,WASH_C)+star('carrotWash'), (PEEL_C[t.carrotPeel]||'____')+star('carrotPeel')+(t.carrotPeel==='peeler'&&!S.base.peeler?' (резерв: средний нож)':''), '—']);
  if(nd.a) proc.push(['Яблоки', wash(t.appleWash,t.appleWashOther,WASH_A)+star('appleWash'), (PEEL_A[t.applePeel]||'____')+star('applePeel'), t.appleCore?'удалить семенное гнездо'+star('appleCore'):'____']);
  const steps=(k)=> t[k].filter(s=>filled(s.t)).map(s=>`<li>${esc(s.t)}${s.star?'<span class="star">*</span>':''}${stepTool(s)?` <span class="fine">(${esc(invStatus(stepTool(s))==='no'&&S.inv.replace[stepTool(s)]?S.inv.replace[stepTool(s)]:stepTool(s))})</span>`:''}</li>`).join('') || '<li>____________________</li><li>____________________</li>';
  const dress = noDressing()||t.dressing==='none' ? '<div class="line"><i>Наш салат — без заправки, это авторское решение.</i></div>' : '';
  const rows=invRows();
  const inv=rows.map(r=>{
    const nm = r.st==='no' && r.rep ? `${esc(r.rep)} <span class="fine">(вместо: ${esc(r.name)})</span>` : esc(r.name);
    let h=`<tr><td>${nm}</td><td class="fine">${esc(r.why)}</td><td></td><td style="text-align:center"><span class="box"></span></td></tr>`;
    if(r.name==='Овощечистка') h+=`<tr><td class="fine">↳ резерв: нож средний</td><td class="fine">если овощечистку не найдём</td><td></td><td style="text-align:center"><span class="box"></span></td></tr>`;
    return h; }).join('');
  const slots=MOMENTS.filter(m=>!((m.k==='a'&&!nd.a)||(m.k==='c'&&!nd.c))).map(m=> `<div class="line">Наш слот: № <b>${S.slots[m.k]||'___'}</b> в <b>${S.slots[m.k]?SLOT_MIN(S.slots[m.k]):'___'}</b> мин — ${m.l.toLowerCase()}</div>`).join('');
  const anyStar=Object.keys(S.stars).length || t.prep.concat(t.asm).some(s=>s.star);
  const draft = S.maxScreen<6;
  return `<div class="ps">
    ${draft?'<div class="draft">ЧЕРНОВИК</div>':''}
    <div class="hd"><div class="r1">✦ Ресторан ✦ ${esc(S.name||'__________')} ✦</div>
      <div class="r2">ТЕХНОЛОГИЧЕСКАЯ КАРТА</div>
      <div class="r3">Салат «${esc(t.title||'______________')}»${star('title')}</div></div>
    <div class="meta"><span>Ресторан №${S.group} · кухня 6 класса</span><span>Повара: ${esc(crew().join(', ')||'________')}</span><span>Дата: ${date}</span></div>
    <div class="cols"><div class="cl">
      <h4>Ингредиенты</h4>
      <table><colgroup><col style="width:56%"><col style="width:22%"><col style="width:22%"></colgroup><tr><th>Продукт</th><th style="text-align:right">Брутто, г</th><th style="text-align:right">Нетто, г</th></tr>
        ${ing.map(r=>`<tr><td>${r[0]}${r[3]?`<div class="fine">${r[3]}</div>`:''}</td><td class="bru">${r[1]}</td><td class="net">${r[2]}</td></tr>`).join('')}</table>
      ${dress}
      ${S.finds.length?`<div class="fine" style="margin-top:3px">Источники цифр: ${S.finds.map(x=>`${esc(x.what)} ${esc(x.val)} (${esc(x.src)}, на ${esc(x.basis)})`).join('; ')}</div>`:''}
      <h4>Первичная обработка</h4>
      <table><tr><th>Продукт</th><th>Мытьё</th><th>Чистка</th><th>Доп. обработка</th></tr>
        ${proc.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join('')}</table>
      <h4>Подготовка <span class="fine">(у весов и тёрок)</span></h4><ol>${steps('prep')}</ol>
      <h4>Сборка <span class="fine">(за столом группы)</span></h4><ol>${steps('asm')}</ol>
      <h4>Выход и подача</h4>
      <div class="line">Выход: <b>${c.out||'___'} г</b>${star('portion')}, порция ${esc(t.portion||'___')} г. Подача: <b>${S.levers.serve?leverLabel('serve',S.levers.serve):'___'}</b>${star('serve')}. Температура: <b>${REF.temp} °С</b>.</div>
      <div class="line">Заправленный салат — ${REF.life}. Время приготовления: ${esc(t.time||'___')} мин.</div>
      <div class="line fine">Профиль: ${LEVER_KEYS.map(k=>LEVERS[k].label.split(' (')[0].toLowerCase()+' — '+(S.levers[k]?leverLabel(k,S.levers[k]):'___')+star(k)).join('; ')}.</div>
      ${S.levers.ratio&&S.levers.ratio!=='2:1'&&filled(S.ratioNote)?`<div class="line"><b>Особенность рецепта:</b> ${esc(S.ratioNote)}</div>`:''}
      ${anyStar?'<div class="fine" style="margin-top:4px">* данные эталона ТТК №9, не наши</div>':''}
      <div class="sign">Шеф-повар группы: <span></span> &nbsp; подпись: <span style="min-width:24mm"></span></div>
    </div><div class="cr">
      <h4>Инвентарь для квеста</h4>
      <table><colgroup><col style="width:33%"><col style="width:30%"><col style="width:22%"><col style="width:15%"></colgroup><tr><th>Инструмент</th><th>Зачем</th><th>Где стоит</th><th style="font-size:7pt">Найдено?</th></tr>${inv||'<tr><td colspan="4">—</td></tr>'}</table>
      <h4>Очередь к весам</h4>${slots}
      <div class="memo"><b>Завтра — инспекция</b>
        1) все шаги отмечены ☐<br>2) инвентарь найден<br>3) взвешивание по слоту<br>4) подача ${REF.temp} °С</div>
      <div class="orn" style="color:#1d1510;font-size:12pt">✦ ✦ ✦</div>
    </div></div></div>`;
}
function doPrint(){
  if(broken()){ modal(`<h2>Печать заблокирована</h2><p class="lead">В карте есть инструмент без замены или резерва. Откройте экран 5 «Инвентарь» и исправьте.</p><div class="row"><button class="btn-main" data-mact="close">Понятно</button></div>`); return; }
  $('#printSheet').innerHTML=sheet();
  setTimeout(()=>window.print(),50);
}

/* ================== ЭКСПРЕСС-РЕЖИМ ================== */
function express(){
  const t=S.ttk, st=S.stars;
  const f=(obj,k,v,s)=>{ if(obj[k]===''||obj[k]==null||obj[k]===false){ obj[k]=v; st[s||k]=true; } };
  f(t,'title','Салат из моркови и яблок №9','title');
  f(S.levers,'ratio','2:1','ratio'); f(S.levers,'serve','hill','serve');
  f(t,'carrotWash','flow'); f(t,'carrotPeel',S.base.peeler?'peeler':'knife');
  f(t,'appleWash','flow'); f(t,'applePeel',S.levers.texture==='nopeel'?'knife':'none'); f(t,'appleCore',true);
  if(!noDressing()) f(t,'dressing',S.base.oil?'oil':'none');
  f(t,'portion','100');
  const mk=(txt,tool)=>({t:txt,tool,toolOther:'',star:true});
  t.prep=t.prep.filter(s=>filled(s.t)); t.asm=t.asm.filter(s=>filled(s.t));
  if(!t.prep.length){ t.prep=[mk('Взвесить морковь и яблоки брутто (по слоту)','Весы электронные'), mk('Вымыть морковь и яблоки','none'),
    mk('Очистить морковь', t.carrotPeel==='peeler'?'Овощечистка':'Нож средний'), mk('Удалить у яблок семенное гнездо','Нож средний'),
    mk('Контрольное взвешивание нетто','Весы электронные'), mk('Натереть морковь и яблоки','Тёрка крупная')]; }
  if(!t.asm.length){ t.asm=[mk('Соединить морковь и яблоки','Салатник')];
    if(t.dressing==='oil') t.asm.push(mk('Заправить растительным маслом','none'));
    t.asm.push(mk('Выложить горкой на тарелку','Тарелка')); }
  if(!S.inv.checked) S.inv.checked=true;
  save(); render();
}

/* ================== ОТРИСОВКА ================== */
function render(keepScroll){
  const y=window.scrollY;
  $('#screen').innerHTML=SCREENS[S.screen]();
  renderHeader(); renderNav(); light();
  if(keepScroll) window.scrollTo(0,y);
}
function renderHeader(){
  $('#hdrName').textContent = filled(S.name) ? '«'+S.name+'»' : 'Ресторан №'+S.group;
  const c=crew(); $('#hdrLeader').textContent = c.length ? 'Ведущий: '+c[S.leader % c.length] : '';
  $('#progress').innerHTML = TITLES.map((l,i)=>{ const cls = i<S.maxScreen?'done': i===S.maxScreen?'cur':'';
    return `<button class="seg ${cls}${i===S.screen?' view':''}" ${i<=S.maxScreen?`data-act="goto" data-i="${i}"`:'disabled'} title="${l}">${i<S.maxScreen?'✓ ':''}${l}</button>`; }).join('');
  $('#beacon').innerHTML = `<span>👨‍🍳 <b>Сейчас делаем:</b> ${TASKS[S.maxScreen]}</span>${S.screen!==S.maxScreen?'<button data-act="toTask">↩ Вернуться к задаче</button>':'<button data-act="toTask">↓ К задаче</button>'}`;
}
function renderNav(){
  const i=S.screen, last=i===6;
  $('#nav').innerHTML = `${i>0?'<button data-act="back">← Назад</button>':''}<div class="msg" id="navMsg"></div>
    ${last?'':`<button class="btn-main" id="nextBtn" data-act="next">${i<S.maxScreen?'Вперёд →':'Передать следующему →'}</button>`}`;
}
function light(){
  const m=missing(S.screen), msg=$('#navMsg'), nb=$('#nextBtn');
  if(msg){ msg.className='msg '+(m.length?'miss':'ok');
    msg.textContent = S.screen===6 ? '' : m.length ? 'Осталось: '+m.slice(0,4).join(', ')+(m.length>4?` и ещё ${m.length-4}`:'') : (S.screen===S.maxScreen?'Готово! Передайте мышку следующему повару.':'Готово.'); }
  if(nb) nb.disabled = m.length>0;
  document.querySelectorAll('#screen .req').forEach(el=> el.classList.toggle('empty', !filled(el.value)));
  if(S.screen===2){ const cb=$('#calcBox'); if(cb) cb.innerHTML=calcBox(); const af=$('#addFind'); if(af) af.disabled=!findOk(); }
  if(S.screen===3){ const sb=$('#salineBox'); if(sb) sb.innerHTML=salineBox(); }
  if(S.screen===6){ const ar=$('#auditRes'); if(ar) ar.innerHTML=auditRes(); }
  if(S.screen===0) renderHeader();
}

/* ================== ДЕЙСТВИЯ ================== */
function modal(html){ $('#modalBox').innerHTML=html; $('#modal').classList.remove('hidden'); }
function closeModal(){ $('#modal').classList.add('hidden'); }
function next(){
  if(missing(S.screen).length) return;
  if(S.screen===S.maxScreen){
    S.maxScreen++; S.screenStart[S.maxScreen]=Date.now();
    const c=crew(); if(c.length) S.leader=(S.leader+1)%c.length;
  }
  S.screen++; save(); render(); window.scrollTo(0,0);
  const c=crew();
  if(S.screen===S.maxScreen && S.maxScreen===S.checkinScreen && !S.checkinDone){
    modal(`<h2>Минутка шефа</h2><p class="lead">Все ли в ресторане согласны с тем, что вы уже решили?</p>
      <div class="row"><button class="btn-green" data-mact="ciYes">Да, все согласны</button><button data-mact="ciTalk">Обсудим</button></div>`);
  } else if(S.screen===S.maxScreen && c.length){
    toast(`Ведущий теперь: ${c[S.leader%c.length]}`);
  }
}
function toast(txt){ const b=$('#beacon'); if(!b) return; const s=document.createElement('span'); s.textContent=' · '+txt; s.style.cssText='font-weight:700;color:var(--green)'; b.firstChild.appendChild(s); setTimeout(()=>s.remove(),4000); }
function toTask(){
  S.screen=S.maxScreen; save(); render();
  const el=[...document.querySelectorAll('#screen .req')].find(e=>!filled(e.value));
  if(el){ el.scrollIntoView({block:'center'}); el.focus(); } else window.scrollTo(0,0);
}
function act(a,d){
  switch(a){
    case 'diag': S.diag[d.q]=d.v; break;
    case 'lever': S.levers[d.k]=d.v; break;
    case 'goto': S.screen=+d.i; save(); render(); window.scrollTo(0,0); return;
    case 'next': return next();
    case 'back': S.screen=Math.max(0,S.screen-1); save(); render(); window.scrollTo(0,0); return;
    case 'toTask': return toTask();
    case 'reset': return modal(`<h2>Стереть всё?</h2><p class="lead">Название, ответы, рычаги и ТТК ресторана №${S.group} исчезнут. Это не отменить.</p>
      <div class="row"><button class="btn-main" data-mact="doReset">Да, стереть</button><button data-mact="close">Нет</button></div>`);
    case 'switch': try{localStorage.removeItem(ACTIVE);}catch(e){} return showPicker();
    case 'search': window.open('https://yandex.ru/search/?text='+encodeURIComponent(QUERIES[+d.i]),'_blank'); startQ(+d.i); break;
    case 'alice': copyText(QUERIES[+d.i]); window.open('https://alice.yandex.ru/','_blank'); startQ(+d.i); toast('Запрос скопирован — вставьте его Алисе'); return;
    case 'copyq': copyText(QUERIES[+d.i]); toast('Запрос скопирован'); return;
    case 'qtimer': startQ(+d.i); break;
    case 'addFind': if(!findOk()) return; { const f=S.fd; S.finds.push({val:f.val.trim(),what:f.what.trim(),src:f.src==='site'?'сайт: '+f.site.trim():'Алиса AI',basis:f.basis}); S.fd={val:'',what:'',src:'',site:'',basis:''}; } break;
    case 'delFind': S.finds.splice(+d.i,1); break;
    case 'addStep': S.ttk[d.k].push(emptyStep()); break;
    case 'delStep': S.ttk[d.k].splice(+d.j,1); break;
    case 'checkInv': S.inv.checked=true; break;
    case 'pick': S.slotPick=d.k; break;
    case 'slot': { const n=+d.n; for(const k of ['a','c','n']) if(S.slots[k]===n) S.slots[k]=null; S.slots[S.slotPick]=n;
      const order=['a','c','n'].filter(k=>MOMENTS.find(m=>m.k===k)); const nd=need(); const seq=order.filter(k=>!((k==='a'&&!nd.a)||(k==='c'&&!nd.c)));
      const nx=seq.find(k=>!S.slots[k]); if(nx) S.slotPick=nx; } break;
    case 'busy': S.busy[d.n]=!S.busy[d.n]; break;
    case 'express': return express();
    case 'print': return doPrint();
    default: return;
  }
  save(); render(true);
}
function startQ(i){ if(!S.qt[i]) { S.qt[i]=Date.now(); save(); } }
function copyText(t){ try{ navigator.clipboard.writeText(t); }catch(e){ const x=document.createElement('textarea'); x.value=t; document.body.appendChild(x); x.select(); try{document.execCommand('copy');}catch(_){} x.remove(); } }

/* ================== ТАЙМЕРЫ ================== */
function tick(){
  if(!S) return;
  const now=Date.now();
  const totalLeft=TOTAL*60-(now-S.startAt)/1000;
  const st=S.screenStart[S.maxScreen]||now;
  const scrLeft=PLAN[S.maxScreen]*60-(now-st)/1000;
  const set=(id,lbl,v,warnAt)=>{ const el=$(id); el.className='tm '+(v<0?'over':v<=warnAt?'warn':'ok'); el.innerHTML=`<small>${lbl}</small><span>${fmt(v)}</span>`; };
  set('#tmScreen','ЭКРАН '+(S.maxScreen+1),scrLeft,60);
  set('#tmTotal','УРОК',totalLeft,300);
  QUERIES.forEach((q,i)=>{ const el=$('#qt'+i); if(!el) return; if(!S.qt[i]){ el.textContent=''; return; }
    const l=240-(now-S.qt[i])/1000; el.innerHTML = l>0 ? `⏱ ${fmt(l)}` : '<span style="color:var(--brick)">⏰ Время! Нашли цифру? Внесите ниже ↓</span>'; });
  const elapsed=(now-S.startAt)/1000/60, al=$('#alarm');
  const lag = elapsed>=35 && S.maxScreen<=4 && !S.alarmHidden;
  al.classList.toggle('hidden',!lag);
  if(lag && !al.dataset.on){ al.dataset.on='1'; al.innerHTML=`<span>⏰ У вас 5 минут. Сохранить черновик и распечатать?</span>
    <button data-act="print">🖨 Распечатать черновик</button><button data-act="expressPrint">★ Заполнить из эталона №9 и распечатать</button><button class="ghost" data-act="hideAlarm">Позже</button>`; }
  if(!lag) delete al.dataset.on;
}

/* ================== ВЫБОР РЕСТОРАНА ================== */
function showPicker(){
  const info=g=>{ const o=readGroup(g); return o&&o.name?`«${esc(o.name)}», экран ${o.maxScreen+1}`:'ещё не открыт'; };
  modal(`<div class="picker"><h1>Какой вы ресторан?</h1><p class="lead">Выберите номер своей группы. Всё, что вы введёте, сохранится на этом компьютере — даже если страница перезагрузится.</p>
    <div class="pickgrid">${[1,2,3].map(g=>`<button class="btn-main" data-mact="pick" data-g="${g}">Ресторан №${g}<small style="color:#fde">${info(g)}</small></button>`).join('')}</div>
    <p class="small muted" style="margin-top:14px">Общий таймер урока (40 мин) запускается, когда ресторан открывается впервые.</p></div>`);
}
function startGroup(g){
  S=load(g); try{localStorage.setItem(ACTIVE,String(g));}catch(e){}
  save(); closeModal(); render(); window.scrollTo(0,0);
}

/* ================== СОБЫТИЯ ================== */
document.addEventListener('click',e=>{
  const m=e.target.closest('[data-mact]');
  if(m){ const a=m.dataset.mact;
    if(a==='close') closeModal();
    if(a==='pick') startGroup(+m.dataset.g);
    if(a==='doReset'){ const g=S.group; try{localStorage.removeItem(KEY(g));}catch(e){} S=fresh(g); save(); closeModal(); render(); }
    if(a==='ciYes'||a==='ciTalk'){ S.checkinDone=true; S.checkinAnswer=a==='ciYes'?'да':'обсудим'; save();
      if(a==='ciTalk'){ $('#modalBox').innerHTML='<h2>Обсудите — 1 минута</h2><p class="lead">Пусть каждый скажет, что ему не нравится. Решили — жмите «Продолжаем».</p><button class="btn-green" data-mact="close">Продолжаем</button>'; return; }
      closeModal(); }
    return;
  }
  const b=e.target.closest('[data-act]'); if(!b || b.disabled) return;
  if(b.dataset.act==='hideAlarm'){ S.alarmHidden=true; save(); tick(); return; }
  if(b.dataset.act==='expressPrint'){ express(); doPrint(); return; }
  act(b.dataset.act,b.dataset);
});
const isText=t=> t.tagName==='TEXTAREA' || (t.tagName==='INPUT' && (t.type==='text'||t.type==='number'));
function valOf(t){ return t.type==='checkbox' ? t.checked : t.value; }
document.addEventListener('input',e=>{ const t=e.target; if(!S||!t.dataset||!t.dataset.p||!isText(t)) return; setP(t.dataset.p,valOf(t)); save(); light(); });
document.addEventListener('change',e=>{
  const t=e.target; if(!S||!t.dataset) return;
  if(t.dataset.rep!==undefined){ S.inv.replace[t.dataset.rep]=t.value; save(); render(true); return; }
  if(!t.dataset.p) return;
  setP(t.dataset.p,valOf(t));
  if(t.dataset.p==='ttk.carrotWashOther') S.ttk.carrotWashConfirm=false;
  save();
  if(isText(t)) light(); else render(true);
});

/* ================== СТАРТ ================== */
(function init(){
  let g=null; try{ g=localStorage.getItem(ACTIVE); }catch(e){}
  if(g && ['1','2','3'].includes(g)) startGroup(+g); else showPicker();
  setInterval(tick,1000); tick();
})();
</script>
</body>
</html>
