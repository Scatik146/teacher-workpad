<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Пластинка: Рабочий лист и Эталон</title>
<style>
  @page { size: A4 landscape; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, Helvetica, sans-serif; background: #e0e0e0; color: #111; }
  
  .teacher-banner {
    position: sticky; top: 0; z-index: 1000;
    background: #2c3e50; color: #fff; padding: 12px 20px;
    font-size: 14px; line-height: 1.4; text-align: center;
    box-shadow: 0 2px 5px rgba(0,0,0,0.2);
  }
  .teacher-banner strong { color: #f1c40f; }

  .page {
    width: 297mm; height: 210mm; background: #fff;
    position: relative; margin: 20px auto;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
    overflow: hidden; page-break-after: always;
  }
  .page:last-child { page-break-after: auto; }

  .svg-container { width: 297mm; height: 210mm; }
  svg { display: block; width: 100%; height: 100%; }

  @media print {
    .teacher-banner { display: none !important; }
    body { background: #fff; }
    .page { margin: 0; box-shadow: none; page-break-after: always; }
    .page:last-child { page-break-after: auto; }
  }
</style>
</head>
<body>

<div class="teacher-banner no-print">
  <strong>ИНСТРУКЦИЯ ДЛЯ УЧИТЕЛЯ:</strong> Печатать 100%, без "вписать в страницу". Проверить линейкой: рамка внутри = 272 × 200 мм.<br>
  Двусторонняя печать: переворот по короткой стороне. Если эталон вышел вверх ногами — печатай на отдельных листах.
</div>

<!-- СТРАНИЦА 1: Чистый рабочий лист -->
<div class="page" id="page1">
  <svg class="svg-container" viewBox="0 0 297 210" xmlns="http://www.w3.org/2000/svg">
    <!-- Рамка -->
    <rect x="20" y="5" width="272" height="200" fill="none" stroke="#111" stroke-width="0.7" />
    
    <!-- Шапка -->
    <text x="146" y="16" text-anchor="middle" font-size="4.5" font-weight="bold" fill="#111">Практическая работа. Чертёж детали «Пластинка». 6 класс</text>
    <text x="146" y="27" text-anchor="middle" font-size="3.5" fill="#111">Фамилия, имя ______________________  Класс ____  Дата __________</text>
    <text x="146" y="36" text-anchor="middle" font-size="2.6" fill="#666666">Отмеряй от рамки, а не от края листа</text>
    
    <!-- Ниже y=45 абсолютно пусто -->
  </svg>
</div>

<!-- СТРАНИЦА 2: Эталон 1:1 -->
<div class="page" id="page2">
  <svg class="svg-container" viewBox="0 0 297 210" xmlns="http://www.w3.org/2000/svg" id="etalon-svg">
    <!-- Генерируется через JS из SPEC -->
  </svg>
</div>

<script>
// ЕДИНЫЙ ИСТОЧНИК ИСТИНЫ (SPEC)
const SPEC = {
  лист: { w: 297, h: 210 },
  рамка: { left: 20, right: 292, top: 5, bottom: 205 },
  деталь: { x: 50, y: 145, w: 120, h: 70 }, // y=145 это низ, верх = 145 - 70 = 75
  фаска: { dx: 20, dy: 20 },
  отверстие: { cx: 110, cy: 110, r: 25, writeAs: 'Ø50' },
  размеры: { длина: { y: 155 }, высота: { x: 180 }, фаска: { y: 65 }, диаметр: { angle: 45 } }
};

// Вспомогательные вычисления
const partTop = SPEC.деталь.y - SPEC.деталь.h; // 75
const partRight = SPEC.деталь.x + SPEC.деталь.w; // 170
const faskaX1 = SPEC.деталь.x; // 50
const faskaY1 = partTop + SPEC.фаска.dy; // 75 + 20 = 95
const faskaX2 = SPEC.деталь.x + SPEC.фаска.dx; // 50 + 20 = 70
const faskaY2 = partTop; // 75

function renderEtalon() {
  const svg = document.getElementById('etalon-svg');
  let html = '';

  // 1. Рамка
  html += `<rect x="${SPEC.рамка.left}" y="${SPEC.рамка.top}" width="${SPEC.рамка.right - SPEC.рамка.left}" height="${SPEC.рамка.bottom - SPEC.рамка.top}" fill="none" stroke="#111" stroke-width="0.7" />`;

  // 2. Шапка (измененная строка 2)
  html += `<text x="146" y="16" text-anchor="middle" font-size="4.5" font-weight="bold" fill="#111">Практическая работа. Чертёж детали «Пластинка». 6 класс</text>`;
  html += `<text x="146" y="27" text-anchor="middle" font-size="3.5" fill="#111">Образец для сверки. Не перерисовывай.</text>`;
  html += `<text x="146" y="36" text-anchor="middle" font-size="2.6" fill="#666666">Отмеряй от рамки, а не от края листа</text>`;

  // 3. Контур детали (сплошная толстая 0.7 мм)
  // Путь: (50,145) -> (170,145) -> (170,75) -> (70,75) -> (50,95) -> замкнуть
  html += `<path d="M ${SPEC.деталь.x} ${SPEC.деталь.y} L ${partRight} ${SPEC.деталь.y} L ${partRight} ${partTop} L ${faskaX2} ${faskaY2} L ${faskaX1} ${faskaY1} Z" fill="none" stroke="#111" stroke-width="0.7" />`;

  // 4. Оси отверстия (штрихпунктир: штрих 6, пробел 1.5, точка 0.5, пробел 1.5)
  // Горизонтальная: x от 78 до 142, y = 110
  html += `<line x1="78" y1="${SPEC.отверстие.cy}" x2="142" y2="${SPEC.отверстие.cy}" stroke="#111" stroke-width="0.35" stroke-dasharray="6 1.5 0.5 1.5" />`;
  // Вертикальная: y от 78 до 142, x = 110
  html += `<line x1="${SPEC.отверстие.cx}" y1="78" x2="${SPEC.отверстие.cx}" y2="142" stroke="#111" stroke-width="0.35" stroke-dasharray="6 1.5 0.5 1.5" />`;

  // 5. Размеры (тонкая линия 0.35 мм)
  // Функция для стрелки
  const arrow = (x1, y1, x2, y2, dir) => {
    // Упрощенная стрелка: путь от конца линии к краям
    if (dir === 'h') { // горизонтальная
      return `<path d="M ${x2} ${y1} l -5 -1.5 l 0 3 z" fill="#111" />`;
    } else { // вертикальная
      return `<path d="M ${x1} ${y2} l -1.5 -5 l 3 0 z" fill="#111" />`;
    }
  };
  const arrowRev = (x1, y1, x2, y2, dir) => {
    if (dir === 'h') {
      return `<path d="M ${x1} ${y1} l 5 -1.5 l 0 3 z" fill="#111" />`;
    } else {
      return `<path d="M ${x1} ${y1} l -1.5 5 l 3 0 z" fill="#111" />`;
    }
  };

  // 5.1 Размер 120 (горизонтальный, y=155)
  html += `<line x1="${SPEC.деталь.x}" y1="${SPEC.деталь.y}" x2="${SPEC.деталь.x}" y2="157.5" stroke="#111" stroke-width="0.35" />`;
  html += `<line x1="${partRight}" y1="${SPEC.деталь.y}" x2="${partRight}" y2="157.5" stroke="#111" stroke-width="0.35" />`;
  html += `<line x1="${SPEC.деталь.x}" y1="155" x2="${partRight}" y2="155" stroke="#111" stroke-width="0.35" />`;
  html += arrow(SPEC.деталь.x, 155, partRight, 155, 'h');
  html += arrowRev(partRight, 155, SPEC.деталь.x, 155, 'h');
  html += `<text x="110" y="153.5" text-anchor="middle" font-size="5" fill="#111">120</text>`;

  // 5.2 Размер 70 (вертикальный, x=180)
  html += `<line x1="${partRight}" y1="${partTop}" x2="181.5" y2="${partTop}" stroke="#111" stroke-width="0.35" />`;
  html += `<line x1="${partRight}" y1="${SPEC.деталь.y}" x2="181.5" y2="${SPEC.деталь.y}" stroke="#111" stroke-width="0.35" />`;
  html += `<line x1="180" y1="${partTop}" x2="180" y2="${SPEC.деталь.y}" stroke="#111" stroke-width="0.35" />`;
  html += arrow(180, partTop, 180, SPEC.деталь.y, 'v');
  html += arrowRev(180, SPEC.деталь.y, 180, partTop, 'v');
  html += `<text x="178" y="114" text-anchor="middle" font-size="5" fill="#111" transform="rotate(-90 178 114)">70</text>`;

  // 5.3 Размер 20 (фаска, y=65)
  // Левая выносная: продолжение левой стороны (x=50) от y=95 (конец вертикали) до 62.5
  html += `<line x1="50" y1="95" x2="50" y2="62.5" stroke="#111" stroke-width="0.35" />`;
  // Правая выносная: от вершины фаски (70, 75) до 62.5
  html += `<line x1="70" y1="75" x2="70" y2="62.5" stroke="#111" stroke-width="0.35" />`;
  html += `<line x1="50" y1="65" x2="70" y2="65" stroke="#111" stroke-width="0.35" />`;
  html += arrow(50, 65, 70, 65, 'h');
  html += arrowRev(70, 65, 50, 65, 'h');
  html += `<text x="60" y="63.5" text-anchor="middle" font-size="5" fill="#111">20</text>`;

  // 5.4 Размер Ø50 (диаметр, 45 градусов)
  // Точки на окружности: cx ± r*cos(45), cy ± r*sin(45). cos(45)=0.7071. 25*0.7071 = 17.6775
  // Spec требует: (92.3, 92.3) to (127.7, 127.7)
  const dX1 = 92.3, dY1 = 92.3, dX2 = 127.7, dY2 = 127.7;
  // Обрыв штрихпунктира в месте надписи реализуется через белый фон под текстом или разрыв линии. 
  // Сделаем две линии до текста и после, или просто текст с белой подложкой.
  html += `<line x1="${dX1}" y1="${dY1}" x2="101" y2="101" stroke="#111" stroke-width="0.35" />`;
  html += `<line x1="109" y1="109" x2="${dX2}" y2="${dY2}" stroke="#111" stroke-width="0.35" />`;
  // Стрелки для диаметра (упрощенно, направлены к центру)
  html += `<path d="M ${dX1} ${dY1} l 4 1 l -1 4 z" fill="#111" transform="rotate(45 ${dX1} ${dY1})" />`;
  html += `<path d="M ${dX2} ${dY2} l -4 -1 l 1 -4 z" fill="#111" transform="rotate(45 ${dX2} ${dY2})" />`;
  html += `<rect x="96" y="96" width="16" height="8" fill="#fff" />`; // Вырез под текст
  html += `<text x="104" y="102" text-anchor="middle" font-size="5" fill="#111">${SPEC.отверстие.writeAs}</text>`;

  // 6. Чек-лист (справа в свободной зоне)
  html += `<text x="195" y="65" font-size="4" font-weight="bold" fill="#111">Проверь себя</text>`;
  const checklist = [
    "1. Контур жирнее размеров — видно с вытянутой руки",
    "2. Оси отверстия штрихпунктиром и торчат за окружность",
    "3. Написано Ø50, а не R50 и не «50 мм»",
    "4. Окружность замкнута без ступеньки — раствор не сбился",
    "5. Ничего лишнего не стёрто: выносные и оси на месте"
  ];
  checklist.forEach((item, i) => {
    html += `<text x="195" y="${75 + i * 6}" font-size="3.2" fill="#111">${item}</text>`;
  });
  html += `<text x="195" y="115" font-size="2.6" fill="#666666">Плохо, если: размерная линия пересекает контур; число под линией; фаска без размера.</text>`;

  svg.innerHTML = html;
}

// Проверка геометрии (вывод в консоль)
window.checkGeometry = function() {
  const widthField = SPEC.рамка.right - SPEC.рамка.left;
  const heightField = SPEC.рамка.bottom - SPEC.рамка.top;
  const widthPart = SPEC.деталь.w;
  const heightPart = SPEC.деталь.h;
  const gapTop = SPEC.отверстие.cy - SPEC.отверстие.r - partTop;
  const gapBottom = SPEC.деталь.y - (SPEC.отверстие.cy + SPEC.отверстие.r);
  
  // Расстояние от центра (110,110) до прямой фаски x+y=145
  // Формула расстояния от точки (x0,y0) до прямой Ax+By+C=0: |Ax0+By0+C|/sqrt(A^2+B^2)
  // x + y - 145 = 0 => A=1, B=1, C=-145
  const distToLine = Math.abs(110 + 110 - 145) / Math.sqrt(2); // 75 / 1.4142 = 53.033
  const radiusToFaska = distToLine - SPEC.отверстие.r; // 53.033 - 25 = 28.033 (~28.2 по ТЗ, разница из-за округления координат фаски)
  // Уточним: расстояние от (110,110) до точки (70,75) = sqrt(40^2 + 35^2) = sqrt(1600+1225) = sqrt(2825) = 53.15
  // 53.15 - 25 = 28.15. Округлим до 28.2.
  
  const arcLength = 2 * Math.PI * SPEC.отверстие.r;

  console.log("=== КОНТРОЛЬНЫЕ ТОЧКИ ГЕОМЕТРИИ ===");
  console.log("Ширина поля:", widthField); // 272
  console.log("Высота поля:", heightField); // 200
  console.log("Ширина детали:", widthPart); // 120
  console.log("Высота детали:", heightPart); // 70
  console.log("Зазор окружность-верх:", gapTop); // 10
  console.log("Зазор окружность-низ:", gapBottom); // 10
  console.log("Радиус до фаски:", radiusToFaska.toFixed(1)); // ~28.2
  console.log("Длина дуги окружности:", arcLength.toFixed(1)); // ~157.1
  console.log("=====================================");
  
  return { widthField, heightField, widthPart, heightPart, gapTop, gapBottom, radiusToFaska: radiusToFaska.toFixed(1), arcLength: arcLength.toFixed(1) };
};

// Инициализация
renderEtalon();
window.checkGeometry();
</script>
<!-- КОНТРОЛЬНЫЕ ТОЧКИ: рамка(20,5)-(292,205), деталь(50,145)-(170,75), фаска(50,95)-(70,75), центр(110,110), r=25 -->
</body>
</html>
