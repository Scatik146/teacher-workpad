<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Тренажёр</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;user-select:none;-webkit-user-select:none;background:#0b1220}
#app{position:relative;width:100%;height:100%}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:3vmin;text-align:center}
.screen.active{display:flex;animation:fadeIn .25s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
h1{font-size:6vmin;margin-bottom:2vmin;color:#1c2540}
.mascot{width:22vmin;height:22vmin}
.mascot svg,.icon svg,.icon.big svg,.kb-icon svg{width:100%;height:100%;display:block}
.icon{width:14vmin;height:14vmin}
.icon.big{width:22vmin;height:22vmin}
.btn{font-size:5vmin;padding:3vmin 8vmin;border:none;border-radius:3vmin;background:#ffd54a;color:#222;cursor:pointer;font-weight:700;box-shadow:0 1vmin 0 #b99300}
.btn:active{transform:translateY(.5vmin);box-shadow:0 .5vmin 0 #b99300}
.hint{font-size:3vmin;color:#5b6b85;margin-top:3vmin}
.teacher-link{position:absolute;bottom:1vmin;right:1vmin;font-size:2.2vmin;color:#5b6b85;text-decoration:none;opacity:.5;cursor:pointer;z-index:60}
.teacher-link:hover{opacity:1}

.block-header{position:absolute;top:2vmin;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:0 3vmin;z-index:50;pointer-events:none;gap:2vmin}
.counter{font-size:4.5vmin;font-weight:800;background:#fff;border-radius:2vmin;padding:1vmin 3vmin;box-shadow:0 .5vmin 1.5vmin rgba(0,0,0,.15);color:#2b3a55}
.prompt{font-size:3.6vmin;font-weight:700;background:#ffd54a;border-radius:2vmin;padding:1vmin 3vmin;color:#222}
.prompt b{font-size:5vmin;color:#d33}

#screen-block-1{background:linear-gradient(#87ceeb,#e0f6ff)}
.play-area{position:absolute;inset:0;overflow:hidden}
.ball{position:absolute;width:13vmin;height:13vmin;cursor:pointer;transform:translate(-50%,-50%);transition:transform .1s;user-select:none}
.ball:hover{transform:translate(-50%,-50%) scale(1.1)}
.ball:active{transform:translate(-50%,-50%) scale(.92)}
.ball svg{width:100%;height:100%;display:block;filter:drop-shadow(0 .5vmin 1vmin rgba(0,0,0,.2))}
.ball.hint-mode:not(.target){filter:grayscale(.7) brightness(.85);opacity:.75}
.ball.hint-mode:not(.target) text{opacity:0;transition:opacity .3s}
.ball.target{animation:targetGlow 1s infinite}
@keyframes targetGlow{0%,100%{filter:drop-shadow(0 0 1vmin #ffd700)}50%{filter:drop-shadow(0 0 3vmin #ffd700)}}
.ball.bonus{animation:bonusPulse 1.2s infinite;z-index:5}
@keyframes bonusPulse{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.15)}}

#screen-block-2{background:linear-gradient(#a7d99a,#e9f7d9)}
.mushroom{position:absolute;width:13vmin;height:13vmin;cursor:pointer;transform:translate(-50%,-50%);transition:transform .15s;user-select:none}
.mushroom svg{width:100%;height:100%;display:block}
.mushroom.gold{animation:goldPulse .8s infinite;cursor:pointer}
@keyframes goldPulse{0%,100%{transform:translate(-50%,-50%) scale(1);filter:drop-shadow(0 0 1.5vmin #ffcc00)}50%{transform:translate(-50%,-50%) scale(1.15);filter:drop-shadow(0 0 3.5vmin #ffcc00)}}
.mushroom.blue{animation:bluePulse 1s infinite;cursor:pointer}
@keyframes bluePulse{0%,100%{transform:translate(-50%,-50%) scale(1);filter:drop-shadow(0 0 1.5vmin #3498db)}50%{transform:translate(-50%,-50%) scale(1.18);filter:drop-shadow(0 0 3.5vmin #3498db)}}
.mushroom.done{opacity:.2;pointer-events:none}
.mushroom.drag{cursor:pointer}
.mushroom.drag.gold{cursor:grab}
.mushroom.dragging{cursor:grabbing;transform:translate(-50%,-50%) scale(1.3)!important;animation:none!important;pointer-events:none;z-index:200}
.basket{position:absolute;width:26vmin;height:26vmin;transform:translate(-50%,-50%);pointer-events:none;z-index:1}
.basket svg{width:100%;height:100%;display:block}

#screen-block-3,#screen-block-4{background:linear-gradient(#fff7e6,#ffe9b8)}
.word{font-size:15vmin;letter-spacing:2vmin;font-weight:800;color:#2b3a55;margin-bottom:3vmin}
.word .done{color:#3aa655}
.word .current{color:#e07b00;text-decoration:underline}
.typed{font-size:7vmin;color:#2b3a55;min-height:9vmin;letter-spacing:1.5vmin}
.kb-icon{width:9vmin;height:9vmin;margin-top:3vmin;opacity:.8}

#screen-block-5{background:linear-gradient(#f0e7ff,#e6f0ff)}
.mov-btn{position:absolute;transform:translate(-50%,-50%);transition:left .2s,top .2s,background .2s;z-index:10;font-size:4.5vmin;padding:2.5vmin 6vmin;border:none;border-radius:3vmin;font-weight:700;cursor:pointer;background:#ffd54a;color:#222;box-shadow:0 1vmin 0 #b99300}
.mov-btn:active{transform:translate(-50%,-50%) scale(.95)}
.mov-btn.dont{background:#ff6b6b;color:#fff;box-shadow:0 1vmin 0 #a80000}
.mov-btn.prize{background:linear-gradient(135deg,#ff6b6b,#ffd93d)!important;color:#fff!important;box-shadow:0 1vmin 0 #a80000!important;animation:prizePulse .6s infinite}
@keyframes prizePulse{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.12)}}
.prize-btn{position:absolute;transform:translate(-50%,-50%);font-size:2.2vmin;padding:1.2vmin 2.5vmin;border:none;border-radius:1.8vmin;font-weight:700;cursor:pointer;background:#ffd54a;color:#222;box-shadow:0 .5vmin 0 #b99300;z-index:30;transition:transform .1s}
.prize-btn:hover{transform:translate(-50%,-50%) scale(1.08)}
.prize-btn.dont{background:#ff6b6b;color:#fff;box-shadow:0 .5vmin 0 #a80000}
.prize-btn.clicked{background:#3aa655;color:#fff;box-shadow:0 .5vmin 0 #1e6b34}
.prize-btn.miss{opacity:.35}
.prize-btn:disabled{cursor:default}

#screen-block-6{background:linear-gradient(#e6f0ff,#f0e7ff)}
.pic-grid{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:2vmin;width:min(78vmin,88vw);height:min(78vmin,88vh);margin-top:8vmin}
.pic-opt{background:#fff;border:none;border-radius:2.5vmin;padding:1.5vmin;cursor:pointer;box-shadow:0 .6vmin 0 #c9c9e6;display:flex;align-items:center;justify-content:center;transition:transform .1s,background .2s}
.pic-opt svg{width:100%;height:100%;display:block}
.pic-opt:hover{transform:scale(1.04)}
.pic-opt:active{transform:translateY(.4vmin);box-shadow:0 .2vmin 0 #c9c9e6}
.pic-opt.correct{background:#b8f0c0;box-shadow:0 .6vmin 0 #3aa655}
.pic-opt.wrong{opacity:.25;pointer-events:none}

#screen-feedback,#screen-transition,#screen-finish{background:#0b1220;color:#fff}
#screen-feedback h1,#screen-transition h1,#screen-finish h1{color:#fff}
.feedback-icon{width:30vmin;height:30vmin}
.feedback-icon svg{width:100%;height:100%;display:block}
#screen-transition .mascot{animation:wave 1s infinite alternate}
@keyframes wave{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}

#teacher{position:fixed;inset:0;background:rgba(8,12,24,.97);color:#e8eefc;z-index:100;display:none;overflow:auto;padding:2rem;font-size:1rem}
#teacher.active{display:block}
#teacher h2{margin-bottom:.6rem;color:#fff}
#teacher h3{margin:1rem 0 .4rem;color:#cfe0ff}
#teacher table{border-collapse:collapse;width:100%;margin:.5rem 0;font-size:.85rem}
#teacher th,#teacher td{border:1px solid #2a3550;padding:.4rem .5rem;text-align:center;vertical-align:middle}
#teacher th{background:#1a2438;font-weight:600}
#teacher .mark{display:inline-block;width:1.4rem;height:1.4rem;border-radius:50%;vertical-align:middle}
#teacher .mark.success{background:#3aa655}
#teacher .mark.partial{background:#e0a800}
#teacher .mark.help{background:#d33}
#teacher .tools{display:flex;gap:.5rem;flex-wrap:wrap;margin:1rem 0}
#teacher button{font:inherit;padding:.45rem .9rem;border-radius:.4rem;border:1px solid #2a3550;background:#1a2438;color:#e8eefc;cursor:pointer}
#teacher button:hover{background:#22304c}
#teacher select{font:inherit;padding:.3rem .5rem;border-radius:.4rem;border:1px solid #2a3550;background:#0e1626;color:#e8eefc}
#teacher .row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin:.4rem 0}
#teacher .pct{font-variant-numeric:tabular-nums}
.empty{color:#7a8aa8;font-style:italic}
</style>
</head>
<body>
<div id="app">

  <section class="screen active" id="screen-welcome">
    <div class="mascot" id="welcome-mascot"></div>
    <div class="icon" id="welcome-ear"></div>
    <h1>Привет! Сейчас поиграем</h1>
    <button class="btn" id="start-btn">Начать</button>
    <div class="hint">Мышь — в руке, экран пальцем не трогай</div>
    <span class="teacher-link" id="teacher-link">Учитель</span>
  </section>

  <section class="screen" id="screen-rule-touch">
    <div class="icon big" id="rule-icon"></div>
    <h1>Экран пальцем не трогай</h1>
  </section>

  <section class="screen" id="screen-block-1">
    <div class="block-header">
      <div class="counter">✓ <span id="counter-1">0</span></div>
      <div class="prompt">Нажми шар с числом <b id="target-1">?</b></div>
    </div>
    <div class="play-area" id="play-area-1"></div>
  </section>

  <section class="screen" id="screen-feedback">
    <div class="feedback-icon" id="feedback-icon"></div>
    <h1 id="feedback-text">Молодец!</h1>
  </section>

  <section class="screen" id="screen-transition">
    <div class="mascot" id="transition-mascot"></div>
    <div class="icon" id="transition-icon"></div>
    <h1 id="transition-text">Мышь</h1>
  </section>

  <section class="screen" id="screen-block-2">
    <div class="block-header">
      <div class="counter">✓ <span id="counter-2">0</span></div>
      <div class="prompt" id="prompt-2">Нажми на цветные грибы</div>
    </div>
    <div class="play-area" id="play-area-2"></div>
  </section>

  <section class="screen" id="screen-block-3">
    <div class="block-header">
      <div class="counter">✓ <span id="counter-3">0</span></div>
    </div>
    <div class="word" id="word-3"></div>
    <div class="typed" id="typed-3"></div>
    <div class="kb-icon" id="kb3"></div>
  </section>

  <section class="screen" id="screen-block-4">
    <div class="block-header">
      <div class="counter">✓ <span id="counter-4">0</span></div>
    </div>
    <div class="word" id="word-4"></div>
    <div class="typed" id="typed-4"></div>
    <div class="kb-icon" id="kb4"></div>
  </section>

  <section class="screen" id="screen-block-5">
    <div class="block-header">
      <div class="counter">✓ <span id="counter-5">0</span></div>
      <div class="prompt">Нажимай, только если написано «Нажми»</div>
    </div>
    <button class="mov-btn" id="btn-5">Нажми</button>
  </section>

  <section class="screen" id="screen-block-6">
    <div class="block-header">
      <div class="counter">✓ <span id="counter-6">0</span></div>
      <div class="prompt">Найди две одинаковые картинки</div>
    </div>
    <div class="pic-grid" id="grid-6"></div>
  </section>

  <section class="screen" id="screen-finish">
    <div class="mascot" id="finish-mascot"></div>
    <h1>Готово! Ждём учителя</h1>
  </section>

</div>

<div id="teacher"></div>

<script>
'use strict';

/* ==================== SVG LIBRARY ==================== */
const SVG = {
  bear: `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <circle cx="20" cy="22" r="14" fill="#8b6f47" stroke="#5c4033" stroke-width="2"/>
    <circle cx="80" cy="22" r="14" fill="#8b6f47" stroke="#5c4033" stroke-width="2"/>
    <circle cx="20" cy="22" r="7" fill="#5c4033"/>
    <circle cx="80" cy="22" r="7" fill="#5c4033"/>
    <circle cx="50" cy="58" r="38" fill="#a07850" stroke="#5c4033" stroke-width="2"/>
    <circle cx="37" cy="52" r="5" fill="#1a1a1a"/>
    <circle cx="63" cy="52" r="5" fill="#1a1a1a"/>
    <circle cx="38" cy="51" r="2" fill="#fff"/>
    <circle cx="64" cy="51" r="2" fill="#fff"/>
    <ellipse cx="50" cy="68" rx="15" ry="11" fill="#f5e6d3"/>
    <ellipse cx="50" cy="64" rx="6" ry="4" fill="#1a1a1a"/>
    <path d="M43,72 Q50,80 57,72" stroke="#1a1a1a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </svg>`,
  ear: `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <path d="M60,15 C80,15 90,32 84,54 C81,66 74,72 66,72 C58,72 54,67 54,60 C54,54 58,50 63,50 C67,50 70,53 70,58" stroke="#e0a878" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M32,82 C20,68 14,52 20,36 C26,20 44,12 60,15" stroke="#e0a878" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`,
  noTouch: `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <rect x="10" y="12" width="80" height="56" rx="5" fill="#2c3e50" stroke="#1a252f" stroke-width="2"/>
    <rect x="15" y="17" width="70" height="46" rx="3" fill="#87ceeb"/>
    <rect x="44" y="68" width="12" height="10" fill="#2c3e50"/>
    <rect x="30" y="78" width="40" height="6" rx="2" fill="#2c3e50"/>
    <g transform="translate(50,50)">
      <circle r="24" fill="rgba(231,76,60,0.92)" stroke="#fff" stroke-width="3"/>
      <path d="M-12,-12 L12,12 M12,-12 L-12,12" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
    </g>
  </svg>`,
  mouse: `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="50" cy="55" rx="28" ry="40" fill="#e8e8e8" stroke="#7a7a7a" stroke-width="2.5"/>
    <line x1="50" y1="18" x2="50" y2="48" stroke="#7a7a7a" stroke-width="2.5"/>
    <rect x="34" y="20" width="16" height="22" rx="7" fill="#4a90e2" stroke="#2a6bb8" stroke-width="2"/>
  </svg>`,
  keyboard: `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <rect x="6" y="28" width="88" height="46" rx="6" fill="#2c3e50" stroke="#1a252f" stroke-width="2"/>
    <g fill="#f0f0f0">
      <rect x="12" y="36" width="10" height="8" rx="2"/>
      <rect x="26" y="36" width="10" height="8" rx="2"/>
      <rect x="40" y="36" width="10" height="8" rx="2"/>
      <rect x="54" y="36" width="10" height="8" rx="2"/>
      <rect x="68" y="36" width="10" height="8" rx="2"/>
      <rect x="82" y="36" width="6" height="8" rx="2"/>
      <rect x="12" y="48" width="14" height="8" rx="2"/>
      <rect x="30" y="48" width="10" height="8" rx="2"/>
      <rect x="44" y="48" width="10" height="8" rx="2"/>
      <rect x="58" y="48" width="10" height="8" rx="2"/>
      <rect x="72" y="48" width="16" height="8" rx="2"/>
      <rect x="20" y="60" width="60" height="8" rx="2"/>
    </g>
  </svg>`,
  faceEasy: `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <circle cx="50" cy="50" r="42" fill="#ffd54a" stroke="#d4a800" stroke-width="3"/>
    <circle cx="35" cy="42" r="6" fill="#1a1a1a"/>
    <circle cx="65" cy="42" r="6" fill="#1a1a1a"/>
    <path d="M30,62 Q50,82 70,62" stroke="#1a1a1a" stroke-width="5" fill="none" stroke-linecap="round"/>
  </svg>`,
  faceHard: `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <circle cx="50" cy="50" r="42" fill="#a3c9e8" stroke="#5a7a99" stroke-width="3"/>
    <circle cx="35" cy="42" r="6" fill="#1a1a1a"/>
    <circle cx="65" cy="42" r="6" fill="#1a1a1a"/>
    <path d="M30,74 Q50,60 70,74" stroke="#1a1a1a" stroke-width="5" fill="none" stroke-linecap="round"/>
  </svg>`,
  basket: `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <path d="M25,42 Q25,18 50,18 Q75,18 75,42" stroke="#7a5b34" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M12,44 L88,44 L80,92 Q79,98 72,98 L28,98 Q21,98 20,92 Z" fill="#c19a6b" stroke="#7a5b34" stroke-width="2.5" stroke-linejoin="round"/>
    <line x1="30" y1="54" x2="30" y2="90" stroke="#7a5b34" stroke-width="2"/>
    <line x1="50" y1="54" x2="50" y2="90" stroke="#7a5b34" stroke-width="2"/>
    <line x1="70" y1="54" x2="70" y2="90" stroke="#7a5b34" stroke-width="2"/>
    <line x1="18" y1="66" x2="82" y2="66" stroke="#7a5b34" stroke-width="2"/>
  </svg>`,
  bonus: `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <circle cx="50" cy="50" r="46" fill="#ffd700" stroke="#c79a00" stroke-width="3"/>
    <ellipse cx="34" cy="30" rx="14" ry="10" fill="rgba(255,255,255,0.55)"/>
    <polygon points="50,20 58,42 82,42 63,57 70,80 50,66 30,80 37,57 18,42 42,42"
      fill="#fff" stroke="#c79a00" stroke-width="1.5" stroke-linejoin="round"/>
    <circle cx="50" cy="48" r="4" fill="#ffd700"/>
  </svg>`
};

function svgBall(color, num){
  return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <circle cx="50" cy="50" r="46" fill="${color}" stroke="rgba(0,0,0,0.25)" stroke-width="3"/>
    <ellipse cx="34" cy="30" rx="14" ry="10" fill="rgba(255,255,255,0.45)"/>
    <text x="50" y="50" text-anchor="middle" dy=".35em" font-size="52" font-weight="900" fill="#fff" font-family="Arial,Helvetica,sans-serif" stroke="rgba(0,0,0,0.35)" stroke-width="1">${num}</text>
  </svg>`;
}

function svgMushroom(kind){
  // kind: 'normal' | 'gold' | 'blue'
  let cap, capEdge;
  if(kind === 'gold'){ cap = '#ffd700'; capEdge = '#c79a00'; }
  else if(kind === 'blue'){ cap = '#3498db'; capEdge = '#1a6fa8'; }
  else { cap = '#d9534f'; capEdge = '#a83633'; }
  const stem = '#f5deb3';
  const stemEdge = '#c8a878';
  const spot = '#fff';
  return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="50" cy="90" rx="22" ry="5" fill="rgba(0,0,0,0.18)"/>
    <rect x="38" y="48" width="24" height="38" rx="5" fill="${stem}" stroke="${stemEdge}" stroke-width="2"/>
    <ellipse cx="50" cy="44" rx="42" ry="28" fill="${cap}" stroke="${capEdge}" stroke-width="2.5"/>
    <circle cx="35" cy="36" r="6" fill="${spot}"/>
    <circle cx="62" cy="32" r="5" fill="${spot}"/>
    <circle cx="72" cy="48" r="4" fill="${spot}"/>
    <circle cx="42" cy="54" r="4" fill="${spot}"/>
    <circle cx="56" cy="50" r="3" fill="${spot}"/>
  </svg>`;
}

// Формы с параметрическим цветом
const SHAPE_DEFS = [
  {id:'circle',   color:'#e74c3c', draw:c=>`<circle cx="50" cy="50" r="38" fill="${c}"/>`},
  {id:'square',   color:'#3498db', draw:c=>`<rect x="14" y="14" width="72" height="72" rx="8" fill="${c}"/>`},
  {id:'triangle', color:'#f1c40f', draw:c=>`<polygon points="50,10 90,86 10,86" fill="${c}"/>`},
  {id:'star',     color:'#27ae60', draw:c=>`<polygon points="50,8 62,40 96,40 68,60 79,92 50,72 21,92 32,60 4,40 38,40" fill="${c}"/>`},
  {id:'heart',    color:'#e91e63', draw:c=>`<path d="M50,86 C18,62 8,42 22,26 C32,14 46,18 50,30 C54,18 68,14 78,26 C92,42 82,62 50,86 Z" fill="${c}"/>`},
  {id:'hexagon',  color:'#9b59b6', draw:c=>`<polygon points="50,8 86,29 86,71 50,92 14,71 14,29" fill="${c}"/>`},
  {id:'diamond',  color:'#16a085', draw:c=>`<polygon points="50,6 92,50 50,94 8,50" fill="${c}"/>`},
  {id:'crescent', color:'#f39c12', draw:c=>`<path d="M66,14 A38,38 0 1,0 66,86 A30,30 0 1,1 66,14 Z" fill="${c}"/>`},
  {id:'cross',    color:'#34495e', draw:c=>`<rect x="36" y="10" width="28" height="80" rx="5" fill="${c}"/><rect x="10" y="36" width="80" height="28" rx="5" fill="${c}"/>`}
];

function svgShape(def, color){
  return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">${def.draw(color)}</svg>`;
}

/* ==================== CONFIG ==================== */
const params = new URLSearchParams(location.search);
const FAST   = params.has('fast');
const SIMPLE = params.has('simple');

const BLOCK_TIMES = {
  1: FAST ? 5_000 : 120_000,
  2: FAST ? 8_000 : 120_000,

/* ==================== UTILS ==================== */
const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const sleep = ms => new Promise(r => setTimeout(r, ms));

let _skipResolve = null;
let _skipTimer = null;
function wait(ms){
  return new Promise(resolve => {
    _skipResolve = resolve;
    _skipTimer = setTimeout(() => {
      _skipResolve = null;
      _skipTimer = null;
      resolve();
    }, ms);
  });
}
function skipWait(){
  if(_skipResolve){
    clearTimeout(_skipTimer);
    const r = _skipResolve;
    _skipResolve = null;
    _skipTimer = null;
    r();
  }
}

function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function speak(text){
  if(!CONFIG.voice) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang='ru-RU'; u.rate=0.92; u.pitch=1.05;
    speechSynthesis.speak(u);
  }catch(e){}
}
function fmtTime(ms){
  const s = Math.round((ms||0)/1000);
  return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
}
function skillOfBlock(n){
  if(n<=2) return 'mouse';
  if(n<=4) return 'keyboard';
  return 'ui';
}
function scoreOfBlock(b){
  if('hits'   in b) return b.hits;
  if('correct'in b) return b.correct;
  return b.steps || 0;
}

/* ==================== STATE ==================== */
let state = null;

function newState(name){

    id: 'sess-' + Date.now() + '-' + Math.random().toString(36).slice(2,7),

    },

  };
}

/* ==================== STORAGE ==================== */
function loadSessions(){
  try{ return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
  catch(e){ return []; }
}
function saveSession(s){
  if(!s) return;
  const all = loadSessions();
  const i = all.findIndex(x => x.id === s.id);
  if(i >= 0) all[i] = s; else all.push(s);
  while(all.length > 64) all.shift();
  localStorage.setItem(STORAGE_KEY, JSON.stringify(all));
}
function clearSessions(){ localStorage.removeItem(STORAGE_KEY); }

/* ==================== SCREENS ==================== */
function showScreen(id){
  $$('.screen').forEach(s => s.classList.toggle('active', s.id === 'screen-' + id));
  state.screen = id;
}

/* ==================== FLOW ==================== */
async function runFlow(){
  showScreen('welcome');
  await new Promise(res => $('#start-btn').addEventListener('click', res, {once:true}));

  showScreen('rule-touch');
  speak('Экран пальцем не трогай');
  await wait(CONFIG.ruleTouchMs);
  try{ speechSynthesis.cancel(); }catch(e){}

  const order = [1,2,3,4,5,6];
  for(let i=0;i<order.length;i++){
    const n = order[i];
    if(n > 1) await runTransition(n);
    if(n === 2){
      // Грибы — две отдельные фазы, каждую можно пропустить через Tab
      await runBlock2Phase1();
      await runBlock2Phase2();
    } else {
      await runBlock(n);
    }
    await runFeedback(n);
  }

  state.finished = true;
  saveSession(state);
  showScreen('finish');
  $('#finish-mascot').innerHTML = SVG.bear;
  $('#finish-mascot').style.animation = 'wave 1s infinite alternate';
}

async function runTransition(nextBlock){
  const info = NEXT_SKILL[nextBlock];
  $('#transition-icon').innerHTML = SVG[info.icon];
  $('#transition-text').textContent = info.text;
  showScreen('transition');
  speak(info.text);
  await wait(CONFIG.transitionMs);
  try{ speechSynthesis.cancel(); }catch(e){}
}

async function runBlock(n){
  state.currentBlock = n;
  showScreen('block-' + n);
  const start = performance.now();
  const ms = BLOCK_TIMES[n];

  if(n === 1)      currentCleanup = setupBalls(ms);
  else if(n === 3 || n === 4) currentCleanup = setupKeyboardBlock(n);
  else if(n === 5) currentCleanup = setupButtonGame();
  else if(n === 6) currentCleanup = setupPicturesGame();

  speak(INSTRUCTIONS[n]);
  await wait(ms);
  state.blocks[n].ms = performance.now() - start;
  if(currentCleanup){ currentCleanup(); currentCleanup = null; }
  state.currentBlock = null;
  try{ speechSynthesis.cancel(); }catch(e){}
  saveSession(state);
}

async function runFeedback(n){
  const b = state.blocks[n];
  const minutes = Math.max(b.ms/60000, 0.05);
  const rate = scoreOfBlock(b) / minutes;
  const th = THRESHOLDS[skillOfBlock(n)];
  const ok = rate >= th;

  $('#feedback-icon').innerHTML = ok ? SVG.faceEasy : SVG.faceHard;
  $('#feedback-text').textContent = ok ? 'Молодец!' : 'Ничего, продолжим';
  showScreen('feedback');
  speak(ok ? 'Молодец' : 'Ничего страшного, продолжим');
  await wait(CONFIG.feedbackMs);
  try{ speechSynthesis.cancel(); }catch(e){}
}

/* ==================== БЛОК 1: ШАРИКИ ==================== */
function setupBalls(ms){
  const area = $('#play-area-1');
  const counterEl = $('#counter-1');
  const targetEl = $('#target-1');
  area.innerHTML = '';

  const COUNT = SIMPLE ? 4 : 6;
  const BONUS_FROM_HITS = 10;
  const BONUS_CHANCE = 0.5;

  const PALETTE = ['#ff6b6b','#4ecdc4','#ffd93d','#6bcb77','#a78bfa','#fb923c','#ec4899','#3b82f6','#22c55e','#f43f5e'];
  let targetNum = 0;
  let balls = [];
  let bonusBall = null;

  function randomPositions(n){
    const pos = [];
    const minDist = 19;
    let attempts = 0;
    while(pos.length < n && attempts < 1200){
      const x = 12 + Math.random() * 76;
      const y = 26 + Math.random() * 62;
      if(pos.every(p => Math.hypot(p.x-x, p.y-y) > minDist)) pos.push({x, y});
      attempts++;
    }
    while(pos.length < n) pos.push({x: 20 + Math.random()*60, y: 30 + Math.random()*50});
    return pos;
  }

  function activateHint(){
    balls.forEach(b => {
      if(!b.classList.contains('target')) b.classList.add('hint-mode');
    });
  }

  function newRound(){
    balls.forEach(b => b.remove());
    if(bonusBall){ bonusBall.remove(); bonusBall = null; }
    balls = [];

    const hasBonus = state.blocks[1].hits >= BONUS_FROM_HITS && Math.random() < BONUS_CHANCE;
    const total = COUNT + (hasBonus ? 1 : 0);
    const positions = randomPositions(total);

    const nums = shuffle([1,2,3,4,5,6,7,8,9]);
    const ballNums = nums.slice(0, COUNT);
    const targetIdx = Math.floor(Math.random() * COUNT);
    targetNum = ballNums[targetIdx];
    targetEl.textContent = targetNum;

    for(let i=0;i<COUNT;i++){
      const el = document.createElement('div');
      el.className = 'ball';
      el.style.left = positions[i].x + '%';
      el.style.top  = positions[i].y + '%';
      const color = PALETTE[Math.floor(Math.random()*PALETTE.length)];
      el.innerHTML = svgBall(color, ballNums[i]);
      el.dataset.num = ballNums[i];
      if(ballNums[i] === targetNum) el.classList.add('target');
      el.addEventListener('click', () => {
        state.blocks[1].clicks++;
        if(parseInt(el.dataset.num, 10) === targetNum){
          state.blocks[1].hits++;
          counterEl.textContent = state.blocks[1].hits;
          newRound();
        }
      });
      area.appendChild(el);
      balls.push(el);
    }

    if(hasBonus){
      const el = document.createElement('div');
      el.className = 'ball bonus';
      el.style.left = positions[COUNT].x + '%';
      el.style.top  = positions[COUNT].y + '%';
      el.innerHTML = SVG.bonus;
      el.addEventListener('click', () => {
        state.blocks[1].clicks++;
        activateHint();
        el.remove();
        bonusBall = null;
      });
      area.appendChild(el);
      bonusBall = el;
    }
  }

  newRound();
  return () => { area.innerHTML = ''; balls = []; bonusBall = null; };
}

/* ==================== БЛОК 2: ГРИБЫ — ФАЗА 1 ==================== */
function phaseMushroomClick(area, counterEl, promptEl){
  area.innerHTML = '';
  promptEl.textContent = 'Нажми на цветные грибы';

  const COUNT = SIMPLE ? 4 : 6;
  const GOLD_MS = 5000;
  const positions = [
    {x:15,y:30},{x:50,y:25},{x:85,y:30},
    {x:15,y:72},{x:50,y:78},{x:85,y:72}
  ];
  const ps = shuffle(positions).slice(0, COUNT);

  const mushrooms = [];
  let clickedThisRound = new Set();
  let goldIdxs = [];
  let blueIdx = -1;
  let extraGoldNextRound = 0;
  let roundTimer = null;
  let stopped = false;

  function renderMushroom(el, kind){ el.innerHTML = svgMushroom(kind); }

  function newRound(){
    if(stopped) return;
    if(roundTimer) clearTimeout(roundTimer);
    clickedThisRound.clear();
    blueIdx = -1;

    mushrooms.forEach(m => {
      m.classList.remove('gold','blue','done');
      renderMushroom(m, 'normal');
    });

    // Кол-во золотых: базово 2, плюс бонус с прошлого синего гриба
    const goldCount = Math.min(2 + extraGoldNextRound, COUNT - 1);
    extraGoldNextRound = 0;

    const idxs = shuffle([...Array(COUNT).keys()]).slice(0, goldCount);
    goldIdxs = idxs;
    idxs.forEach(i => {
      mushrooms[i].classList.add('gold');
      renderMushroom(mushrooms[i], 'gold');
    });

    // После 10 очков иногда появляется синий гриб среди не-золотых
    if(state.blocks[2].hits >= 10 && Math.random() < 0.45){
      const nonGold = [...Array(COUNT).keys()].filter(i => !idxs.includes(i));
      if(nonGold.length){
        blueIdx = nonGold[Math.floor(Math.random() * nonGold.length)];
        mushrooms[blueIdx].classList.add('blue');
        renderMushroom(mushrooms[blueIdx], 'blue');
      }
    }

    roundTimer = setTimeout(() => {
      if(stopped) return;
      idxs.forEach(i => {
        if(mushrooms[i]){
          mushrooms[i].classList.remove('gold');
          renderMushroom(mushrooms[i], 'normal');
        }
      });
      if(blueIdx >= 0 && mushrooms[blueIdx]){
        mushrooms[blueIdx].classList.remove('blue');
        renderMushroom(mushrooms[blueIdx], 'normal');
        blueIdx = -1;
      }
      setTimeout(newRound, 400);
    }, GOLD_MS);
  }

  for(let i=0;i<COUNT;i++){
    const el = document.createElement('div');
    el.className = 'mushroom';
    el.style.left = ps[i].x + '%';
    el.style.top  = ps[i].y + '%';
    el.dataset.idx = i;
    renderMushroom(el, 'normal');
    el.addEventListener('click', () => {
      state.blocks[2].clicks = (state.blocks[2].clicks||0) + 1;

      // Синий гриб — клик даёт бонус: больше золотых в следующем раунде
      if(i === blueIdx && el.classList.contains('blue')){
        extraGoldNextRound = 1 + Math.floor(Math.random() * 2);  // 1 или 2
        el.classList.remove('blue');
        renderMushroom(el, 'normal');
        blueIdx = -1;
        return;
      }

      if(!el.classList.contains('gold')) return;
      if(clickedThisRound.has(i)) return;
      clickedThisRound.add(i);
      el.classList.add('done');
      if(clickedThisRound.size >= goldIdxs.length){
        state.blocks[2].hits++;
        counterEl.textContent = state.blocks[2].hits;
        if(roundTimer) clearTimeout(roundTimer);
        setTimeout(newRound, 300);
      }
    });
    area.appendChild(el);
    mushrooms.push(el);
  }

  setTimeout(newRound, 600);

  return () => {
    stopped = true;
    if(roundTimer) clearTimeout(roundTimer);
    area.innerHTML = '';
  };
}

/* ==================== БЛОК 2: ГРИБЫ — ФАЗА 2 ==================== */
function phaseMushroomDrag(area, counterEl, promptEl){
  area.innerHTML = '';
  promptEl.textContent = 'Перетащи грибы в корзину';

  const GOLD_MS = 10000;

  const basket = document.createElement('div');
  basket.className = 'basket';
  basket.style.left = '50%';
  basket.style.top  = '55%';
  basket.innerHTML = SVG.basket;
  area.appendChild(basket);

  const COUNT = SIMPLE ? 4 : 6;
  const positions = [
    {x:12,y:25},{x:88,y:25},{x:12,y:80},
    {x:88,y:80},{x:50,y:15},{x:50,y:90}
  ];

  let mushrooms = [];
  let goldTimer = null;
  let dragTarget = null;
  let dragOffset = {x:0,y:0};
  let stopped = false;

  function renderMushroom(el, kind){ el.innerHTML = svgMushroom(kind); }

  function pickGolds(){
    if(stopped) return;
    mushrooms.forEach(m => {
      m.classList.remove('gold');
      renderMushroom(m, 'normal');
    });
    const chosen = shuffle(mushrooms).slice(0, Math.min(2, mushrooms.length));
    chosen.forEach(m => {
      m.classList.add('gold');
      renderMushroom(m, 'gold');
    });
    if(goldTimer) clearTimeout(goldTimer);
    goldTimer = setTimeout(() => {
      if(stopped) return;
      mushrooms.forEach(m => {
        m.classList.remove('gold');
        renderMushroom(m, 'normal');
      });
      setTimeout(() => {
        if(stopped) return;
        if(mushrooms.length < 4) spawnAll();
        else pickGolds();
      }, 400);
    }, GOLD_MS);
  }

  function spawnAll(){
    if(stopped) return;
    mushrooms.forEach(m => m.remove());
    mushrooms = [];
    const ps = shuffle(positions).slice(0, COUNT);
    for(let i=0;i<COUNT;i++){
      const el = document.createElement('div');
      el.className = 'mushroom drag';
      el.style.left = ps[i].x + '%';
      el.style.top  = ps[i].y + '%';
      renderMushroom(el, 'normal');
      area.appendChild(el);
      mushrooms.push(el);
    }
    pickGolds();
  }

  function onDown(e){
    if(stopped) return;
    const m = e.target.closest('.mushroom.drag');
    if(!m || !m.classList.contains('gold')) return;
    e.preventDefault();
    dragTarget = m;
    const rect = m.getBoundingClientRect();
    dragOffset.x = e.clientX - rect.left - rect.width/2;
    dragOffset.y = e.clientY - rect.top - rect.height/2;
    m.classList.add('dragging');
    m.style.position = 'fixed';
    m.style.zIndex = 200;
  }

  function onMove(e){
    if(!dragTarget) return;
    dragTarget.style.left = (e.clientX - dragOffset.x) + 'px';
    dragTarget.style.top  = (e.clientY - dragOffset.y) + 'px';
  }

  function onUp(e){
    if(!dragTarget) return;
    const bRect = basket.getBoundingClientRect();
    const mRect = dragTarget.getBoundingClientRect();
    const cx = mRect.left + mRect.width/2;
    const cy = mRect.top + mRect.height/2;
    const over = cx > bRect.left && cx < bRect.right && cy > bRect.top && cy < bRect.bottom;

    if(over){
      // Каждый гриб, попавший в корзину = +1
      state.blocks[2].hits++;
      counterEl.textContent = state.blocks[2].hits;
      const idx = mushrooms.indexOf(dragTarget);
      dragTarget.remove();
      if(idx >= 0) mushrooms.splice(idx, 1);
      dragTarget = null;
      const remainingGold = mushrooms.filter(m => m.classList.contains('gold'));
      if(remainingGold.length === 0){
        if(goldTimer) clearTimeout(goldTimer);
        if(mushrooms.length < 4) spawnAll();
        else pickGolds();
      }
    } else {
      dragTarget.classList.remove('dragging');
      dragTarget.style.position = 'absolute';
      dragTarget.style.zIndex = '';
      dragTarget.style.left = (12 + Math.random()*76) + '%';
      dragTarget.style.top  = (20 + Math.random()*65) + '%';
      dragTarget = null;
    }
  }

  area.addEventListener('mousedown', onDown);
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);

  spawnAll();

  return () => {
    stopped = true;
    if(goldTimer) clearTimeout(goldTimer);
    area.removeEventListener('mousedown', onDown);
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    dragTarget = null;
    area.innerHTML = '';
  };
}

/* ==================== БЛОКИ 3–4: КЛАВИАТУРА ==================== */
function setupKeyboardBlock(n){
  const list = n === 3 ? WORDS_3_5 : WORDS_4_7;
  let idx = Math.floor(Math.random()*list.length);
  let word = list[idx];
  let typed = 0;

  const wordEl  = $('#word-' + n);
  const typedEl = $('#typed-' + n);
  const counterEl = $('#counter-' + n);

  function render(){
    wordEl.innerHTML = [...word].map((ch,i) => {
      if(i < typed)  return `<span class="done">${ch}</span>`;
      if(i === typed) return `<span class="current">${ch}</span>`;
      return `<span>${ch}</span>`;
    }).join('');
    typedEl.textContent = word.slice(0, typed);
  }

  function nextWord(){
    idx = (idx + 1) % list.length;
    word = list[idx];
    typed = 0;
    render();
  }

  keyHandler = e => {
    if(state.currentBlock !== n) return;
    if(e.key === 'Backspace'){
      e.preventDefault();
      if(typed > 0){ typed--; render(); }
      return;
    }
    if(e.key.length === 1){
      const ch = e.key.toUpperCase();
      if(ch === word[typed]){
        e.preventDefault();
        typed++;
        state.blocks[n].correct++;
        counterEl.textContent = state.blocks[n].correct;
        render();
        if(typed === word.length){
          setTimeout(() => { if(state.currentBlock === n) nextWord(); }, 320);
        }
      } else if(/[А-ЯЁ]/i.test(e.key)){
        e.preventDefault();
      }
    }
  };
  document.addEventListener('keydown', keyHandler);
  render();

  return () => {
    if(keyHandler){ document.removeEventListener('keydown', keyHandler); keyHandler = null; }
  };
}

/* ==================== БЛОК 5: КНОПКА + ПРИЗ ==================== */
function setupButtonGame(){
  const screen = $('#screen-block-5');
  const btn = $('#btn-5');
  const counterEl = $('#counter-5');

  let currentLabel = '';
  let timerId = null;
  let correctClicks = 0;
  let inPrizeMode = false;
  let stopped = false;
  let prizeTimers = [];

  function clearPrizeTimers(){
    prizeTimers.forEach(t => clearTimeout(t));
    prizeTimers = [];
  }

  function respawn(){
    if(stopped || inPrizeMode) return;
    if(timerId) clearTimeout(timerId);

    if(correctClicks >= 10 && Math.random() < 0.5){
      showPrizeButton();
      return;
    }

    const x = 12 + Math.random() * 76;
    const y = 28 + Math.random() * 60;
    btn.style.left = x + '%';
    btn.style.top  = y + '%';
    btn.style.display = '';
    btn.classList.remove('prize');
    currentLabel = Math.random() < 0.5 ? 'Нажми' : 'Не нажимай';
    btn.textContent = currentLabel;
    btn.classList.toggle('dont', currentLabel === 'Не нажимай');

    timerId = setTimeout(() => {
      if(stopped || inPrizeMode) return;
      if(currentLabel === 'Не нажимай'){
        state.blocks[5].hits++;
        counterEl.textContent = state.blocks[5].hits;
      }
      respawn();
    }, 3000);
  }

  function showPrizeButton(){
    const x = 12 + Math.random() * 76;
    const y = 28 + Math.random() * 60;
    btn.style.left = x + '%';
    btn.style.top  = y + '%';
    btn.style.display = '';
    btn.textContent = 'ПРИЗ';
    btn.classList.remove('dont');
    btn.classList.add('prize');
    currentLabel = 'ПРИЗ';

    timerId = setTimeout(() => {
      if(stopped || inPrizeMode) return;
      respawn();
    }, 3000);
  }

  function startPrizeMode(){
    inPrizeMode = true;
    if(timerId) clearTimeout(timerId);
    btn.style.display = 'none';
    btn.classList.remove('prize', 'dont');

    const labels = [];
    for(let i=0;i<20;i++) labels.push(i % 2 === 0 ? 'Нажми' : 'Не нажимай');
    const shuffled = shuffle(labels);

    const buttons = [];
    const positions = [];

    function tryPos(){
      for(let tries=0; tries<60; tries++){
        const x = 8 + Math.random() * 84;
        const y = 15 + Math.random() * 75;
        let ok = true;
        for(const p of positions){
          if(Math.hypot(p.x-x, p.y-y) < 11){ ok = false; break; }
        }
        if(ok){ positions.push({x,y}); return {x,y}; }
      }
      const x = 8 + Math.random() * 84;
      const y = 15 + Math.random() * 75;
      positions.push({x,y});
      return {x,y};
    }

    shuffled.forEach(label => {
      const b = document.createElement('button');
      b.className = 'prize-btn' + (label === 'Не нажимай' ? ' dont' : '');
      b.textContent = label;
      b.dataset.label = label;
      const pos = tryPos();
      b.style.left = pos.x + '%';
      b.style.top  = pos.y + '%';
      b.addEventListener('click', (e) => {
        e.stopPropagation();
        if(stopped || b.dataset.done) return;
        b.dataset.done = '1';
        if(label === 'Нажми'){
          state.blocks[5].hits++;
          counterEl.textContent = state.blocks[5].hits;
          b.classList.add('clicked');
        } else {
          b.classList.add('miss');
        }
        b.disabled = true;
      });
      screen.appendChild(b);
      buttons.push(b);
    });

    const t1 = setTimeout(() => {
      if(stopped){ return; }
      const alive = buttons.filter(b => screen.contains(b));
      if(alive.length === 0){ finishPrizeMode(); return; }
      const keepIdx = Math.floor(Math.random() * alive.length);
      alive.forEach((b, i) => { if(i !== keepIdx) b.remove(); });
      const kept = alive[keepIdx];

      kept.style.left = '50%';
      kept.style.top = '50%';
      kept.style.transform = 'translate(-50%,-50%) scale(1.6)';
      kept.disabled = false;
      kept.dataset.done = '';
      kept.classList.remove('clicked', 'miss');

      const onKeptClick = (e) => {
        e.stopPropagation();
        if(stopped || kept.dataset.done) return;
        kept.dataset.done = '1';
        if(kept.dataset.label === 'Нажми'){
          state.blocks[5].hits++;
          counterEl.textContent = state.blocks[5].hits;
        }
        kept.remove();
        finishPrizeMode();
      };
      kept.onclick = onKeptClick;

      const t2 = setTimeout(() => {
        if(stopped) return;
        if(!kept.dataset.done && kept.dataset.label === 'Не нажимай'){
          state.blocks[5].hits++;
          counterEl.textContent = state.blocks[5].hits;
        }
        if(screen.contains(kept)) kept.remove();
        finishPrizeMode();
      }, 3000);
      prizeTimers.push(t2);
    }, 6000);
    prizeTimers.push(t1);
  }

  function finishPrizeMode(){
    if(stopped) return;
    clearPrizeTimers();
    screen.querySelectorAll('.prize-btn').forEach(b => b.remove());
    inPrizeMode = false;
    correctClicks = 0;
    btn.style.display = '';
    btn.classList.remove('prize', 'dont');
    respawn();
  }

  const onClick = () => {
    if(stopped || state.currentBlock !== 5) return;
    if(currentLabel === 'ПРИЗ'){
      startPrizeMode();
      return;
    }
    if(currentLabel === 'Нажми'){
      state.blocks[5].hits++;
      correctClicks++;
      counterEl.textContent = state.blocks[5].hits;
    }
    respawn();
  };

  btn.addEventListener('click', onClick);
  respawn();

  return () => {
    stopped = true;
    if(timerId) clearTimeout(timerId);
    clearPrizeTimers();
    btn.removeEventListener('click', onClick);
    screen.querySelectorAll('.prize-btn').forEach(b => b.remove());
    btn.style.display = '';
    btn.classList.remove('prize', 'dont');
    btn.textContent = 'Нажми';
    btn.style.left = '50%';
    btn.style.top = '50%';
  };
}

/* ==================== БЛОК 6: ПАРА КАРТИНОК ==================== */
function setupPicturesGame(){
  const grid = $('#grid-6');
  const counterEl = $('#counter-6');
  let roundTimer = null;
  let stopped = false;
  const ROUND_MS = 5000;

  function newRound(){
    if(stopped) return;
    if(roundTimer) clearTimeout(roundTimer);
    grid.innerHTML = '';

    // Карта цветов: id формы -> цвет
    const colorMap = {};
    SHAPE_DEFS.forEach(s => colorMap[s.id] = s.color);

    // После 10 очков иногда два случайных цвета меняются местами
    if(state.blocks[6].hits >= 10 && Math.random() < 0.5){
      const ids = SHAPE_DEFS.map(s => s.id);
      const i1 = Math.floor(Math.random() * ids.length);
      let i2 = Math.floor(Math.random() * ids.length);
      while(i2 === i1) i2 = Math.floor(Math.random() * ids.length);
      const a = ids[i1], b = ids[i2];
      const tmp = colorMap[a];
      colorMap[a] = colorMap[b];
      colorMap[b] = tmp;
    }

    const shuffled = shuffle(SHAPE_DEFS);
    const pairShape = shuffled[0];
    const others = shuffled.slice(1, 9);
    const all = shuffle([pairShape, pairShape, ...others]).slice(0, 9);

    all.forEach(shape => {
      const el = document.createElement('button');
      el.className = 'pic-opt';
      el.innerHTML = svgShape(shape, colorMap[shape.id]);
      el.dataset.id = shape.id;
      el.addEventListener('click', () => {
        if(stopped) return;
        if(el.classList.contains('correct') || el.classList.contains('wrong')) return;
        if(shape.id === pairShape.id){
          el.classList.add('correct');
          const corrects = grid.querySelectorAll('.pic-opt.correct');
          if(corrects.length === 2){
            state.blocks[6].hits++;
            counterEl.textContent = state.blocks[6].hits;
            if(roundTimer) clearTimeout(roundTimer);
            setTimeout(newRound, 500);
          }
        } else {
          el.classList.add('wrong');
        }
      });
      grid.appendChild(el);
    });

    roundTimer = setTimeout(newRound, ROUND_MS);
  }

  newRound();
  return () => {
    stopped = true;
    if(roundTimer) clearTimeout(roundTimer);
    grid.innerHTML = '';
  };
}

/* ==================== MARKS ==================== */
function markFor(ratePerMin, threshold){
  if(ratePerMin >= threshold) return 'success';
  if(ratePerMin >= threshold * 0.6) return 'partial';
  return 'help';
}
function aggregateSkill(session, skill){
  let score = 0, ms = 0, clicks = 0;
  const blocks = skill === 'mouse' ? [1,2] : skill === 'keyboard' ? [3,4] : [5,6];
  for(const n of blocks){
    const b = session.blocks[n];
    score += scoreOfBlock(b);
    ms += b.ms || 0;
    clicks += b.clicks || 0;
  }
  const minutes = Math.max(ms/60000, 0.05);
  return { score, ms, clicks, rate: score / minutes };
}
function computeMarks(session){
  const m = {};
  for(const skill of ['mouse','keyboard','ui']){
    const ov = session.overrides && session.overrides[skill];
    if(ov){ m[skill] = ov; continue; }
    const a = aggregateSkill(session, skill);
    m[skill] = markFor(a.rate, THRESHOLDS[skill]);
  }
  return m;
}
function reachedReference(session, skill){
  return aggregateSkill(session, skill).rate >= REFERENCE[skill];
}

/* ==================== TEACHER PANEL ==================== */
function openTeacher(){ $('#teacher').classList.add('active'); renderTeacher(); }
function closeTeacher(){ $('#teacher').classList.remove('active'); }
function markDot(mark){ return `<span class="mark ${mark}" title="${mark}"></span>`; }

function renderTeacher(){
  const all = loadSessions();
  const last8 = all.slice(-8);
  const simpleNext = localStorage.getItem(SIMPLE_KEY) === '1';

  const skills = [
    {key:'mouse',    label:'Мышь'},
    {key:'keyboard', label:'Клавиатура'},
    {key:'ui',       label:'Интерфейс'}
  ];

  let html = '<h2>Панель учителя</h2>';
  html += `<div class="tools">
    <button id="t-export">export-csv</button>
    <button id="t-print">print-report</button>
    <button id="t-new">Новая сессия</button>
    <button id="t-simple">${simpleNext ? 'Упрощённая ветка: ВКЛ' : 'Упрощённая ветка: выкл'}</button>
    <button id="t-clear">Очистить всё</button>
    <button id="t-close">Закрыть</button>
  </div>`;
  html += '<p style="color:#9fb3d8;margin-bottom:1rem">Tab — пропустить текущий этап (фазы грибов пропускаются отдельно). Ctrl+Shift+T — эта панель. Esc — закрыть.</p>';

  html += '<h3>Последние сессии (до 8)</h3>';
  if(!last8.length){
    html += '<p class="empty">Пока нет ни одной завершённой сессии.</p>';
  } else {
    html += '<table><thead><tr><th>Ученик</th>';
    for(const s of skills) html += `<th>${s.label}<br><small>попытки / время / отметка</small></th>`;
    html += '<th>Дата</th></tr></thead><tbody>';
    for(const sess of last8){
      const marks = computeMarks(sess);
      const name = sess.childName || 'Ученик';
      html += `<tr><td>${escapeHtml(name)}</td>`;
      for(const s of skills){
        const a = aggregateSkill(sess, s.key);
        const scoreLabel = s.key === 'mouse' ? `${a.score}/${a.clicks}` : `${a.score}`;
        html += `<td>${scoreLabel} / ${fmtTime(a.ms)} / ${markDot(marks[s.key])}</td>`;
      }
      html += `<td>${(sess.date||'').slice(0,16).replace('T',' ')}</td></tr>`;
    }
    html += '</tbody></table>';
  }

  html += '<h3>Сводка по группе</h3>';
  if(last8.length){
    const total = last8.length;
    html += '<table><thead><tr><th>Показатель</th>';
    for(const s of skills) html += `<th>${s.label}</th>`;
    html += '</tr></thead><tbody>';

    for(const [label, test] of [
      ['Доля «успешно»', m => m === 'success'],
      ['Доля «частично»', m => m === 'partial'],
      ['Доля «требуется помощь»', m => m === 'help']
    ]){
      html += `<tr><td>${label}</td>`;
      for(const s of skills){
        const n = last8.filter(x => test(computeMarks(x)[s.key])).length;
        const pct = Math.round((n/total)*100/12.5)*12.5;
        html += `<td class="pct">${pct}%</td>`;
      }
      html += '</tr>';
    }

    html += '<tr><td><b>Референс модуля (20/15/15)</b></td>';
    for(const s of skills){
      const n = last8.filter(x => reachedReference(x, s.key)).length;
      const pct = Math.round((n/total)*100/12.5)*12.5;
      html += `<td class="pct"><b>${pct}%</b></td>`;
    }
    html += '</tr></tbody></table>';
  } else {
    html += '<p class="empty">Нет данных для сводки.</p>';
  }

  html += '<h3>Ручное перевыставление отметки</h3>';
  html += '<div class="row"><select id="ov-session">';
  for(const s of last8){
    html += `<option value="${s.id}">${escapeHtml(s.childName || 'Ученик')} — ${(s.date||'').slice(0,16).replace('T',' ')}</option>`;
  }
  html += `</select>
    <select id="ov-skill">
      <option value="mouse">Мышь</option>
      <option value="keyboard">Клавиатура</option>
      <option value="ui">Интерфейс</option>
    </select>
    <select id="ov-mark">
      <option value="success">успешно</option>
      <option value="partial">частично</option>
      <option value="help">требуется помощь</option>
      <option value="">сбросить (авто)</option>
    </select>
    <button id="ov-apply">Применить</button>
  </div>`;

  $('#teacher').innerHTML = html;

  $('#t-export').onclick = exportCSV;
  $('#t-print').onclick  = () => window.print();
  $('#t-new').onclick    = () => { closeTeacher(); startNewSession(); };
  $('#t-simple').onclick = () => {
    const cur = localStorage.getItem(SIMPLE_KEY) === '1';
    localStorage.setItem(SIMPLE_KEY, cur ? '0' : '1');
    renderTeacher();
  };
  $('#t-clear').onclick  = () => {
    if(confirm('Удалить все сохранённые сессии?')){ clearSessions(); renderTeacher(); }
  };
  $('#t-close').onclick  = closeTeacher;
  $('#ov-apply').onclick = applyOverride;
}

function applyOverride(){
  const id = $('#ov-session').value;
  const skill = $('#ov-skill').value;
  const mark = $('#ov-mark').value;
  const all = loadSessions();
  const s = all.find(x => x.id === id);
  if(!s) return;
  s.overrides = s.overrides || {};
  if(mark) s.overrides[skill] = mark;
  else     delete s.overrides[skill];
  localStorage.setItem(STORAGE_KEY, JSON.stringify(all));
  renderTeacher();
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

/* ==================== EXPORT ==================== */
function exportCSV(){
  const all = loadSessions().slice(-8);
  const header = [
    'date','session_id',
    'mouse_score','mouse_clicks','mouse_time','mouse_mark',
    'keyboard_score','keyboard_time','keyboard_mark',
    'ui_score','ui_time','ui_mark'
  ];
  const rows = [header];
  for(const s of all){
    const m = computeMarks(s);
    const a1 = aggregateSkill(s, 'mouse');
    const a2 = aggregateSkill(s, 'keyboard');
    const a3 = aggregateSkill(s, 'ui');
    rows.push([
      (s.date||'').slice(0,19).replace('T',' '),
      s.id,
      a1.score, a1.clicks, fmtTime(a1.ms), m.mouse,
      a2.score, fmtTime(a2.ms), m.keyboard,
      a3.score, fmtTime(a3.ms), m.ui
    ]);
  }
  const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\r\n');
  const blob = new Blob(['\ufeff' + csv], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'report-' + new Date().toISOString().slice(0,10) + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
