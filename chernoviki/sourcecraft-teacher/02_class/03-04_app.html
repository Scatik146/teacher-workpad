<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Открытка ко Дню учителя</title>
<style>
  /* ---------- Общие настройки ---------- */
  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 24px 16px 60px;
    background: #fff7e8;
    color: #4a2c12;
    font-family: "Verdana", "Segoe UI", sans-serif;
    font-size: 20px;
    line-height: 1.5;
  }

  h1 {
    text-align: center;
    font-size: 32px;
    margin: 0 0 24px;
    color: #a2541a;
  }

  .panel {
    max-width: 860px;
    margin: 0 auto 26px;
    background: #fffdf6;
    border: 3px solid #f0c48a;
    border-radius: 18px;
    padding: 20px 22px;
    box-shadow: 0 4px 0 #ecd3ab;
  }

  label {
    display: block;
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 8px;
    color: #7a3f10;
  }

  textarea, input[type="number"] {
    width: 100%;
    font-family: inherit;
    font-size: 22px;
    color: #3b2109;
    background: #ffffff;
    border: 3px solid #e0a458;
    border-radius: 12px;
    padding: 10px 12px;
  }

  textarea { resize: vertical; }

  .hint {
    font-size: 18px;
    color: #8a6337;
    margin: 6px 0 18px;
  }

  .error {
    color: #c0392b;
    font-size: 19px;
    font-weight: bold;
    margin-top: 10px;
    min-height: 26px;
  }

  /* ---------- Число-ключ ---------- */
  .key-row {
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }

  input[type="range"] {
    flex: 1 1 260px;
    height: 34px;
    accent-color: #e07a2f;
  }

  input[type="number"] { width: 110px; text-align: center; }

  /* ---------- Кнопки ---------- */
  button, .btn-file {
    font-family: inherit;
    font-size: 21px;
    font-weight: bold;
    color: #ffffff;
    background: #e07a2f;
    border: none;
    border-radius: 14px;
    padding: 12px 22px;
    cursor: pointer;
    box-shadow: 0 4px 0 #b95c19;
    display: inline-block;
  }

  button:active, .btn-file:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 #b95c19;
  }

  button.big {
    display: block;
    width: 100%;
    margin-top: 18px;
    font-size: 24px;
    padding: 14px 22px;
  }

  .buttons {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 18px;
  }

  /* Зелёная кнопка загрузки фона — другого размера */
  .btn-file {
    background: #3d9a3d;
    box-shadow: 0 4px 0 #276b27;
    font-size: 18px;
    padding: 10px 16px;
  }
  .btn-file:active {
    box-shadow: 0 1px 0 #276b27;
  }

  /* Скрытое поле выбора файла — нажимаем на красивую кнопку */
  #bgFile { display: none; }

  /* ---------- Открытка ---------- */
  .postcard {
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    min-height: 400px;
    border: 8px double #d98c3f;
    border-radius: 16px;
    background-color: #fffdf5;
    background-image:
      radial-gradient(circle at 12% 12%, #ffe9c7 0%, rgba(255,233,199,0) 42%),
      radial-gradient(circle at 88% 88%, #ffe0d0 0%, rgba(255,224,208,0) 42%);
  }

  /* Картинка-фон: пропорционально вписывается в размеры открытки */
  .pc-bg {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    object-position: center;
    display: none;
    z-index: 0;
  }
  .pc-bg.visible { display: block; }

  /* Светлая плёнка поверх картинки — чтобы текст читался */
  .pc-dim {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    background: rgba(255, 253, 245, 0.72);
    display: none;
    z-index: 1;
  }
  .pc-dim.visible { display: block; }

  /* Содержимое открытки — поверх картинки */
  .pc-content {
    position: relative;
    z-index: 2;
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 26px 26px 130px;
    text-align: center;
  }

  .pc-deco {
    font-size: 26px;
    letter-spacing: 8px;
    margin-bottom: 10px;
  }

  .pc-title {
    font-size: 28px;
    font-weight: bold;
    color: #a2541a;
    margin-bottom: 18px;
  }

  .pc-text {
    flex: 1;
    font-size: 30px;
    font-weight: bold;
    letter-spacing: 2px;
    word-break: break-word;
    color: #3b2109;
  }

  .pc-sign {
    margin-top: 22px;
    margin-right: 110px;
    text-align: left;
    font-size: 20px;
    color: #6b4520;
    line-height: 2;
  }

  .pc-key {
    position: absolute;
    right: 20px;
    bottom: 20px;
    width: 96px;
    height: 96px;
    border-radius: 50%;
    background: #f6c453;
    border: 4px solid #b9752a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #4a2c12;
  }

  .pc-key span { font-size: 14px; }
  .pc-key b { font-size: 34px; line-height: 1; }

  .pc-key.hidden { display: none; }

  /* ---------- Результат самопроверки ---------- */
  .result {
    margin-top: 16px;
    padding: 14px;
    min-height: 60px;
    font-size: 24px;
    font-weight: bold;
    color: #2f6b2f;
    background: #f2fbe9;
    border: 3px dashed #a9d18a;
    border-radius: 12px;
    word-break: break-word;
  }

  /* ---------- Печать: альбомный лист, цветная ---------- */
  @media print {
    @page {
      size: A4 landscape;
      margin: 1.2cm;
    }

    * {
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
      color-adjust: exact !important;
    }

    body {
      background: #ffffff;
      padding: 0;
      font-size: 18px;
    }

    .no-print { display: none !important; }

    .panel {
      max-width: none;
      margin: 0;
      padding: 0;
      border: none;
      box-shadow: none;
      background: none;
    }

    .postcard {
      min-height: 0;
      height: 17.5cm;
      box-shadow: none;
    }

    .pc-content {
      min-height: 0;
    }
  }
</style>
</head>
<body>

<h1 class="no-print">Открытка ко Дню учителя 🍁</h1>

<!-- 1. Послание и число-ключ -->
<section class="panel no-print">
  <label for="message">Напиши послание</label>
  <textarea id="message" rows="3"
    placeholder="Например: ДОРОГАЯ АННА ПЕТРОВНА ПОЗДРАВЛЯЕМ С ПРАЗДНИКОМ"></textarea>
  <div class="hint" id="wordHint">Слов: 0 из 10</div>

  <label for="keyRange">Выбери число-ключ (от 1 до 16)</label>
  <div class="key-row">
    <input type="range" id="keyRange" min="1" max="16" value="3">
    <input type="number" id="keyNum" min="1" max="16" value="3">
  </div>

  <button class="big" id="btnEncode">Закодировать</button>
  <div class="error" id="error"></div>
</section>

<!-- 2. Открытка -->
<section class="panel">
  <div class="postcard" id="postcard">
    <img class="pc-bg" id="pcBg" alt="">
    <div class="pc-dim" id="pcDim"></div>
    <div class="pc-content">
      <div class="pc-deco">🍁 🍂 🍁</div>
      <div class="pc-title">С Днём учителя!</div>
      <div class="pc-text" id="pcText">Здесь появится твоё послание…</div>
      <div class="pc-sign">
        <div>Учителю: ______________________</div>
        <div>От: ______________________</div>
      </div>
      <div class="pc-key" id="pcKey">
        <span>Ключ</span>
        <b id="keyValue">3</b>
      </div>
    </div>
  </div>

  <div class="buttons no-print">
    <label class="btn-file" for="bgFile">Загрузить фон (jpg)</label>
    <input type="file" id="bgFile" accept=".jpg,.jpeg,image/jpeg">
    <button id="btnHideKey">Показать без ключа</button>
    <button id="btnPrint">Распечатать</button>
  </div>
</section>

<!-- 3. Самопроверка -->
<section class="panel no-print">
  <label for="coded">Раскодировать: вставь закодированный текст</label>
  <textarea id="coded" rows="3" placeholder="Например: НБНБ"></textarea>
  <button class="big" id="btnDecode">Раскодировать</button>
  <div class="result" id="decoded">Тут появится твоё послание.</div>
</section>

<script>
  /* Русский алфавит: 33 буквы */
  const ALPHABET = "АБВГДЕЁЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯ";

  /* Сдвиг каждой буквы на k позиций вперёд (k может быть отрицательным) */
  function shift(text, k) {
    let out = "";
    for (const ch of text.toUpperCase()) {
      const i = ALPHABET.indexOf(ch);
      out += (i === -1) ? ch : ALPHABET[((i + k) % 33 + 33) % 33];
    }
    return out;
  }

  const messageEl = document.getElementById("message");
  const wordHint = document.getElementById("wordHint");
  const keyRange = document.getElementById("keyRange");
  const keyNum = document.getElementById("keyNum");
  const keyValue = document.getElementById("keyValue");
  const pcBg = document.getElementById("pcBg");
  const pcDim = document.getElementById("pcDim");
  const pcText = document.getElementById("pcText");
  const pcKey = document.getElementById("pcKey");
  const codedEl = document.getElementById("coded");
  const decodedEl = document.getElementById("decoded");
  const errorEl = document.getElementById("error");

  let lastPlain = null;

  function getKey() {
    return parseInt(keyNum.value, 10) || 1;
  }

  function countWords(text) {
    const t = text.trim();
    return t === "" ? 0 : t.split(/\s+/).length;
  }

  messageEl.addEventListener("input", () => {
    const n = countWords(messageEl.value);
    wordHint.textContent = "Слов: " + n + " из 10";
    wordHint.style.color = n > 10 ? "#c0392b" : "#8a6337";
  });

  keyRange.addEventListener("input", () => {
    keyNum.value = keyRange.value;
    onKeyChange();
  });

  keyNum.addEventListener("input", () => {
    let v = parseInt(keyNum.value, 10);
    if (isNaN(v)) return;
    if (v < 1) v = 1;
    if (v > 16) v = 16;
    keyNum.value = v;
    keyRange.value = v;
    onKeyChange();
  });

  function onKeyChange() {
    keyValue.textContent = getKey();
    if (lastPlain !== null) {
      const coded = shift(lastPlain, getKey());
      pcText.textContent = coded;
      codedEl.value = coded;
    }
  }

  document.getElementById("btnEncode").addEventListener("click", () => {
    const text = messageEl.value.trim();

    if (text === "") {
      errorEl.textContent = "Сначала напиши послание.";
      return;
    }
    if (countWords(text) > 10) {
      errorEl.textContent = "Слишком много слов! Оставь не больше 10 слов.";
      return;
    }
    errorEl.textContent = "";

    lastPlain = text;
    const coded = shift(text, getKey());
    pcText.textContent = coded;
    codedEl.value = coded;
    keyValue.textContent = getKey();
    pcKey.classList.remove("hidden");
  });

  document.getElementById("btnDecode").addEventListener("click", () => {
    const text = codedEl.value.trim();
    if (text === "") {
      decodedEl.textContent = "Сначала вставь закодированный текст.";
      return;
    }
    decodedEl.textContent = shift(text, -getKey());
  });

  const btnHideKey = document.getElementById("btnHideKey");
  btnHideKey.addEventListener("click", () => {
    const hidden = pcKey.classList.toggle("hidden");
    btnHideKey.textContent = hidden ? "Вернуть ключ на место" : "Показать без ключа";
  });

  document.getElementById("btnPrint").addEventListener("click", () => {
    window.print();
  });

  /* Загрузка фона открытки из файла .jpg */
  document.getElementById("bgFile").addEventListener("change", (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = (ev) => {
      pcBg.src = ev.target.result;
      pcBg.classList.add("visible");
      pcDim.classList.add("visible");
    };
    reader.readAsDataURL(file);

    e.target.value = "";
  });
</script>

</body>
</html>
