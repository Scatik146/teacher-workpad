<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Рабочий стол учителя</title>
<link rel="stylesheet" href="site.css">
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <h1><svg viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="9" width="26" height="19" rx="4" fill="#f2a93b"/><rect x="3" y="9" width="26" height="6" fill="#d48a1f"/><path d="M11 9V6a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v3" fill="none" stroke="#a9b2bc" stroke-width="2.5"/><rect x="14" y="13" width="4" height="4" rx="1" fill="#1f2329"/></svg>Рабочий стол учителя</h1>
      <a class="toplink" href="dlya-uchitelya.html">Для учителя →</a>
    </div>
    <p>Приложения к урокам. Каждое открывается в браузере и работает без интернета.</p>
    <div class="tools" id="fSubj"></div>
    <div class="tools" id="fGrade"></div>
  </div>
</header>
<main><div class="wrap" id="list"></div></main>

<script src="lessons.js"></script>
<script>
TWP.mount({
  key: 'twp',
  emptyText: 'Под этот фильтр пока нет уроков',
  pool: TWP.apps,
  card: (l, p) => `<article class="card" style="--c:${TWP.subj(p.s).color}">
    ${TWP.meta(l, p)}
    <h3>${TWP.esc(l.title)}</h3>
    <p class="topic">Тема: ${TWP.esc(l.topic)}</p>
    <p>${TWP.esc(l.about)}</p>
    ${l.note ? `<div class="note">${TWP.esc(l.note)}</div>` : ''}
    <div class="acts"><a class="btn" href="${l.path + (l.app || 'index.html')}">Открыть урок</a></div>
  </article>`
});
</script>
</body>
</html>
