<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Светляк и его команда — ИИИБ, 5 класс</title>
<style>
:root {
  --bg:#eef3fb; --panel:#ffffff; --panel2:#e6eefa; --line:#c4d2ea;
  --ink:#16213a; --mut:#5a6a88; --cy:#0a8fb0; --mg:#c2329f; --ye:#f5c400; --gr:#1f9e63; --rd:#d23b4b;
  --r:14px;
}
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:17px/1.45 system-ui, 'Segoe UI', Arial, sans-serif; }
header { display:flex; align-items:center; gap:14px; padding:8px 16px; background:#16213a; color:#eef4ff; }
header h1 { font-size:18px; margin:0; }
#ekranImya { color:#9fd8ea; }
.tochki { display:flex; gap:4px; flex:1; }
.tochki i { width:10px; height:10px; border-radius:50%; background:#3a4a6e; }
.tochki i.on { background:var(--ye); }
.tochki i.done { background:#4fc3a1; }
.schetchiki { display:flex; gap:12px; font-size:15px; white-space:nowrap; }
.prilozhenie { display:grid; grid-template-columns:minmax(0,1fr) 330px; gap:14px; padding:12px 16px; max-width:1500px; margin:0 auto; }
.rabota { min-width:0; }
.panel { position:sticky; top:8px; align-self:start; display:flex; flex-direction:column; gap:10px; }
.svetlyak { background:var(--panel); border:2px solid var(--cy); border-radius:var(--r); padding:12px; }
.svetlyak .lico { font-size:30px; line-height:1; }
.bubble { background:var(--panel2); border-radius:12px; padding:10px 12px; margin-top:6px; min-height:70px; }
.bubble .uroven { display:block; color:var(--mut); font-size:13px; margin-top:4px; }
.pravila { background:#fffbe6; border:1px solid var(--ye); border-radius:var(--r); padding:10px 12px; font-size:15px; }
.pravila b { display:block; margin-bottom:4px; }
.pravila ol { margin:0; padding-left:20px; }
.pravila li { margin:4px 0; }
.pravila .novoe { animation:vspyshka 1.6s ease-out; }
@keyframes vspyshka { from { background:#ffe46b; } to { background:transparent; } }
section[hidden] { display:none; }
h2 { margin:4px 0 10px; font-size:23px; }
.master { background:var(--panel2); border-left:5px solid var(--cy); border-radius:var(--r); padding:10px 14px; margin:8px 0; }
.karta { background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:12px 14px; margin:10px 0; }
.ryad { display:flex; flex-wrap:wrap; gap:8px; margin:8px 0; }
button { font:inherit; border:1px solid var(--line); background:var(--panel); color:var(--ink); border-radius:10px; padding:8px 13px; cursor:pointer; }
button:hover { border-color:var(--cy); }
button.glav { background:var(--cy); color:#fff; border-color:var(--cy); }
button.da { background:#dff5e9; border-color:var(--gr); }
button:disabled { opacity:.45; cursor:default; }
.otvet { margin:8px 0; padding:8px 12px; border-radius:10px; }
.otvet.ok { background:#dff5e9; }
.otvet.ne { background:#fde3e7; }
.prosba { display:flex; justify-content:space-between; gap:12px; white-space:pre-line; }
.prosba .chto { flex:1; }
.blok-doski { background:#fff4c2; border:2px dashed var(--ye); border-radius:var(--r); padding:10px 14px; margin:10px 0; font-weight:600; }
.blok-doski:empty { display:none; }
.dalshe { margin-top:14px; text-align:right; }
.dve { display:grid; grid-template-columns:minmax(0,1.35fr) minmax(260px,1fr); gap:14px; align-items:start; }
.dve > .bok { position:sticky; top:8px; }
.dve .shema-svg { max-height:76vh; width:auto; margin:0 auto; }
.shema-mesto { background:#fffef6; border:1px solid var(--line); border-radius:var(--r); padding:6px; }
.ikona-mesto { max-width:330px; margin:6px auto; }
.krutilki { display:flex; gap:26px; flex-wrap:wrap; align-items:center; }
.knob { text-align:center; }
.knob svg { width:96px; height:96px; touch-action:none; cursor:grab; }
.knob .kn { display:flex; gap:6px; justify-content:center; align-items:center; }
.slyshno { font-family:'PT Mono', Consolas, monospace; font-size:20px; background:#16213a; color:#d8f5e0; border-radius:10px; padding:10px 14px; min-width:320px; margin-top:8px; }
.modeli { display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); gap:8px; }
.model { background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:8px 10px; font-size:14px; }
.model b { font-size:16px; }
.model .kto { color:var(--mut); }
.vid { display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin:6px 0; }
.vid .imya { width:170px; font-weight:600; }
.vid button { padding:6px 9px; font-size:15px; }
.vid button.vybran { background:var(--cy); color:#fff; }
.fajl { font-family:'PT Mono', Consolas, monospace; background:#16213a; color:#d8f5e0; border-radius:10px; padding:10px 14px; min-height:110px; font-size:14px; white-space:pre-wrap; }
pre.konspekt { background:#fffdf0; border:1px solid var(--ye); border-radius:10px; padding:10px 14px; font-size:15px; white-space:pre-wrap; }
.propusk { display:inline-block; min-width:90px; border-bottom:2px solid var(--cy); color:var(--cy); font-weight:700; }
.stroka-shablona { margin:6px 0; }
.stroka-shablona button { margin-left:6px; padding:4px 10px; }
.schet { font-size:22px; font-weight:700; color:var(--cy); }
.malo { color:var(--mut); font-size:14px; }
.sobrano { font-size:20px; font-weight:600; min-height:34px; }
</style>
</head>
<body>
<header>
  <h1>Светляк и его команда · <span id="ekranImya"></span></h1>
  <div class="tochki" id="tochki"></div>
  <div class="schetchiki"><span id="chasy"></span><span id="iskry"></span><span id="zvezdy"></span><span id="brigada"></span></div>
</header>
<div class="prilozhenie">
  <main class="rabota">
    <section id="e1"></section><section id="e2" hidden></section><section id="e3" hidden></section>
    <section id="e4" hidden></section><section id="e5" hidden></section><section id="e6" hidden></section>
    <section id="e7" hidden></section><section id="e8" hidden></section><section id="e9" hidden></section>
    <section id="e10" hidden></section><section id="e11" hidden></section><section id="e12" hidden></section>
  </main>
  <aside class="panel">
    <div class="svetlyak">
      <div class="lico">🔆 <b style="font-size:18px">Светляк</b></div>
      <div class="bubble" id="bubble"></div>
      <div class="ryad"><button id="podskazka"></button><button id="pejdzher"></button></div>
    </div>
    <div class="pravila" id="pravila"></div>
  </aside>
</div>

<script src="../../lib/menu-ekranov/menu-ekranov.js"></script>
<script src="../../lib/slova/slova.js"></script>
<script src="tekst.js"></script>
<script src="shema.js"></script>
<script>
/* ===== Данные: смена стажёра ===== */
var ID_EKRANOV = T.ekrany.map(idEkrana);
var EKRANY = T.ekrany.map(punktMenu);
var S;

// idEkrana: id экрана урока
function idEkrana(e) {
  return e.id;
}

// punktMenu: экран урока → пункт меню учителя
function punktMenu(e) {
  return { id: e.id, nazvanie: e.imya };
}

// novoeSostoyanie: состояние новой смены
function novoeSostoyanie() {
  var S = { ekran: 'e1', nomer: 0, iskry: T.iskr, potracheno: 0, oshibok: 0, t0: 0, pravila: [], bloki: [], podsk: {}, replika: T.e1.svetlyak };
  dobavitEkrany(S);
  return S;
}

// dobavitEkrany: начальное состояние каждого экрана
function dobavitEkrany(S) {
  S.e2 = { sluh: 0, oshibka: false, mic: T.e2.krutilki[0].nachalo, shum: T.e2.krutilki[1].nachalo, slyshno: '', uslyshal: false, otvet: -1 };
  S.e3 = { spec: '', prognoz: -1, byli: [], otvet: -1 };
  S.e4 = { i: 0 };
  S.e5 = { m: 0, put: [], oshibka: false, itogi: [], otvet: -1 };
  S.e6 = { i: 0, oshibka: false };
  S.e7 = { i: 0 };
  S.e8 = { vybor: {}, sdelal: false };
  S.e9 = { sborka: {}, ne: {}, dubler: {}, dne: {} };
  S.e10 = { zakaz: 0, shag: 0, fajl: [], otvet: '', propusk: false };
  S.e11 = { etap: 0, oshibka: '' };
  S.e12 = { i: 0, oshibka: false, sobrano: [] };
  return S;
}

/* ===== Нижний слой: разметка ===== */
var el = Slova.el, sozdat = Slova.sozdat;

// knopka: кнопка с текстом и действием
function knopka(tekst, dejstvie, klass) {
  var b = sozdat('button', klass || '', tekst);
  b.addEventListener('click', dejstvie);
  return b;
}

// abzac: блок с текстом и классом
function abzac(tekst, klass) {
  var p = sozdat('div', klass || '', tekst);
  return p;
}

// podstavit: заменить {ключ} в шаблоне на значения
function podstavit(shablon, znacheniya) {
  var t = shablon;
  Object.keys(znacheniya).forEach(function (k) { t = t.split('{' + k + '}').join(znacheniya[k]); });
  return t;
}

// poryadok: номера вариантов со сдвигом по длине текста (верный не всегда первый, порядок не прыгает)
function poryadok(tekst, n) {
  var sdvig = tekst.length % n;
  var nomera = [];
  for (var i = 0; i < n; i++) { nomera.push((i + sdvig) % n); }
  return nomera;
}

// minut: сколько минут идёт смена
function minut() {
  var m = S.t0 ? Math.floor((Date.now() - S.t0) / 60000) : 0;
  return m;
}

/* ===== Средний слой: смена, Светляк, правила, доска ===== */

// sohranit: записать смену и перерисовать открытый экран
function sohranit() {
  Slova.sohranit(T.klyuch, S);
  pokazatEkran(S.ekran);
  return S;
}

// skazat: реплика Светляка в боковой панели
function skazat(tekst) {
  S.replika = tekst;
  return tekst;
}

// oshibka: счёт ошибок для тона финала и реплика
function oshibka(tekst) {
  S.oshibok += 1;
  skazat(tekst);
  return S.oshibok;
}

// dobavitPravilo: правило мастерской появляется один раз
function dobavitPravilo(id, replika) {
  var novoe = S.pravila.indexOf(id) < 0;
  if (novoe) { S.pravila.push(id); S.novoePravilo = id; skazat(replika || 'Новое правило мастерской: ' + T.pravila[id].t); }
  return novoe;
}

// zakrytBlok: блок для доски (один раз)
function zakrytBlok(n) {
  if (S.bloki.indexOf(n) < 0) { S.bloki.push(n); Slova.sohranit(T.klyuch, S); }
  return S.bloki.length;
}

// blokDoski: плашка «иди к доске», если блок закрыт
function blokDoski(n) {
  var p = abzac(S.bloki.indexOf(n) >= 0 ? podstavit(T.doskaBlok, { n: n }) : '', 'blok-doski');
  return p;
}

// knopkaDalshe: переход на следующий экран; активна, когда экран пройден
function knopkaDalshe(sled, mozhno) {
  var d = abzac('', 'dalshe');
  var b = knopka(T.dalshe, function () { perejtiNa(sled); }, 'glav');
  b.disabled = !mozhno;
  d.appendChild(b);
  return d;
}

// perejtiNa: следующий экран и реплика Светляка по умолчанию
function perejtiNa(id) {
  S.ekran = id;
  skazat('Я рядом. Застрял — жми «Подсказка».');
  sohranit();
  window.scrollTo(0, 0);
  return id;
}

// vybory: варианты ответа (перемешаны); верный — dalee(i), неверный — объяснение
function vybory(v, dalee, neVerno) {
  var ryad = abzac('', 'ryad');
  poryadok(v.q, v.opts.length).forEach(function (i) {
    ryad.appendChild(knopka(v.opts[i], function () { otvetit(i, v, dalee, neVerno); }));
  });
  return ryad;
}

// otvetit: верно — dalee(i), неверно — ошибка с объяснением
function otvetit(i, v, dalee, neVerno) {
  var verno = i === v.ok;
  if (verno) { dalee(i); }
  if (!verno) { oshibka(v.pochemu ? v.pochemu[i] : neVerno); }
  sohranit();
  return verno;
}

/* ===== Подсказки и панель ===== */

// podskazkiEkrana: лестница подсказок открытого экрана
function podskazkiEkrana() {
  var ekran = T[S.ekran] || {};
  var lest = S.ekran === 'e2' && S.e2.sluh >= T.e2.bloki.length ? T.e2.krutilkiPodskazki : ekran.podskazki;
  return lest || null;
}

// klyuchPodskazki: у крутилок на экране 2 — своя лестница
function klyuchPodskazki() {
  var k = S.ekran === 'e2' && S.e2.sluh >= T.e2.bloki.length ? 'e2k' : S.ekran;
  return k;
}

// vzyatPodskazku: следующая ступень лестницы за одну искру
function vzyatPodskazku() {
  var lest = podskazkiEkrana(), k = klyuchPodskazki(), uroven = S.podsk[k] || 0;
  var mozhno = !!lest && S.iskry > 0 && uroven < 3;
  if (mozhno) { S.iskry -= 1; S.potracheno += 1; S.podsk[k] = uroven + 1; }
  skazat(tekstPodskazki(lest, mozhno, S.podsk[k] || 0));
  sohranit();
  return mozhno;
}

// tekstPodskazki: ступень лестницы, «не нужна» или «искры кончились»
function tekstPodskazki(lest, mozhno, uroven) {
  var t = !lest ? T.podskazkiNet : (mozhno || uroven >= 3 ? lest[uroven - 1] : T.podskazkiKonchilis);
  return t;
}

// panel: реплика Светляка, кнопки, правила мастерской
function panel() {
  var b = el('bubble'), ur = S.podsk[klyuchPodskazki()];
  b.textContent = S.replika;
  if (ur) { b.appendChild(sozdat('span', 'uroven', 'подсказка ' + ur + ' из 3')); }
  el('podskazka').textContent = T.podskazkaKnopka;
  el('pejdzher').textContent = '📟 ' + T.pejdzher;
  spisokPravil();
  return S.replika;
}

// spisokPravil: правила мастерской, новое — со вспышкой
function spisokPravil() {
  var p = el('pravila');
  p.innerHTML = '';
  p.hidden = !S.pravila.length;
  p.appendChild(sozdat('b', '', '📋 ' + T.pravilaZag));
  var ol = sozdat('ol', '', '');
  S.pravila.forEach(function (id) { ol.appendChild(sozdat('li', id === S.novoePravilo ? 'novoe' : '', T.pravila[id].t)); });
  p.appendChild(ol);
  return S.pravila.length;
}

/* ===== Экран 1. Мастерская ===== */
// ekran1: мастер рассказывает, стажёр выбирает номер бригады
function ekran1(sek) {
  sek.appendChild(sozdat('h2', '', 'Мастерская Эхо-Узла'));
  T.e1.replika.forEach(function (t) { sek.appendChild(abzac(t, 'master')); });
  var karta = abzac(T.e1.nomer, 'karta');
  var ryad = abzac('', 'ryad');
  for (var n = 1; n <= T.doska.brigad; n++) { ryad.appendChild(knopkaNomera(n)); }
  karta.appendChild(ryad);
  sek.appendChild(karta);
  sek.appendChild(knopkaDalshe('e2', S.nomer > 0));
  sek.appendChild(knopka(T.e1.novaya, novayaSmena));
  return sek;
}

// knopkaNomera: номер бригады; первый выбор запускает часы смены
function knopkaNomera(n) {
  var b = knopka(String(n), function () { S.nomer = n; S.t0 = S.t0 || Date.now(); sohranit(); }, S.nomer === n ? 'glav' : '');
  return b;
}

/* ===== Экран 2. Слух Светляка ===== */
// ekran2: цепочка слуха как в «Эхо-Узле», крутилки на шумной кухне, просьбы жителей
function ekran2(sek) {
  sek.appendChild(sozdat('h2', '', 'Слух Светляка'));
  sek.appendChild(abzac(T.e2.vvod, 'master'));
  sek.appendChild(cepochkaSluha());
  if (S.e2.sluh >= T.e2.bloki.length) { sek.appendChild(kuhnya()); }
  if (S.e2.uslyshal) { sek.appendChild(prosbyZhitelej()); }
  sek.appendChild(knopkaDalshe('e3', S.e2.otvet === T.e2.vopros.ok));
  return sek;
}

// cepochkaSluha: блоки слуха — нажимать по порядку
function cepochkaSluha() {
  var karta = abzac('', 'karta');
  var ryad = abzac('', 'ryad');
  poryadok('слух', T.e2.bloki.length).forEach(function (i) { ryad.appendChild(knopkaSluha(i)); });
  karta.appendChild(ryad);
  var gotovo = T.e2.bloki.slice(0, S.e2.sluh).map(opisanieBloka).join(' → ');
  karta.appendChild(abzac(gotovo ? 'Цепочка: ' + gotovo : 'Цепочка пока пустая.', 'malo'));
  if (S.e2.oshibka) { karta.appendChild(abzac(T.e2.oshibka, 'otvet ne')); }
  return karta;
}

// opisanieBloka: «Микрофон (звук)»
function opisanieBloka(b) {
  return b.imya + ' (' + b.chto + ')';
}

// knopkaSluha: блок слуха; верный следующий — засчитать, иначе — подсказка
function knopkaSluha(i) {
  var proiden = i < S.e2.sluh;
  var k = knopka(T.e2.bloki[i].imya, function () { nazhatSluh(i); }, proiden ? 'da' : '');
  k.disabled = proiden;
  return k;
}

// nazhatSluh: тот ли блок следующий
function nazhatSluh(i) {
  var verno = i === S.e2.sluh;
  S.e2.sluh += verno ? 1 : 0;
  S.e2.oshibka = !verno;
  if (!verno) { oshibka(T.e2.oshibka); }
  sohranit();
  return verno;
}

// kuhnya: две крутилки и «Слушать»; Светляк слышит, если обе в своём окне
function kuhnya() {
  var karta = abzac('', 'karta');
  karta.appendChild(abzac(T.e2.kuhnya, ''));
  var r = abzac('', 'krutilki');
  T.e2.krutilki.forEach(function (k) { r.appendChild(krutilka(k)); });
  var pravo = abzac('', '');
  pravo.appendChild(knopka('🎙 ' + T.e2.knopkaSlushat, slushat, 'glav'));
  pravo.appendChild(abzac(S.e2.slyshno || '…', 'slyshno'));
  r.appendChild(pravo);
  karta.appendChild(r);
  if (S.e2.uslyshal) { karta.appendChild(abzac(T.e2.uslyshal, 'otvet ok')); }
  return karta;
}

// krutilka: ручка с циферблатом, «−» и «+»; тянуть мышью — тоже крутит
function krutilka(k) {
  var d = abzac('', 'knob');
  d.appendChild(ciferblat(S.e2[k.id], k));
  var kn = abzac('', 'kn');
  kn.appendChild(knopka('−', function () { povernut(k, -k.shag); }));
  kn.appendChild(sozdat('b', '', String(S.e2[k.id])));
  kn.appendChild(knopka('+', function () { povernut(k, k.shag); }));
  d.appendChild(kn);
  d.appendChild(abzac(k.imya, 'malo'));
  return d;
}

// ciferblat: SVG ручки — стрелка по значению
function ciferblat(v, k) {
  var dolya = (v - k.min) / (k.max - k.min), ugol = (-135 + 270 * dolya) * Math.PI / 180;
  var x = 48 + 30 * Math.sin(ugol), y = 48 - 30 * Math.cos(ugol);
  var obertka = abzac('', '');
  obertka.innerHTML = '<svg viewBox="0 0 96 96"><circle cx="48" cy="48" r="38" fill="#e6eefa" stroke="#9fb3d6" stroke-width="6"/>' +
    '<circle cx="48" cy="48" r="28" fill="#16213a"/><line x1="48" y1="48" x2="' + x + '" y2="' + y + '" stroke="#f5c400" stroke-width="6" stroke-linecap="round"/></svg>';
  obertka.firstChild.addEventListener('pointerdown', function (e) { tyanut(e, k); });
  return obertka;
}

// tyanut: поворот ручки мышью или пальцем — вверх и вправо больше
function tyanut(e, k) {
  var start = { x: e.clientX, y: e.clientY, v: S.e2[k.id] };
  var dvizhenie = function (ev) { ustanovit(k, start.v + Math.round(((ev.clientX - start.x) - (ev.clientY - start.y)) / 4 / k.shag) * k.shag); };
  var konec = function () { window.removeEventListener('pointermove', dvizhenie); window.removeEventListener('pointerup', konec); sohranit(); };
  window.addEventListener('pointermove', dvizhenie);
  window.addEventListener('pointerup', konec);
  return start.v;
}

// ustanovit: значение ручки в своих пределах
function ustanovit(k, v) {
  S.e2[k.id] = Math.max(k.min, Math.min(k.max, v));

  if (podhodit) { S.e9[pole][vid] = m.id; }
  S.e9[pNe][vid] = podhodit ? '' : podstavit(T.e9.neMoe, { model: m.imya, delo: m.delo });
  if (!podhodit) { S.oshibok += 1; }
  sohranit();
  return podhodit;
}

// sobrano: у всех видов задач есть модель
function sobrano(nabor) {
  var vse = true;
  T.e9.vidy.forEach(function (v) { vse = vse && !!nabor[v.id]; });
  return vse;
}

// raznyhModelej: сколько разных моделей под капотом
function raznyhModelej(nabor) {
  var spisok = [];
  T.e9.vidy.forEach(function (v) { if (nabor[v.id] && spisok.indexOf(nabor[v.id]) < 0) { spisok.push(nabor[v.id]); } });

}

// otlichij: сколько видов задач у дублёра закрыто другой моделью

}

}

/* ===== Экран 10. Стол заказов ===== */

}

// tekushchijZakaz: заказ, его шаг и варианты действий
function tekushchijZakaz() {
  var z = T.e10.zakazy[S.e10.zakaz], sh = z.shagi[S.e10.shag];
  var karta = abzac('', 'karta');
  karta.appendChild(abzac('Заказ ' + (S.e10.zakaz + 1) + ' из ' + T.e10.zakazy.length + ': ' + z.zakaz, 'master'));
  karta.appendChild(abzac('Шаг ' + (S.e10.shag + 1) + ' из ' + z.shagi.length + '. ' + sh.chto, ''));
  var ryad = abzac('', 'ryad');
  variantyShaga(sh).forEach(function (o) { ryad.appendChild(knopka(o.t, function () { vypolnitShag(o); })); });
  karta.appendChild(ryad);
  if (S.e10.otvet) { karta.appendChild(abzac(S.e10.otvet, 'otvet ne')); }
  return karta;
}

// variantyShaga: готовые варианты шага или «действие → модель»
function variantyShaga(sh) {
  var spisok = sh.opts ? sh.opts.slice() : variantyModelej(sh);
  spisok.sort(poAlfavitu);
  return spisok;
}

// poAlfavitu: порядок вариантов по тексту (верный не всегда первый)
function poAlfavitu(a, b) {
  return a.t < b.t ? -1 : 1;
}

// variantyModelej: своя модель из сборки (верно) и до двух моделей, которых этому не учили (неверно)
function variantyModelej(sh) {
  var svoya = modelPoId(S.e9.sborka[sh.vid]);
  var spisok = [{ t: sh.dejstvie + ' → ' + svoya.imya, ok: true, fajl: podstavit(sh.fajl, { model: svoya.imya }) }];
  T.modeli.forEach(function (m) { dobavitChuzhuyu(spisok, sh, m); });
  return spisok;
}

// dobavitChuzhuyu: модель, которую этому не учили, — неверный вариант (всего не больше трёх)
function dobavitChuzhuyu(spisok, sh, m) {
  var mozhno = m.vidy.indexOf(sh.vid) < 0 && spisok.length < 3;
  if (mozhno) { spisok.push(chuzhojVariant(sh, m)); }
  return spisok.length;
}

// chuzhojVariant: неверный вариант — модель и её отказ
function chuzhojVariant(sh, m) {
  var o = { t: sh.dejstvie + ' → ' + m.imya, ok: false, pochemu: podstavit(T.e10.neTot, { model: m.imya, vid: imyaVida(sh.vid) }) };
  return o;
}

// modelPoId: карточка модели по id (нет — заглушка)
function modelPoId(id) {
  var m = { id: '', imya: '—', vidy: [] };
  T.modeli.forEach(function (x) { if (x.id === id) { m = x; } });
  return m;
}

// imyaVida: название вида задач по id
function imyaVida(id) {
  var imya = id;
  T.e9.vidy.forEach(function (x) { if (x.id === id) { imya = x.imya.toLowerCase(); } });
  return imya;
}

// vypolnitShag: верно — строка в общий файл и следующий шаг, неверно — объяснение
function vypolnitShag(o) {
  S.e10.otvet = o.ok ? '' : o.pochemu;
  if (!o.ok) { oshibka(o.pochemu); }
  if (o.ok) { S.e10.fajl.push(o.fajl); sledShag(); skazat('Записано в общий файл.'); }
  if (o.ok && /слово в слово/.test(o.t)) { dobavitPravilo(T.e10.pravilo); }
  sohranit();
  return o.ok;
}

// sledShag: следующий шаг заказа или следующий заказ
function sledShag() {
  var z = T.e10.zakazy[S.e10.zakaz];
  S.e10.shag += 1;
  if (S.e10.shag >= z.shagi.length) { S.e10.zakaz += 1; S.e10.shag = 0; S.e10.fajl.push('—'); }
  return S.e10.zakaz;
}

// okoshkoFajla: общий файл — строки «кто: что»
function okoshkoFajla() {
  var d = abzac('📄 ' + T.e10.fajl, 'malo');
  d.appendChild(abzac(S.e10.fajl.length ? S.e10.fajl.join('\n') : '(пока пусто)', 'fajl'));

}

/* ===== Экран 11. Ремонт схемы ===== */

function klassyRemonta() {

function shagRemonta() {
  var e = S.e11.etap, karta = abzac('', 'karta');

function zakonchitRemont() {
  S.e11.etap = 3;
  S.e11.oshibka = '';
  skazat(T.e11.gotovo);
  return S.e11.etap;
}

// nazhatRemont: шаг 1 — найти блок не на месте, шаг 2 — место, куда он встаёт
function nazhatRemont(id) {
  var e = S.e11.etap, nuzhen = [T.e11.lomka, T.e11.mesto][e];
  var verno = !!nuzhen && id === nuzhen;
  S.e11.etap += verno ? 1 : 0;
  S.e11.oshibka = nuzhen && !verno ? [T.e11.neVerno, T.e11.neMesto][e] : '';
  if (S.e11.oshibka) { oshibka(S.e11.oshibka); }
  sohranit();
  return verno;
}

/* ===== Экран 12. Итог смены ===== */
// ekran12: вопросы по своей ДРАКОН-ГРАФ-схеме, сборка вывода, ДЗ и концовка

  sek.appendChild(sozdat('h2', '', 'Итог смены'));

// voprosItoga: вопрос по схеме в тетради
function voprosItoga() {
  var v = T.e12.voprosy[S.e12.i];
  var karta = abzac('Вопрос ' + (S.e12.i + 1) + ' из ' + T.e12.voprosy.length + '. ' + v.q, 'karta');

// sobratVyvod: части вывода (с лишними) — нажимать по порядку
function sobratVyvod() {
  var karta = abzac(T.e12.sobrat, 'karta'), vse = T.e12.chasti.concat(T.e12.lishnie);
  karta.appendChild(abzac(S.e12.sobrano.join(' ') || '…', 'sobrano'));
  var ryad = abzac('', 'ryad');
  poryadok('вывод', vse.length).forEach(function (i) { ryad.appendChild(knopkaChasti(vse[i])); });

}

// knopkaChasti: часть вывода; уже взятая — серая
function knopkaChasti(chast) {
  var vzyata = S.e12.sobrano.indexOf(chast) >= 0;
  var b = knopka(chast, function () { vzyatChast(chast); }, vzyata ? 'da' : '');
  b.disabled = vzyata;
  return b;
}

// vzyatChast: следующая по порядку часть — в вывод, иначе — подсказка
function vzyatChast(chast) {
  var verno = T.e12.chasti[S.e12.sobrano.length] === chast;
  if (verno) { S.e12.sobrano.push(chast); }
  S.e12.oshibka = !verno;
  if (!verno) { oshibka(T.e12.neTa); }
  sohranit();
  return verno;
}
