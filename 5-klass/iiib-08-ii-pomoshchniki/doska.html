<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Готовность мастерской — доска</title>
<style>
:root { --bg:#eef3fb; --panel:#fff; --line:#c4d2ea; --ink:#16213a; --mut:#5a6a88; --cy:#0a8fb0; --ye:#f5c400; --gr:#1f9e63; }
* { box-sizing:border-box; }
html, body { height:100%; margin:0; overflow:hidden; }
body { background:var(--bg); color:var(--ink); font:clamp(14px, 2.2vh, 24px)/1.3 system-ui, 'Segoe UI', Arial, sans-serif; display:flex; flex-direction:column; }
header { padding:1vh 2vw; background:#16213a; color:#eef4ff; display:flex; align-items:baseline; gap:2vw; }
h1 { margin:0; font-size:clamp(20px, 4vh, 40px); white-space:nowrap; }
.pod { color:#9fd8ea; font-size:clamp(12px, 2vh, 20px); }
main { flex:1; min-height:0; padding:1.5vh 2vw; display:grid; grid-template-columns:2fr 1fr; gap:2vw; }
.lev { display:flex; flex-direction:column; gap:1.5vh; min-height:0; }
.brigady { flex:1; min-height:0; display:grid; grid-template-columns:repeat(4, 1fr); grid-template-rows:repeat(2, 1fr); gap:1.5vh 1vw; }
.brigada { background:var(--panel); border:2px solid var(--line); border-radius:16px; padding:0.5vh; display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; font:inherit; color:inherit; }
.brigada.vybrana { border-color:var(--cy); box-shadow:0 0 0 4px #0a8fb033; }
.nomer { font-size:clamp(24px, 6vh, 60px); font-weight:700; line-height:1; }
.segmenty { display:flex; gap:0.6vw; margin:1vh 0; }
.seg { width:3.4vh; height:3.4vh; border-radius:50%; background:#dde4f0; }
.seg.gorit { background:var(--ye); box-shadow:0 0 10px var(--ye); }
.svetlyaki { font-size:clamp(12px, 2.4vh, 26px); min-height:3vh; }
.dejstviya { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:1.2vh 1vw; min-height:11vh; }
.knopki { display:flex; flex-wrap:wrap; gap:0.8vw; margin-top:0.8vh; }
.knopki button { font:inherit; padding:1vh 1.2vw; border-radius:12px; border:1px solid var(--line); background:#fff; cursor:pointer; }
.knopki button.glav { background:var(--cy); color:#fff; border-color:var(--cy); }
.prav { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:1.5vh 1vw; display:flex; flex-direction:column; min-height:0; }
.chislo { font-size:clamp(30px, 8vh, 80px); font-weight:700; line-height:1.1; }
.shkala { height:3.5vh; background:#dde4f0; border-radius:2vh; overflow:hidden; margin:1vh 0; }
.shkala div { height:100%; background:linear-gradient(90deg, var(--cy), var(--gr)); }
.pole { flex:1; min-height:0; display:grid; grid-template-columns:repeat(5, 1fr); gap:3px; margin-top:0.8vh; }
.kletka { border-radius:4px; background:#dde4f0; }
.kletka.gorit { background:var(--gr); }
.malo { color:var(--mut); font-size:clamp(11px, 1.7vh, 18px); }
#novaya { font:inherit; font-size:clamp(11px, 1.6vh, 16px); margin-top:0.8vh; align-self:flex-start; }
</style>
</head>
<body>
<header>
  <h1 id="zagolovok"></h1>
  <div class="pod" id="pod"></div>
</header>
<main>
  <div class="lev">
    <div class="brigady" id="brigady"></div>
    <div class="dejstviya" id="dejstviya"></div>
  </div>
  <div class="prav">
    <b>Готовность мастерской</b>
    <div class="chislo" id="procent"></div>
    <div class="shkala"><div id="shkala"></div></div>
    <div id="svetlyakov"></div>
    <div class="malo" id="poleZag"></div>
    <div class="pole" id="pole"></div>
    <button id="novaya">Новая смена / начать заново</button>
  </div>
</main>

<script src="../../lib/menu-ekranov/menu-ekranov.js"></script>
<script src="../../lib/slova/slova.js"></script>
<script src="tekst.js"></script>
<script>
var D = T.doska, VIDY = T.e9.vidy;
var el = Slova.el, sozdat = Slova.sozdat;
var B;

// novayaDoska: табло новой смены — у каждой бригады пустые блоки, нет Светляков
function novayaDoska() {
  var b = { vybrana: 0, brigady: [] };
  for (var n = 0; n < D.brigad; n++) { b.brigady.push({ bloki: [], sobran: false, dublery: 0 }); }
  return b;
}

// knopka: кнопка с текстом и действием
function knopka(tekst, dejstvie, klass) {
  var k = sozdat('button', klass || '', tekst);
  k.addEventListener('click', dejstvie);
  return k;
}

// zapisat: сохранить табло и перерисовать
function zapisat() {
  Slova.sohranit(T.klyuchDoski, B);
  narisovat();
  return B;
}

// plitkaBrigady: номер, огоньки блоков, Светляки бригады
function plitkaBrigady(br, i) {
  var p = knopka('', function () { B.vybrana = i + 1; zapisat(); }, 'brigada' + (B.vybrana === i + 1 ? ' vybrana' : ''));
  p.appendChild(sozdat('div', 'nomer', String(i + 1)));
  var seg = sozdat('div', 'segmenty', '');
  for (var k = 1; k <= D.blokov; k++) { seg.appendChild(sozdat('span', 'seg' + (br.bloki.indexOf(k) >= 0 ? ' gorit' : ''), '')); }
  p.appendChild(seg);
  p.appendChild(sozdat('div', 'svetlyaki', '🔆'.repeat(svetlyakovBrigady(br))));
  return p;
}

// svetlyakovBrigady: собранный Светляк и его дублёры
function svetlyakovBrigady(br) {
  var n = (br.sobran ? 1 : 0) + br.dublery;
  return n;
}

// panelDejstvij: что отметить выбранной бригаде
function panelDejstvij() {
  var p = el('dejstviya');
  p.innerHTML = '';
  if (!B.vybrana) { p.appendChild(sozdat('div', 'malo', D.vybratNomer)); }
  if (B.vybrana) { knopkiBrigady(p, B.brigady[B.vybrana - 1]); }
  return p;
}

// knopkiBrigady: блоки 1–4, «Светляк собран», «+ дублёр», «Готово»
function knopkiBrigady(p, br) {
  p.appendChild(sozdat('b', '', 'Бригада № ' + B.vybrana));
  var r = sozdat('div', 'knopki', '');
  for (var k = 1; k <= D.blokov; k++) { r.appendChild(knopkaBloka(br, k)); }
  r.appendChild(knopka(D.sobran, function () { br.sobran = true; zapisat(); }, br.sobran ? '' : 'glav'));
  r.appendChild(knopka(D.dubler, function () { br.dublery += 1; zapisat(); }));
  r.appendChild(knopka('Готово', function () { B.vybrana = 0; zapisat(); }));
  p.appendChild(r);
  return r;
}

// knopkaBloka: отметить блок k (повторное нажатие ничего не меняет)
function knopkaBloka(br, k) {
  var est = br.bloki.indexOf(k) >= 0;
  var b = knopka('Блок ' + k + (est ? ' ✔' : ''), function () { if (!est) { br.bloki.push(k); } zapisat(); }, est ? '' : 'glav');
  return b;
}

// gotovnost: доля готовности — блоки, Светляки и дублёры всех бригад вместе
function gotovnost() {
  var est = 0;
  B.brigady.forEach(function (br) { est += br.bloki.length + svetlyakovBrigady(br); });
  var vsego = D.brigad * (D.blokov + 2);
  return Math.min(100, Math.round(100 * est / vsego));
}

// vsegoSvetlyakov: сколько Светляков и дублёров в работе
function vsegoSvetlyakov() {
  var n = 0;
  B.brigady.forEach(function (br) { n += svetlyakovBrigady(br); });
  return n;
}

// poleZadach: ряды видов задач; горит по ряду на каждого Светляка
function poleZadach() {
  var pole = el('pole'), gorit = vsegoSvetlyakov(), ryadov = D.brigad * 2;
  pole.innerHTML = '';
  pole.style.gridTemplateRows = 'repeat(' + ryadov + ', 1fr)';
  for (var r = 0; r < ryadov * VIDY.length; r++) { pole.appendChild(sozdat('div', 'kletka' + (Math.floor(r / VIDY.length) < gorit ? ' gorit' : ''), '')); }
  return gorit;
}

// narisovat: всё табло по состоянию
function narisovat() {
  var g = gotovnost();
  el('brigady').innerHTML = '';
  B.brigady.forEach(function (br, i) { el('brigady').appendChild(plitkaBrigady(br, i)); });
  panelDejstvij();
  el('procent').textContent = g + ' %';
  el('shkala').style.width = g + '%';
  el('svetlyakov').textContent = 'Светляков в работе: ' + vsegoSvetlyakov();
  poleZadach();
  return g;
}

// novayaSmena: чистое табло для следующего класса
function novayaSmena() {
  B = novayaDoska();
  zapisat();
  return B;
}

// imenaVidov: «Голос и умный дом · Текст и ответы · …»
function imenaVidov() {
  var spisok = [];
  VIDY.forEach(function (v) { spisok.push(v.imya); });
  return spisok.join(' · ');
}

el('zagolovok').textContent = D.zagolovok;
el('pod').textContent = D.podzagolovok;
el('poleZag').textContent = D.pole + ': ' + imenaVidov();
B = Slova.zagruzit(T.klyuchDoski, novayaDoska, function (s) { return !!s.brigady; });
narisovat();
el('novaya').addEventListener('click', novayaSmena);
Slova.podklyuchitMenu({ ekrany: [{ id: 'doska', nazvanie: 'Табло' }], perejti: narisovat,
  sluzhebnoe: [{ nazvanie: 'Новая смена (очистить табло)', dejstvie: novayaSmena }] });
</script>
</body>
</html>
